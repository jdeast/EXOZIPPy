name: Intel macOS

# A SEPARATE WORKFLOW, DELIBERATELY -- read before folding this into
# tests.yml.
#
# The branch ruleset requires a status check named `test`, aggregated by the
# gate job at the bottom of tests.yml. Anything living in that file is one
# `needs:` edit away from becoming a merge blocker, and this platform must
# never be one: it is a probe of a stack we do not yet claim to support, on
# hardware Apple has stopped making. Keeping it in its own file means it
# cannot gate a pull request by accident.
#
# Being a separate file is also what makes running on every pull request
# affordable. This job is slow -- exoplanet-core and celerite2 ship no
# macOS x86_64 wheels and source-build here -- but it is not in the `test`
# gate's `needs:`, so however long it takes and however red it goes, a pull
# request stays mergeable on the strength of the Linux matrix alone.
on:
  # `branches: [master]` here and NO `branches:` filter on pull_request, for
  # the reason spelled out at the top of tests.yml: a pull request targeting
  # anything other than master would otherwise get no run at all, and
  # retargeting it later does not start one. Keep the two workflows'
  # triggers in agreement -- a platform job that skips exactly the stacked
  # pull requests is a platform job that misses the bad merges.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Run the whole pytest suite instead of the smoke subset"
        type: boolean
        default: false
      strict_probe:
        description: "Fail the job if any JAX sampler probe fails"
        type: boolean
        default: false
  schedule:
    # 08:00 UTC, an hour after tests.yml's nightly, so the two do not
    # contend for runners or interleave in the Actions list.
    - cron: "0 8 * * *"

jobs:
  probe:
    name: probe
    # macos-15-intel is a STANDARD runner (4 CPU / 14 GB), which the GitHub
    # docs describe as "free and unlimited on public repositories" -- and
    # this repository is public, so this job costs nothing. Do NOT switch to
    # `macos-15-large`: that label points at the same image but is a LARGER
    # runner (12 CPU / 30 GB) and is billed even on public repositories.
    #
    # macos-13, the old free Intel runner, has been REMOVED from
    # actions/runner-images -- not deprecated, removed -- so a workflow
    # naming it fails to find a runner rather than warning. `macos-26-intel`
    # is the other current Intel label; macOS 26 is expected to be the last
    # Intel release, so these labels have a finite life and this job will
    # eventually need the same retirement treatment macos-13 got.
    runs-on: macos-15-intel
    # Source builds plus a full suite is the worst case; the smoke path is
    # far quicker. Generous rather than tight, since a job cancelled at the
    # cap produces no result at all -- the mistake Windows CI made.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # 3.14 is deliberately absent and is not an oversight: the Intel-Mac
        # ceiling for numba is 0.62.1 and for jaxlib is 0.4.38, and neither
        # publishes a cp314 wheel. If this platform is ever supported
        # officially, that constraint belongs in requires-python's
        # documentation, not in a matrix entry that cannot pass.
        python-version: ["3.12", "3.13"]

    steps:
      # fetch-depth: 0 so poetry-dynamic-versioning can see tags. Without it
      # the build is 0.0.0, which is harmless here but makes the version in
      # the probe's report meaningless.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The toolchain is load-bearing on this platform in a way it is not
      # elsewhere: exoplanet-core and celerite2 both source-build here, so
      # when one of them fails to compile the clang version is the first
      # thing anyone will want. Recorded up front rather than reconstructed
      # from a build log.
      - name: Record the platform and toolchain
        run: |
          set -x
          uname -m
          sw_vers
          xcode-select -p || true
          clang --version || true
          python -c "import platform; print(platform.platform(), platform.machine())"

      # Same Zenodo spectra and astropy ephemeris caches as tests.yml, with
      # the SAME keys -- cache entries are not scoped per-OS and both
      # payloads are platform-independent data files, so this job is usually
      # a hit populated by the Linux matrix. Only the full-suite path reads
      # them; restoring on the smoke path is a few wasted seconds and keeps
      # the two paths' setup identical.
      #
      # Keep the paths in sync with bc_grid.DEFAULT_MODEL_ROOT by hand --
      # see the long comment in tests.yml for why that has bitten before.
      - name: Cache the Zenodo model spectra
        uses: actions/cache@v6
        with:
          path: |
            src/exozippy/models/NextGen/BCs/NextGen.spectra.csv
            src/exozippy/models/NextGen/BCs/NextGen.wavelength.csv
          key: nextgen-spectra-p2-7a2b81333f6a5bfccd4cbc07bdea6648

      - name: Cache the astropy ephemeris kernel
        uses: actions/cache@v6
        with:
          path: ~/.astropy/cache
          key: astropy-cache-de430

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # celerite2 has to be built BEFORE the bulk install, and outside pip's
      # build isolation, or nothing else here matters.
      #
      # It ships no macOS x86_64 wheel, so pip source-builds it -- and
      # 0.3.3's [build-system] requires names `jax==0.8.0`, which build
      # isolation resolves in a fresh environment our pins cannot reach.
      # jaxlib 0.8.0 has no Intel wheel, so the whole install dies before
      # any C++ is compiled.
      #
      # That build dependency is not structural. celerite2's own
      # CMakeLists declares BUILD_JAX an option and prints "Skipping JAX
      # extension" when `from jax import ffi` fails; the pymc and numpy
      # backends do not use it. So: install the real build requirements
      # ourselves, turn the JAX extension off explicitly rather than
      # relying on the graceful-skip path, and build with
      # --no-build-isolation. The bulk install below then sees celerite2
      # already satisfied and leaves it alone.
      #
      # Upstream fix that would delete this step: drop `jax==0.8.0` from
      # celerite2's build requires, since CMake already treats it as
      # optional.
      # numpy is pinned to the SAME range the bulk install uses, not left
      # free. Without that, pip resolves the newest numpy here, celerite2's
      # extension compiles against those headers, and the bulk install then
      # downgrades numpy under it -- a compiled module running against an
      # older numpy than it was built for, which fails at import in a way
      # that looks nothing like its cause.
      # setuptools_scm is in this list, and it is NOT in celerite2's
      # [build-system] requires -- but that is OUR problem, not an upstream
      # one, and the distinction cost a nearly-filed bug report.
      #
      # celerite2 sets metadata.version.provider =
      # "scikit_build_core.metadata.setuptools_scm", and that plugin
      # declares its own requirement dynamically:
      #     def get_requires_for_dynamic_metadata(...):
      #         return ["setuptools-scm"]
      # PEP 517's get_requires_for_build_wheel hook is how an ISOLATED
      # build learns about it, and pip installs it automatically. Passing
      # --no-build-isolation skips that hook, so we inherit the job of
      # supplying it (run 31745147326). Upstream is fine here.
      #
      # No SETUPTOOLS_SCM_PRETEND_VERSION: setuptools_scm reads the version
      # from an sdist's PKG-INFO when there is no .git, which is the
      # supported path and keeps the built version honest instead of
      # asserting one that might not match what pip resolved.
      - name: Pre-build celerite2 without its jax build dependency
        run: |
          set -euo pipefail
          pip install scikit-build-core "numpy>=2.0,<2.4" pybind11 \
            cmake ninja setuptools setuptools_scm
          pip install --no-build-isolation \
            --config-settings=cmake.define.BUILD_JAX=OFF \
            "celerite2>=0.3.3,<0.4.0"
          python -c "import celerite2; print('celerite2', celerite2.__version__)"

      # A PLAIN install, which is the point: pyproject's environment markers
      # now carry the Intel-Mac caps, so this is exactly what a user gets
      # from `pip install exozippy[gui]` here. It replaced a generated
      # requirements file (.github/scripts/intel_mac_deps.py, now deleted)
      # that existed only to test those caps before they were committed --
      # keeping it would have left a second copy of the pin set to drift.
      - name: Install exozippy
        run: pip install ".[gui]"

      - name: Install the test harness
        run: pip install pytest pytest-timeout pytest-xdist httpx

      # Reported, not enforced. `pip check` complains here because
      # exoplanet-core[pymc] declares jax for its optional FFI backend and
      # this platform deliberately installs none -- which is the supported
      # configuration, not a defect. Kept visible so a NEW inconsistency is
      # noticeable in the log.
      - name: Report dependency consistency
        continue-on-error: true
        run: |
          pip check || echo "(expected: this platform ships no jax)"

      - name: Record the resolved versions
        run: pip freeze | tee resolved-intel-mac.txt

      - name: Import smoke test
        run: |
          python -c "import exozippy; print('exozippy', exozippy.__file__)"
          python -c "import exozippy.run, exozippy.system, exozippy.config"

      # REPORTED, NOT ENFORCED, and expected to fail on this platform today.
      #
      # celerite2 builds and imports here, but celerite2/pymc/ops.py does
      # `from pytensor.link.jax.dispatch import jax_funcify` at module
      # scope, so its PyMC backend hard-requires jax at IMPORT time even
      # though its CMake treats the JAX extension as optional at BUILD time
      # (run 31745503105). With no jax there is therefore no GP support,
      # and `import exozippy` is unaffected only because gp.py imports
      # celerite2 lazily.
      #
      # Left as a probe rather than a check so the job records whether this
      # is still true -- an upstream celerite2 that stopped importing jax
      # eagerly, or a decision to ship jax 0.4.38 here, would turn it green
      # without anyone editing the workflow.
      - name: Probe celerite2's PyMC backend
        continue-on-error: true
        run: |
          python -c "from celerite2.pymc import terms; print('celerite2.pymc OK')"

      # THE POINT OF THIS WORKFLOW. Everything above is setup.
      #
      # Reports a probe x sampler matrix into the job summary and exits 0
      # even when probes fail, because on this platform a partial failure is
      # the expected finding and a red step would bury the table that is the
      # whole output. Pass strict_probe on a manual run once we know what
      # "working" looks like here and want regressions to be loud.
      - name: Probe the JAX samplers
        run: |
          python scripts/diag_jax_samplers.py --traceback \
            ${{ inputs.strict_probe && '--strict' || '' }}

      # -n 2 matches tests.yml: this is a 4-CPU runner and each worker peaks
      # 1-2 GB building a System and compiling graphs.
      #
      # test_gp.py is in the set and is the expensive one, on purpose. Its
      # 10 kernel-building tests carry @needs_celerite2_pymc and SKIP here
      # (celerite2's PyMC backend imports jax eagerly -- see the probe step
      # above), while its ~36 scaffolding tests run for real. Keeping it
      # listed is what makes those skips visible: if a future celerite2
      # stops importing jax eagerly, or this platform starts shipping jax,
      # the same command silently starts exercising the kernels instead.
      - name: Run the smoke subset
        if: ${{ !inputs.run_full_suite }}
        run: |
          pytest -q -n 2 \
            tests/test_limbdark.py \
            tests/test_physics_registry.py \
            tests/test_config_healing.py \
            tests/test_known_keys.py \
            tests/test_negative_jitter.py \
            tests/test_gp.py

      - name: Run the full suite
        if: ${{ inputs.run_full_suite }}
        run: pytest -q -n 2

      # Kept regardless of outcome: when the install fails, the requirement
      # file and whatever pip managed to resolve are the diagnosis.
      - name: Upload the resolution record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intel-mac-${{ matrix.python-version }}
          path: |
            resolved-intel-mac.txt
          if-no-files-found: warn
