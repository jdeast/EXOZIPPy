name: Tests

on:
  push:
    branches: [master]
  # NO `branches:` filter here, deliberately. With `branches: [master]` a pull
  # request targeting anything else got NO CI AT ALL -- and retargeting it to
  # master afterwards did not start one, because GitHub dispatches on opened /
  # reopened / synchronize and a base change is none of those. Such a PR sat
  # at "no checks reported", which reads as "not finished yet" rather than
  # "never tested", and the only way to start it was to close and reopen the
  # PR by hand. That is a footgun aimed squarely at stacked pull requests.
  #
  # The cost is running the suite on PRs between topic branches too, which is
  # the point: a stacked PR is exactly where a bad merge hides, since its diff
  # is read against its parent rather than against master.
  pull_request:
  # Nightly, for the unlocked-resolution job below -- it catches an upstream
  # release breaking us, which has nothing to do with when we push.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  # Callable from publish.yml so a release runs exactly this suite, rather
  # than a copy of it that drifts out of sync.
  workflow_call:

jobs:
  # NOTE ON JOB NAMES -- read before renaming anything here.
  #
  # The branch ruleset requires a status check literally named `test`, and
  # there are no bypass actors, so if nothing ever reports that name then
  # NOTHING CAN EVER MERGE, including the PR that would fix it.
  #
  # A matrix job does not report its own id: it reports one check per
  # combination, named `pytest (ubuntu-latest, 3.12)` and so on. That is why
  # the matrix below is called `pytest` and the aggregating gate job at the
  # bottom is called `test` -- the required name stays stable no matter how
  # the matrix grows or shrinks.

  # Runs on everything, including pull requests.
  #
  # These four combinations cost the SAME wall clock as the single 3.12 job
  # that preceded them, because matrix combinations run concurrently -- a
  # measured run had all four starting within 6 seconds of each other and
  # finishing within a few minutes of each other. Adding Python versions here is
  # effectively free; do not trim them to "save time", there is none to save.
  #
  # THE CAP IS 90 MINUTES, and the number is not arbitrary. That "12 to 16
  # minutes" above was measured in July 2026 and the suite has roughly tripled
  # since: on 2026-08-18 master ran ~34 minutes and PR #187 ran 41.7 (3.12),
  # 44.9 (3.14) and 36.9 (macOS) -- with 3.13 CANCELLED at 45:16. Three of four
  # jobs landing between 37 and 45 minutes against a 45-minute cap is not a
  # margin, and the failure it produces is the worst kind: "cancelled", which
  # reads as a broken PR rather than as a budget that ran out. 90 restores the
  # ~2x headroom the 45 was chosen to give.
  #
  # WINDOWS IS DELIBERATELY ABSENT. It was tried and removed: the suite took
  # over 90 minutes there against ~16 on Linux at the time, and the job was
  # cancelled at the cap on every attempt -- it never once produced a result,
  # green or red. Adding it back means first making the suite finish there, not
  # raising the timeout until it fits: the cap above is sized to what Linux and
  # macOS actually take, and a platform that needs several times that is a
  # different problem. The bugs Windows did find (mkl wheels, SIGALRM, the
  # GUI's cross-process signal) are fixed and stay fixed. The running list of
  # what native Windows would still need is docs/windows-native.md.
  pytest:
    name: pytest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # actions: write is for `gh cache delete` in the housekeeping step at the
    # end; contents: read is everything else this job does. Scoped to the job
    # rather than the workflow, so the nightly job below keeps its own narrower
    # set (issues: write, no actions).
    permissions:
      contents: read
      actions: write
    strategy:
      # Do not cancel the other combinations when one fails. When a new Python
      # breaks something, "3.14 failed and everything else was cancelled" tells
      # you much less than seeing which combinations passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # CONTRIBUTING documents a macOS setup, and macOS is as fast as Linux
          # here, so it stays on the pull-request path.
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      # --extras gui is required, not polish: ruamel-yaml lives in that extra,
      # so without it tests/test_gui_document.py fails at import and the whole
      # GUI test surface never runs here. (httpx, which fastapi's TestClient
      # needs, is in the dev group and so is always installed.)
      - name: Install dependencies
        run: poetry install --extras gui --no-interaction

      # The SED tests need ~250 MB of NextGen model spectra that
      # ensure_model_data() fetches from Zenodo on first use, caching into the
      # checkout -- which is fresh in every job, so without this EVERY matrix
      # combination re-downloads it. That is ~1.3 GB per run pulled from a free
      # academic host, and it is why two consecutive Dependabot PRs went red on
      # `HTTPError: HTTP Error 504: Gateway Time-out` in tests that had nothing
      # to do with their diffs.
      #
      # The key embeds the md5 already pinned in make_bc._MODEL_DATA, so it is
      # correct by construction: change the data, change the key. Keep it in
      # sync if that pin ever moves.
      #
      # The PATH is NOT correct by construction, and has to be kept in sync by
      # hand with bc_grid.DEFAULT_MODEL_ROOT (= src/exozippy/models). It was
      # not. This block originally read src/exozippy/components/sed/models/
      # NextGen, correct when it was written (#29, 2026-07-28 13:46) and
      # stranded three hours later when the "Changed models/filters directory
      # structure" branch merged and moved the tree (2026-07-28 16:36).
      #
      # Nothing caught it, and the failure mode is worth understanding because
      # it looks healthy from the outside. actions/cache neither warns nor
      # fails on a path the code does not read: the pre-restructure entry kept
      # reporting "Cache hit ... not saving cache" on every job, restoring
      # 132 MB into a directory nothing opens, while the SED tests downloaded
      # the spectra from Zenodo again -- exactly the load this block exists to
      # remove. Restoring also refreshes the entry's last-accessed time, so it
      # never aged out either: a self-sustaining zombie.
      #
      # The key carries a `p2` generation marker because a cache entry stores
      # the paths it was SAVED with. Repointing `path:` alone would still hit
      # the old entry and still unpack it at the old location; the key has to
      # change for a new entry to be written at the new one.
      #
      # The path names the two DOWNLOADED files, not their directory. Both
      # land in models/NextGen/BCs/ next to 68 TRACKED BC tables, and a cache
      # is restored after checkout and overwrites what it finds. Caching the
      # directory would therefore let a stale entry silently revert a tracked
      # table -- and the key, being the spectra md5, would not change when a
      # table did, so it would never self-heal. That is not hypothetical: the
      # "sed: fix Av bug in shipped 2MASS/WISE/GAIA BC tables" commit is
      # exactly the change that would have been reverted under CI while
      # passing locally.
      #
      # The other Zenodo asset, the 128 MB MIST EEP grid (models/MIST/eep_grid
      # .py, same fetch_assets core), is deliberately not cached: the only
      # test that touches it monkeypatches _EEP_GRID_ASSETS and EEP_GRID_DIR,
      # so CI never downloads it. Add it here if that ever changes.
      - name: Cache the Zenodo model spectra
        uses: actions/cache@v6
        with:
          path: |
            src/exozippy/models/NextGen/BCs/NextGen.spectra.csv
            src/exozippy/models/NextGen/BCs/NextGen.wavelength.csv
          key: nextgen-spectra-p2-7a2b81333f6a5bfccd4cbc07bdea6648

      # The mulensing component sets astropy's solar-system ephemeris to
      # "jpl", which downloads the ~115 MB de430 kernel into ~/.astropy/cache
      # on first use. Same failure mode as the Zenodo spectra above: a slow
      # JPL server turned into URLError failures across the suite (nightlies
      # of 2026-07-29 and 2026-07-31). The kernel file never changes, so a
      # static key is correct; bump it only if the ephemeris name in
      # ephemeris.py / mulensing/op.py ever moves off de430.
      - name: Cache the astropy ephemeris kernel
        uses: actions/cache@v6
        with:
          path: ~/.astropy/cache
          key: astropy-cache-de430

      # PyTensor compiles a C module for essentially every distinct graph the
      # suite builds and caches it in its compiledir. A CI job starts with an
      # empty one, so EVERY graph is compiled from scratch, and that dominates
      # the runtime here: locally, one full suite run against an empty
      # compiledir takes 27 minutes against ~9 warm, on six workers. The
      # 34-45 minute jobs this workflow currently reports are very largely
      # gcc.
      #
      # RESTORE HERE, SAVE ONLY ON MASTER (the save step is at the end of the
      # job). Two reasons, and the second is the one that bites:
      #
      #   * A cache saved on the default branch is readable from every branch,
      #     while one saved on a topic branch is visible only to that branch
      #     and its PR. Saving from master is therefore the only way one entry
      #     serves every pull request.
      #   * The repository-wide cache budget is 10 GB and GitHub evicts
      #     least-recently-ACCESSED to stay under it. A compiledir is a few
      #     hundred MB per matrix combination, so saving one on every PR run
      #     would churn several GB a day and put the Zenodo spectra (132 MB)
      #     and the ephemeris kernel (115 MB) above at risk of eviction --
      #     trading a 5-minute cache for a 250 MB download. Restricting writes
      #     to master pushes caps the churn at one set per merge.
      #
      # The key carries github.run_id so each master push writes a NEW entry
      # rather than hitting an existing one and skipping the save (a cache key
      # is immutable once written -- that is the trap that freezes a cache at
      # whatever the first run produced). The restore-keys prefix is what
      # makes that usable: it matches the most recent entry for this os +
      # python + lockfile, falling back to any entry for this os + python when
      # the lock moves. A partial hit is worth having -- most graphs are
      # unaffected by a dependency bump, and those that are simply recompile.
      #
      # poetry.lock stands in for the pytensor version: PyTensor's cache keys
      # already embed its own version, the compiler version and the graph, so
      # a stale entry is a miss and never a wrong answer.
      #
      # The KERNEL VERSION is the footgun to know about here, and it is
      # handled on the pytest side rather than in the key. PyTensor names the
      # compiledir after the platform string, which includes the kernel
      # release, so a runner image bump silently strands the entire restored
      # tree -- nothing reads it, and nothing would ever delete it either, so
      # it would ride along in the cache forever making the download bigger
      # for no benefit. The root conftest's prune sweeps sibling compiledir_*
      # trees for exactly this case.
      - name: Restore the PyTensor compile cache
        id: compiledir-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.pytensor-pytest
          key: pytensor-compiledir-p1-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}-${{ github.run_id }}
          restore-keys: |
            pytensor-compiledir-p1-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}-
            pytensor-compiledir-p1-${{ matrix.os }}-${{ matrix.python-version }}-

      # The worker count is COMPUTED, not written down here, and the reason
      # is that the number this replaced went stale without anyone noticing.
      # `-n 2` was chosen when a hosted Linux runner had two cores; the
      # runners grew, the suite tripled, and the 2 stayed. Measured on
      # 2026-08-24 with the compile cache warm on both sides, the four matrix
      # jobs did the same work PER WORKER as a 36-core workstation -- ubuntu
      # 3.12 spent 5202 worker-seconds against the workstation's 5682 -- so
      # the entire 43-minute-vs-15:47 gap was worker count and nothing else.
      # Replacing one hardcoded number with another would just restart that
      # clock, so scripts/pytest_workers.py reads the cores and the memory
      # instead; --explain puts both in the log, which is also how we learn
      # what a runner actually has rather than inferring it from docs.
      #
      # The memory term in that script is the binding one, and the failure it
      # exists to avoid is specifically "worker 'gwN' crashed" -- a memory
      # ceiling that presents as a wandering flaky failure, seen on
      # test_integration_kelt4, test_gp and test_sed_plot_data on different
      # runs. Do not raise the worker count past what it returns without
      # raising the memory per worker there too.
      #
      # The compiledir budget is PER COMPILEDIR and there is one per worker
      # (the root conftest gives each its own, so they never queue on
      # PyTensor's compile lock). It is tighter than the local default
      # because a CI job runs one commit: anything beyond roughly one run's
      # per-worker working set of ~1600 entries is dead weight that only
      # inflates the artifact this job saves. A budget BELOW that working set
      # would evict entries this very run still needs.
      - name: Run test suite
        env:
          EXOZIPPY_TEST_COMPILEDIR_MAX_ENTRIES: "1800"
        run: |
          set -euo pipefail
          workers=$(poetry run python scripts/pytest_workers.py --explain)
          poetry run pytest -q -n "$workers"

      # The conftest prunes at session START, so at this point the directories
      # hold the budget plus everything this run compiled. Trim again so the
      # saved artifact is a bounded size rather than growing by one run's
      # worth on every merge.
      #
      # --include-worker-dirs is what makes that sentence true, and its
      # absence is why it was false. Without it this pruned only the
      # compiledir pytensor.config resolves, which under -n is the
      # controller's -- the one directory no worker ever writes to. It was
      # empty, the step reported success having removed nothing, and the
      # per-worker directories that hold the entire cache were never
      # considered. The artifact grew every merge: ubuntu 3.14 went 374 ->
      # 494 -> 606 -> 661 -> 781 MB over five consecutive master runs, and
      # with the generations below retained on top of that the repository's
      # pytensor caches reached 8.05 GB of the 10 GB budget -- so GitHub was
      # evicting least-recently-accessed, which is the scenario the restore
      # step's comment describes as trading a 5-minute cache for a 250 MB
      # download.
      - name: Prune the compile cache before saving it
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          export PYTENSOR_FLAGS="base_compiledir=$HOME/.pytensor-pytest"
          poetry run python scripts/pytensor_cache_budget.py \
            --max-entries 1800 --sweep-other-platforms --include-worker-dirs

      # See the long comment on the restore step for why this is master-only.
      - name: Save the PyTensor compile cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: ~/.pytensor-pytest
          key: ${{ steps.compiledir-cache.outputs.cache-primary-key }}

      # The restore step's key embeds github.run_id so that each master push
      # writes a NEW entry instead of hitting an existing one and skipping the
      # save. That is necessary -- a cache key is immutable once written -- but
      # it has a consequence the restore-keys prefix hides: nothing ever
      # supersedes the entry it replaces. Old generations only leave by
      # eviction, so they accumulate. Measured 2026-08-25: FIVE generations
      # retained per os+python, 18 entries, 8.05 GB of the repository's 10 GB
      # budget, total usage 10.43 GB -- i.e. already evicting, and the two
      # things eviction must not take (the 132 MB Zenodo spectra and the
      # 115 MB ephemeris kernel) were the smallest entries in there.
      #
      # Only the newest is ever restored: the restore-keys prefix matches
      # most-recent-first. So the older ones buy nothing and cost the budget.
      # This deletes them, scoped to THIS job's os+python prefix, so the four
      # matrix combinations running concurrently cannot interfere with each
      # other.
      #
      # The prefix also spans lockfile hashes, which is intended: after a
      # dependency bump the first master run restores the old-lock entry as a
      # partial hit, compiles the delta, saves under the new key, and the old
      # entry is then genuinely superseded.
      #
      # continue-on-error, like the issue bookkeeping in the nightly job
      # below: cache housekeeping must never decide a suite's verdict. A
      # transient API error here would otherwise turn a green run red.
      - name: Drop superseded compile caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.compiledir-cache.outputs.cache-primary-key }}
          PREFIX: pytensor-compiledir-p1-${{ matrix.os }}-${{ matrix.python-version }}-
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/superseded-cache-keys.txt"
          gh cache list --key "$PREFIX" --limit 100 --json key \
            --jq '.[].key' > "$keys" || true
          while read -r key; do
            if [ -z "$key" ] || [ "$key" = "$KEEP" ]; then
              continue
            fi
            echo "deleting superseded cache: $key"
            gh cache delete "$key" || true
          done < "$keys"

  # Installs WITHOUT poetry.lock, resolving dependencies fresh the way a user's
  # `pip install exozippy` does.
  #
  # Every other job here installs the lock: one exact, frozen dependency set.
  # That verifies what we SHIP. It does not verify what users RESOLVE, and
  # those are different artifacts -- pyproject declares ranges ("jax>=0.5.0,
  # <1.0.0", "nutpie>=0.13.0") that nothing otherwise exercises. This stack is
  # unusually sensitive to that gap: a pymc/pytensor/numpy minor release can
  # shift numerical results rather than fail loudly.
  #
  # Dependabot does not cover this. It bumps the lock, so it tells us a new
  # version works with our pins; it never tests a fresh resolution.
  #
  # Deliberately NOT in the `test` gate's needs. An upstream project releasing
  # something incompatible must not turn the required check red and block
  # merges for a reason that has nothing to do with the pull request. A
  # failure here fails the workflow run, which is the alarm we want.
  pytest-latest-deps:
    name: pytest-latest-deps
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Same suite as the matrix above, so the same 90-minute budget; a nightly
    # cancelled at the cap would open the tracking issue below for a reason
    # that has nothing to do with dependencies.
    timeout-minutes: 90

    # Scoped to this job, not the workflow. Only this job files issues; nothing
    # here needs write access to the repository contents.
    permissions:
      contents: read
      issues: write

    # The open-on-failure and close-on-success steps below both look the
    # tracking issue up by this exact title. Defined once so they cannot
    # drift apart -- if they did, a green run would stop closing the issue
    # a red run opened.
    env:
      ISSUE_TITLE: "Nightly: suite fails against freshly resolved dependencies"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No poetry, no lock. pip resolves from pyproject's ranges, exactly as a
      # user installing from PyPI would. The test harness is installed
      # separately and unpinned -- it lives in poetry's dev GROUP, which never
      # reaches published metadata, so `pip install .[gui]` cannot bring it in.
      - name: Install with a fresh resolution
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]"
          pip install pytest pytest-timeout pytest-xdist httpx

      # Same Zenodo spectra cache as the other jobs -- see the comment there,
      # including why this path has to be kept in sync with
      # bc_grid.DEFAULT_MODEL_ROOT by hand. Shares their key, so this job is
      # usually a cache hit populated by them.
      - name: Cache the Zenodo model spectra
        uses: actions/cache@v6
        with:
          path: |
            src/exozippy/models/NextGen/BCs/NextGen.spectra.csv
            src/exozippy/models/NextGen/BCs/NextGen.wavelength.csv
          key: nextgen-spectra-p2-7a2b81333f6a5bfccd4cbc07bdea6648

      # Same astropy ephemeris-kernel cache as the matrix job -- see the
      # comment there.
      - name: Cache the astropy ephemeris kernel
        uses: actions/cache@v6
        with:
          path: ~/.astropy/cache
          key: astropy-cache-de430

      # DELIBERATELY NO PyTensor compiledir cache here, unlike the matrix job.
      # That cache is keyed on poetry.lock as a proxy for the pytensor version,
      # and this job's whole purpose is to install without the lock -- so the
      # key would claim a resolution it did not get. PyTensor embeds its own
      # version in every cache key, so the entries would simply all miss; the
      # cost would be the download, paid for nothing. This job is nightly and
      # not on the merge path, so its runtime is the cheapest thing here.

      # Saved to a file, not just echoed: the failure report below quotes it,
      # and "which versions did it actually pick" is the first question anyone
      # asks about a resolution failure.
      - name: Record what actually got resolved
        run: pip freeze | tee resolved.txt

      # Same computed worker count as the matrix job -- see the comment
      # there. No poetry in this job by design, so the script runs on the
      # bare interpreter; it imports nothing outside the standard library
      # precisely so it can.
      - name: Run test suite
        run: |
          set -euo pipefail
          workers=$(python scripts/pytest_workers.py --explain)
          pytest -q -n "$workers"

      # Email alone is a weak alarm for this job. A nightly that stays broken
      # for a week sends seven identical emails, which is how an alarm becomes
      # noise and then becomes invisible. One issue, updated in place, stays
      # visible to collaborators and has a state that means something: open =
      # still broken, closed = fixed.
      #
      # Uses the preinstalled gh CLI and the automatic GITHUB_TOKEN, so there
      # is no marketplace action in the supply chain for this.
      # continue-on-error on both issue steps is load-bearing, not caution.
      # Issue bookkeeping must never decide this job's verdict -- the suite
      # does. Without it, a failing `gh issue list` turns a GREEN run RED,
      # which is the exact inversion of the signal this job exists to give,
      # and it sends someone hunting an upstream dependency break that never
      # happened.
      #
      # Not hypothetical: the same block, ported to exoplanet-core, did
      # precisely that on its first real run. GitHub disables Issues on
      # forks by default, `gh issue list` exited non-zero with "the '<repo>'
      # repository has disabled issues", `set -euo pipefail` ended the step,
      # and a clean resolve-and-test run reported failure. Here the repo has
      # Issues on and the token has issues:write, so the live trigger would
      # instead be a transient API error -- rarer, and indistinguishable
      # from a real break when it happens.
      - name: Open or update the tracking issue on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="$ISSUE_TITLE"

          {
            echo "The nightly unlocked-resolution job failed."
            echo
            echo "This job installs with \`pip install \".[gui]\"\` -- no"
            echo "poetry.lock -- so it reflects what a user gets from PyPI"
            echo "rather than what we ship. A failure here usually means an"
            echo "upstream release is incompatible with our declared ranges,"
            echo "not that anything in this repository changed."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "<details><summary>Resolved versions</summary>"
            echo
            echo '```'
            # Key packages first; the full list is in the run's logs.
            grep -iE '^(pymc|pytensor|numpy|scipy|astropy|jax|jaxlib|numpyro|blackjax|nutpie|celerite2|exoplanet-core)' resolved.txt || true
            echo '```'
            echo "</details>"
          } > body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file body.md
          else
            echo "Opening a new issue"
            gh issue create --title "$TITLE" --body-file body.md
          fi

      # The inverse of the step above. Without it the issue only ever opens,
      # so after a transient failure (a JPL or Zenodo hiccup, run 30620673936)
      # "open" stops meaning "still broken" until a human triages it. With it
      # the state is truthful on its own: a real upstream break keeps failing
      # nightly and the issue stays open; a one-night flake closes itself on
      # the next green run, with the open/close timestamps recording how long
      # it lasted. A genuine break is never masked -- this step cannot run
      # while the suite is failing.
      - name: Close the tracking issue when the suite is green again
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Closing issue #$EXISTING"
            gh issue close "$EXISTING" \
              --comment "The nightly unlocked-resolution job passed again: $RUN_URL"
          else
            echo "No open tracking issue to close"
          fi

  # The stable name the ruleset requires. It exists only to aggregate the
  # matrix into one pass/fail, so the required check never has to be renamed
  # when the matrix changes.
  #
  # `if: always()` is load-bearing. Without it this job is skipped when any
  # matrix combination fails, and a skipped required check reads as neutral
  # rather than failing -- the PR would look mergeable with a red matrix.
  test:
    name: test
    if: always()
    needs: [pytest]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required combination did not succeed
        run: |
          echo "pytest: ${{ needs.pytest.result }}"
          test "${{ needs.pytest.result }}" = "success"
