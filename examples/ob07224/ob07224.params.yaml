# OGLE-2007-BLG-224 starting values: Gould et al. 2009, ApJ 698, L147
# (arXiv:0904.0249).  The Letter prints only derived quantities; t_0, u_0
# and the fluxes are measured here.  Every derivation is in README.md
# ("Starting values").  Gould+2009's pi_E convention is EXOZIPPy's
# (conventions.md), so nothing is transformed.

# Sky position: OGLE EWS params.dat, 18:05:41.05 -28:45:36.2.  Required:
# the files are HJD_UTC and the BJD_TDB conversion needs real coordinates.
star.ra:
    initval: 271.4210417
    sigma: 0
star.dec:
    initval: -28.7600556
    sigma: 0

# --- Trajectory ---------------------------------------------------------
# Not in the Letter; measured here (README).  OGLE EWS Tmax 2454233.667.
source.Source.t_0:
    initval: 2454233.667775    # BJD_TDB

# Not in the Letter; measured here.  Seeded positive: the shipped data
# cannot break the (u_0, pi_E_perp) mirror (README).
source.Source.u_0:
    initval: 3.492847e-04

mulensevent.t_E:
    initval: 6.91              # d, published 6.91 +/- 0.13

source.Source.rho:
    initval: 8.50e-4           # published (8.50 +/- 0.16)e-4

# |pi_E| = 1.97 at position angle 218 deg (52 deg south of west).
mulensevent.pi_E_N:
    initval: -1.5524           # 1.97 cos(218 deg)
mulensevent.pi_E_E:
    initval: -1.2129           # 1.97 sin(218 deg)

# --- Lens and source (Gould+2009 Sec. 2.3) ------------------------------
star.Lens.mass:
    initval: 0.056             # Msun, +/- 0.004: a brown dwarf
star.Lens.distance:
    initval: 525.0             # pc, +/- 40: a thick-disk lens
star.Source.distance:
    initval: 8000.0            # pc, the Letter's assumed bulge source

# Proper motions: the leaves t_E and pi_E derive from (README).  Source at
# a nominal bulge mean; the lens carries mu_rel,hel.
star.Source.pm_ra:
    initval: -6.0              # mas/yr
star.Source.pm_dec:
    initval: -0.2              # mas/yr
star.Lens.pm_ra:
    initval: -26.8590          # = mu_rel_hel_E + pm_ra(source)
star.Lens.pm_dec:
    initval: -36.9810          # = mu_rel_hel_N + pm_dec(source)

# --- Limb darkening: linear-law, G dwarf (README) -----------------------
band.I.u1:
    initval: 0.47
band.V.u1:
    initval: 0.64
    sigma: 0
band.R.u1:
    initval: 0.55
    sigma: 0

# --- Per-instrument fluxes and error scaling ----------------------------
# Linear flux solve per instrument at the geometry above; err_scale is the
# sqrt(chi2/N) it leaves (README).
mulensinstrument.OGLE.q_source:
    initval: 0.4806
mulensinstrument.OGLE.log_f_total:
    initval: -7.24401
mulensinstrument.OGLE.err_scale:
    initval: 1.45              # the out-of-event value, not all-points 2.56

mulensinstrument.SMARTS_I.q_source:
    initval: 0.2151
mulensinstrument.SMARTS_I.log_f_total:
    initval: -7.13475
mulensinstrument.SMARTS_I.err_scale:
    initval: 2.82

mulensinstrument.SMARTS_V.q_source:
    initval: 0.2716
mulensinstrument.SMARTS_V.log_f_total:
    initval: -6.97071
mulensinstrument.SMARTS_V.err_scale:
    initval: 2.90

mulensinstrument.Auckland.q_source:
    initval: 0.1234
mulensinstrument.Auckland.log_f_total:
    initval: -7.28619
mulensinstrument.Auckland.err_scale:
    initval: 0.98

mulensinstrument.FarmCove.q_source:
    initval: 0.1024
mulensinstrument.FarmCove.log_f_total:
    initval: -7.04453
mulensinstrument.FarmCove.err_scale:
    initval: 1.30

mulensinstrument.VintageLane.q_source:
    initval: 0.0845
mulensinstrument.VintageLane.log_f_total:
    initval: -7.27896
mulensinstrument.VintageLane.err_scale:
    initval: 1.27

mulensinstrument.LOAO.q_source:
    initval: 0.1492
mulensinstrument.LOAO.log_f_total:
    initval: -7.37367
mulensinstrument.LOAO.err_scale:
    initval: 0.91
