# From Yee et al. 2015 (ApJ 802, 76), Table 1 (free F_B).
# The initval lists are per-seed starts (multi-seed sampling), one per
# Refsdal four-fold degenerate solution, in Table 1's column order:
#   seed 0: u0,-,+  chi2/dof = 273.1/265
#   seed 1: u0,-,-  273.7/265  (ecliptic twin of seed 0; the paper's
#                               proper-motion argument prefers this one)
#   seed 2: u0,+,+  281.5/265  (dchi2 = 8)
#   seed 3: u0,+,-  290.2/265  (dchi2 = 17)
source.Source.t_0:
    initval: [2456836.22, 2456836.20, 2456836.06, 2456835.95]
source.Source.u_0:
    initval: [0.922, -0.913, 0.897, -0.843]
mulensevent.t_E:
    initval: [22.87, 22.99, 22.91, 23.87]
mulensevent.pi_E_N:
    initval: [-0.248, 0.220, -1.370, 1.325]
mulensevent.pi_E_E:
    initval: [0.234, 0.238, -0.060, 0.024]

# Yee+2015 Table 1: q = F_S/(F_S+F_B) per solution (same column order).
# OGLE: 13.20/11.01, 12.95/11.02, 12.51/11.02, 11.09/11.01. Negative
# blending is common for OGLE difference imaging in the crowded bulge.
mulensinstrument.OGLE4.q_source:
    initval: [1.199, 1.175, 1.135, 1.007]
# Spitzer: 4.31/4.23, 4.37/4.22, 3.32/4.28, 3.30/4.32.
mulensinstrument.Spitzer.q_source:
    initval: [1.019, 1.036, 0.776, 0.764]

# err_scale starts near its posterior (README).
# OGLE errors are underestimated ~1.65x (difference-imaging convention).
mulensinstrument.OGLE4.err_scale:
    initval: 1.65
# The Spitzer file is Yee's raw published photometry; her fits imply
# working errors ~17x larger (README).  Do not "fix" the data file.
mulensinstrument.Spitzer.err_scale:
    initval: 17.0

# Catalog position of the event.
star.Lens.ra:
    initval: 266.801041667
    sigma: 0
star.Lens.dec:
    initval: -21.3829722222
    sigma: 0
star.Source.ra:
    initval: 266.801041667
    sigma: 0
star.Source.dec:
    initval: -21.3829722222
    sigma: 0

# Source proper motion (Yee+2015 Eq. 8): OGLE RELATIVE astrometry, i.e.
# bulge-frame, so it belongs on pm_*_sgra (conventions.md C31; README).
star.Source.pm_ra_sgra:
    mu: -5.31
    sigma: 0.45
    citation: Yee:2015
star.Source.pm_dec_sgra:
    mu: -0.64
    sigma: 0.45
    citation: Yee:2015

# The absolute alternative (README) -- INSTEAD of the two entries above:
