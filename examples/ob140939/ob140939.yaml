run:
  name: "OB140939"

prefix: "fitresults/OB140939"
logger_level: INFO   # DEBUG, INFO, or WARNING

# 1. Define the physical bodies!
star:
  - name: "Lens"
  - name: "Source"

# 2. The microlensing event: one entry per physical body on the lens: and
# source: lists (body: <component>.<name>), event-level options on
# mulensevent:.
lens:
  - body: star.Lens

source:
  - body: star.Source

mulensevent:
  - finite_source: False
    #mag_method: "auto_vbbl" # default = auto_vbbl, but accepts anything MuLensModel does: point_source, point_source_approx, vbbl, adaptive_contour, hexadecapole, quadrupole, ray_shooting
    t0_par: 2456836.22

galacticmodel:
  - name: "OB140939"
    anchor_idx: 1 # in mulensing, we anchor to the source by convention

band:
  - name: "OGLE_I"
    filter: "OGLE.I"
    ld_law: "linear"
  - name: "Spitzer_36"
    filter: "Spitzer.IRAC.36"
    ld_law: "linear"

mulensinstrument:
  - name: "OGLE4"
    file: "n20100310.I.OGLE.OB140939.dat"
    zero_point: ""
    observer_location: "earth" # earth, spitzer, kepler, roman, a site name (CTIO), "lon_deg,lat_deg[,height_m]" (lon FIRST), or filename of horizons ephemeris to interpolate
    band: "OGLE_I"
    reference: true # peg all plotted data + model curves to this instrument's f_source/f_blend (defaults to the first instrument)
  - name: "Spitzer"
    file: "n20140605.L.Spitzer.OB140939.dat"
    zero_point: ""
    observer_location: "spitzer"
    band: "Spitzer_36"

parameter_file: "ob140939.params.yaml"

sampler:
  # ptde_async: the params file seeds all FOUR Yee+2015 degenerate
  # solutions (initval lists), and only PTDE round-robins its chains
  # across seeds -- nuts would start every chain at seed 0. PTDE's
  # tempering also lets chains cross between the degenerate basins;
  # outputs/modes.py then reports each mode separately.
  method: ptde          # synchronous PTDE, the recommended default since PR #376 (review 2.4.9): the VBM straggler tail that justified ptde_async is gone
  # PTDE: no separate tuning phase needed -- the seeds are polished to
  # their basin optima before sampling and burn-in is trimmed at wrap-up
  # (convergence.find_burnin); long draws instead, for round trips
  # between the four degenerate basins.
  tune: 0
  draws: 50000
  # Run all 50000 draws: the default min_ess/max_rhat early stop passed at
  # ~4000 draws (2026-10-06) while the whole DE ensemble was still drifting
  # along the lens distance-mass ridge -- R-hat across chains that share one
  # population cannot see a collective drift -- leaving the lens at 2.8 kpc
  # against the converged 3.3-3.6.
  max_rhat: null
  min_ess: null
  # Densified tempering ladder, validated empirically: auto (17 rungs)
  # left adjacent-swap acceptance at 5-7% and 3 round trips -- the
  # ladder froze below T ~ 75 and the mode weights were initialization
  # artifacts. At 24 rungs (measured Lambda = 9.4; use > 2*Lambda+1
  # with margin) swap acceptance is 50-65%, round trips flow, and the
  # per-rung basin-occupancy profile is smooth.  A smooth profile proves
  # TRANSPORT along the ladder, not correct T=1 weights: on 2026-08-08 it
  # looked exactly like this while every chain sat in one basin (zero T=1
  # mode changes on a replay; the ladder funnels descending replicas).  The
  # weights are trusted only because the T=1 chains themselves switch
  # basins -- check modes.txt's 'mode changes' count, never the profile.
  # Converged (all 50000 draws: max_rhat/min_ess early stop off), with
  # the source pm prior in its correct Sgr-A*-relative frame
  # (src/exozippy/components/mulensing/conventions.md C31), the split is
  # ~91/9: u0,-,- ~91%, the solution Yee+2015's proper-motion argument
  # prefers, with a lens at ~3.3 kpc and ~0.24 Msun (hers: 3.1 +/- 0.4
  # kpc, 0.23 +/- 0.07).  An earlier "~98/2" here was a stuck-ladder
  # artifact, not a posterior.
  n_temps: 24
  # Keep thinned hot-rung draws: they detect posterior-suppressed modes
  # (occupancy ~exp(-dlp/T)) for the seeded-solution ledger, so solutions
  # nobody seeded still show up as "considered and rejected".  Left explicit
  # for documentation only -- 'auto' (the default) already turns this on for
  # a microlensing topology.  Costs ~37% of the trace file here.
  store_hot_chains: true
  recompute_trace: True
  # The seeds are literature solution estimates, not posterior draws,
  # so force the pre-whitening polish, which 'auto' skips for hint-less
  # multi-seed sets.  Quoted: bare `on` is a boolean to PyYAML (YAML 1.1) and
  # the string "on" to the GUI's ruamel loader (YAML 1.2); both resolve to the
  # same default step cap here, but only the quoted form says so unambiguously.
  seed_polish: "on"