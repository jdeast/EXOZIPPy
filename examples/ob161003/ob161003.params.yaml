# Jung et al. 2017 (ApJ 841, 75), Table 1, 2S2L "standard" solution.
#
# Per-source trajectory parameters are addressed by the source star's
# instance name: lens.SourceA.<param> / lens.SourceB.<param>
# (equivalently by slot index: lens.0.<param> / lens.1.<param>, matching
# the order of the sources: list in the lens block).
# Event-level (shared) parameters use the lens event's name: lens.Lens.<param>.

lens.SourceA.t_0:
    initval: 2457551.038

lens.SourceB.t_0:
    initval: 2457552.517

lens.SourceA.u_0:
    initval: 0.059

lens.SourceB.u_0:
    initval: 0.135

# t_E is shared by both sources in the published solution (both sources are
# in the bulge with a common lens); referenced to the TOTAL lens mass.
lens.SourceA.t_E:
    initval: 28.931

lens.SourceB.t_E:
    initval: 28.931

lens.Lens.s:
    initval: 1.033

# alpha: relaxation engine propagates the initval to xalpha/yalpha.
# Jung et al. 2017 report alpha = 48.243 deg; their convention maps to
# MulensModel's (used internally) as alpha_MM = 180 - alpha_paper.
# (Verified by chi2 scan over {±alpha, 180±alpha} × u_0 sign: 131.757 with
# u_0 > 0 gives chi2/N ~ 1.25; all other combinations are catastrophic.)
lens.Lens.alpha:
    initval: 131.757

lens.SourceA.rho:
    initval: 0.000451

lens.SourceB.rho:
    initval: 0.001293

# q = M_LensB / M_Lens (~1.19: the "companion" is the more massive body).
# EXOZIPPy's relaxation engine propagates this through the symbolic relation
# q * M_primary = M_companion to set LensB's mass initval automatically.
lens.Lens.q:
    initval: 1.188

star.ra:
    initval: 264.10513
    sigma: 0
star.dec:
    initval: -27.188861
    sigma: 0

# The lens bodies' radii and every star's teff/feh used to be pinned by hand
# here.  They are deactivated automatically now (review 3.8.1): with no SED and
# no evolutionary model nothing reads them, so they are not parameters of this
# configuration at all.
#
# The SOURCE radii are the reason that had to change.  This file already said
# they must be free -- see the note below -- but they were NOT: the old blanket
# auto-pin fixed the radius of every microlensing-only source star, so
# finite_source's rho was read off a radius nobody had chosen.  Measured here:
# before, 56 free RVs and start logp 79356.588 with no star.radius among them;
# after, 58 and 79339.520 with star.radius sampled.

# Source radii are NOT fixed: rho (fit directly against the finite-source
# lightcurve shape) is derived from radius via calc_rho(radius, distance,
# theta_E), so floating radius lets the data's rho constraint propagate
# through to a real physical posterior instead of being clamped at the
# value back-solved from the seeded rho above.  The initval still comes
# from that back-solve (via the relaxation engine), so the starting point
# is well-informed (the whitening probe measures the step size);
# only the hard fix is removed.
