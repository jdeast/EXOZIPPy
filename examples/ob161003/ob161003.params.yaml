# Jung et al. 2017 (ApJ 841, 75), Table 1, 2S2L "standard" solution.
#
# Per-source trajectory parameters live on the source component, addressed
# by the source star's instance name: source.SourceA.<param> /
# source.SourceB.<param> (equivalently by slot index: source.0.<param> /
# source.1.<param>, matching the order of the source: list).
# Event-level (shared) parameters live on the event: mulensevent.<param>.
# The binary geometry lives on the companion's lens entry: lens.LensB.<param>.

source.SourceA.t_0:
    initval: 2457551.038

source.SourceB.t_0:
    initval: 2457552.517

source.SourceA.u_0:
    initval: 0.059

source.SourceB.u_0:
    initval: 0.135

# t_E is event-level (Jung+2017 print one t_E), referenced to the total
# lens mass.
mulensevent.t_E:
    initval: 28.931

lens.LensB.s:
    initval: 1.033

# Jung et al. 2017 report alpha = 48.243 deg; here alpha = 180 - 48.243
# (verified by a chi2 scan; README, conventions.md).
lens.LensB.alpha:
    initval: 131.757

source.SourceA.rho:
    initval: 0.000451

source.SourceB.rho:
    initval: 0.001293

# q = M_LensB / M_Lens (~1.19: the "companion" is the more massive body).
lens.LensB.q:
    initval: 1.188

star.ra:
    initval: 264.10513
    sigma: 0
star.dec:
    initval: -27.188861
    sigma: 0

# Proper motions: all four leaves of the mu_rel chain are seeded, so the
# derived t_E starts on the published 28.931 d (README).  No parallax, so
# the direction is arbitrary (due south): |mu_rel| = theta_E/t_E =
# 0.8392544/28.931 * 365.25 = 10.5954746 mas/yr on a nominal bulge source.
star.SourceA.pm_ra:
    initval: -3.0
star.SourceA.pm_dec:
    initval: -3.0
star.Lens.pm_ra:
    initval: -3.0
star.Lens.pm_dec:
    initval: -13.595474606      # = -3.0 - theta_E/t_E (mas/yr; see above)
