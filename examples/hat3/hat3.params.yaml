# Start values are the MAP of a converged fit of this config (4 TESS
# sectors, nuts, 500 tune + 1000 draws x 4 chains), so the short smoke-test
# run in hat3.yaml starts in the right place; the priors, bounds and their
# citations are the example's own.
#
# The seeds are one point (the MAP), so the chains are scattered around it.
overdisperse: true

# this is always helpful
star.A.feh:
    initval: 0.2468066
    mu: 0.27
    sigma: 0.08
    citation: high-resolution spectroscopy

# the sigma is only necessary because we're not fiting an evolutionary model
# it should be removed in a final run
star.A.mass:
    mu: 0.92
    sigma: 0.05
star.A.logmass:
    initval: -0.04173949

star.A.teff:
    initval: 5153.18328524
star.A.radius:
    initval: 0.84809479
star.A.teffsed:
    initval: 5171.19974003
star.A.radiussed:
    initval: 0.84872445
star.A.distance:
    initval: 133.92614673

# see scripts/mkticsed.py
star.A.av:
    initval: 0.08710332
    upper: 0.096687450
    citation: Schlegel:1998

# NOTE: the Gaia DR3 parallax uncertainty (0.0143000) has been added in quadrature with 0.01 to account for remaining systematic residuals
star.A.parallax:
    mu: 7.45278
    sigma: 0.01745
    citation: [GaiaCollaboration:2016, GaiaCollaboration:2023]

sed.errscale:
    initval: 1.00329802

planet.b.mass:
