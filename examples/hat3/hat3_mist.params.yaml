# HAT-P-3 star-only + MIST.  Diff against hat3_staronly.params.yaml.

# this is always helpful
star.feh:
    initval: 0.27
    sigma: 0.08
    citation: high-resolution spectroscopy

# A start value only: the MIST tracks constrain the mass (README).
star.mass:
    initval: 0.92

# we can measure this from spectroscopy, but typically SED + transit is more
# direct so we're just going to seed it at the spectroscopic value
star.teff:
    initval: 5190.0

star.radius:
    initval: 0.85

# The initial (protostellar) metallicity, distinct from the surface feh;
# seeded slightly above it, since diffusion depletes a K dwarf's surface.
# A start value, not a prior (README).
star.A.initfeh:
    initval: 0.30

# star.A.eep and star.A.age are left to the component (README).

# see scripts/mkticsed.py
star.av:
    upper: 0.096687450
    citation: Schlegel:1998

# NOTE: the Gaia DR3 parallax uncertainty (0.0143000) has been added in
# quadrature with 0.01 to account for remaining systematic residuals
star.parallax:
    initval: 7.45278
    sigma: 0.01745
    citation: [GaiaCollaboration:2016, GaiaCollaboration:2023]
