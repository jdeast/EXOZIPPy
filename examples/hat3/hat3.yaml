run:
  name: "hat3"

prefix: "fitresults/HAT-P-3b_numpyro"

star:
  - name: "A"
    mist: False
    # The SED model grid is named by 'model:' inside hat3_sed.yaml
    # ("NextGen" there; MISTv1/MISTv2 are the other choices), not here.

planet:
  - name: "b"   

orbit:
  - name: "b"
    primary: ["A"]
    companion: ["b"]

parameter_file: "hat3.params.yaml"
#parameter_file: "hat3.params.2.yaml"

# this should be replaced with MIST when ready
torres:
  - star: "A"
    constrain: [mass, radius]

sed:
  file: "hat3_sed.yaml"

rvinstrument:
  - name: "HIRES"
    file: "HAT-3b.HIRES.rv"

transit:
  - name: "TESS-S16"
    file: "n20190912.TESS.TESS.HAT-P-3.S16.0120.SPOC.dat"
    band: "TESS"
  - name: "TESS-S22"
    file: "n20200220.TESS.TESS.HAT-P-3.S22.0120.SPOC.dat"
    band: "TESS"
  - name: "TESS-S49"
    file: "n20220301.TESS.TESS.HAT-P-3.S49.0120.SPOC.dat"
    band: "TESS"
  - name: "TESS-S76"
    file: "n20240227.TESS.TESS.HAT-P-3.S76.0120.SPOC.dat"
    band: "TESS"

# One band per filter; the transits above reference it by name. Band is the
# single carrier of filter identity and limb darkening.
band:
  - name: "TESS"
    filter: "TESS"

sampler:
  method: numpyro         # nuts, numpyro, nutpie, blackjax, ptde
  tune: 500
  draws: 1000
  chains: 4
  cores: 4
  init: adapt_diag
  target_accept: 0.95
  recompute_trace: True
  profile: False