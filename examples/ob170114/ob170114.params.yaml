# OGLE-2017-BLG-0114 starting values -- Mroz et al. 2026 (arXiv:2606.20555)
# Table B.1, the "Std: 2L1S + parallax + xallarap" column (u_0-, close,
# Planet-S1, inner: the BIC-preferred model), with the physical parameters
# from their Table B.2 and the xallarap elements mapped through
# conventions.md C25's VERIFIED xi_* -> EXOZIPPy transformation.
#
# Convention note: Mroz+26 modeled this event with MulensModel, whose
# trajectory conventions are EXOZIPPy's (C18 identity), so t_0, u_0 (sign
# included), t_E, rho, pi_E_N/E, s, q and alpha drop straight in.  Only the
# xi_* orbital elements need the C25 mapping (their frame is
# tau_hat-referenced; mapping corrected in review 2.6.13):
#
#     bigomega  = phi_pi + xi_Omega + 180 = 37.252 + 250.0 + 180
#                                         -> 467.252 = 107.252 deg
#     i         = xi_i = 30.5 deg                       (cosi = +0.86163)
#     omega_*   = xi_omega                            -> 207.3 deg
#     nu(t0par) = xi_u - xi_omega   = 28.8 deg        -> tp = 2457930.059
#     P = xi_P = 221.5 d,  e = xi_e = 0.615
#
# (phi_pi = atan2(pi_E_E, pi_E_N) = atan2(0.127, 0.167).)  The amplitude
# xi_a = a_1/(D_S theta_E) = 0.200 is not a parameter: it emerges from the
# masses and distances below.  Derivations and traps: README.md.

star.ra:
    initval: 260.4905833          # 17:21:57.74 (OGLE EWS)
    sigma: 0
star.dec:
    initval: -29.6236944          # -29:37:25.3
    sigma: 0

# --------------------------------------------------------------------
# Trajectory -- Table B.1 Std 2L1S, verbatim (C18 identity)
# --------------------------------------------------------------------
source.Source.t_0:
    initval: 2457899.3            # +2.7/-3.4
source.Source.u_0:
    initval: -0.144               # +/- 0.023; the printed u_0- branch
# t_E = 173 +/- 16 d and pi_E = (0.167, 0.127) are derived from the
# mass/distance/pm seeds below, not seeded (README).
source.Source.rho:
    initval: 0.0109               # +0.0140/-0.0070

# Binary-lens geometry (static -- the LENS binary is not the moving one
# in this event; the SOURCE is)
lens.b.s:
    initval: 0.337                # +/- 0.016: close topology
lens.b.alpha:
    initval: 330.4                # +/- 2.6 deg
lens.b.q:
    initval: 0.0219               # +0.0054/-0.0039 -> M_b ~ 11.5 M_J

# --------------------------------------------------------------------
# The source binary -- the xallarap orbit (C25 mapping above)
# --------------------------------------------------------------------
orbit.S.period:
    initval: 221.5                # +55/-39 d (xi_P)
# tp = 2457930.059 (nu(t0par) = 28.8 deg, e = 0.615), seeded through the
# equivalent tc = tp + M_c(e, omega) P/(2 pi), one period forward.
orbit.S.tc:
    initval: 2458125.06
# e = 0.615 +0.015/-0.018, omega_* = 207.3 deg:
orbit.S.secosw:
    initval: -0.69684             # sqrt(e) cos(207.3)
orbit.S.sesinw:
    initval: -0.35953             # sqrt(e) sin(207.3)
orbit.S.cosi:
    initval: 0.86163              # i = xi_i = 30.5 deg (C25)
orbit.S.bigomega:
    initval: 107.252              # = phi_pi + xi_Omega + 180 (C25, mod 360)

# --------------------------------------------------------------------
# Physical parameters (Table B.2 Std 2L1S + the C25 amplitude closure)
# --------------------------------------------------------------------
# M_h is the value that closes theta_E = kappa M_tot |pi_E| with the
# printed theta_E and |pi_E| (0.50 to the paper's 2 s.f.; README).
star.L1.mass:
    initval: 0.492544             # = [0.86 / (kappa * 0.209805)] / (1 + q);
                                  # printed M_h = 0.50 +0.90/-0.28 Msun
star.L1.distance:
    initval: 3361.03              # pc; delivers pi_rel = theta_E |pi_E| =
                                  # 0.180432 mas at D_S = 8540 pc (printed
                                  # D_L = 3.4 +/- 1.8 kpc)
star.Source.mass:
    initval: 1.0                  # assumed: a typical bulge red giant
star.SComp.mass:
    initval: 10.36                # from a_1 = xi_a theta_E D_S = 1.469 au
                                  # with P = 221.5 d and M_S = 1.0
star.Source.distance:
    initval: 8540.0               # D_S assumed 8.54 kpc (red clump)

# Proper motions: all four leaves seeded (README).  The lens carries
#   mu_rel_helio = mu_rel_geo(1.8157 mas/yr along phi_pi = 37.252 deg)
#                  + pi_rel v_earth_perp(t0_par) = (1.3409 N, 2.1688 E) mas/yr
# on top of a typical bulge source pm.
star.Source.pm_ra:
    initval: -3.0
star.Source.pm_dec:
    initval: -3.0
star.L1.pm_ra:
    initval: -0.831156            # = -3.0 + 2.168844
star.L1.pm_dec:
    initval: -1.659083            # = -3.0 + 1.340917

# --------------------------------------------------------------------
# Fluxes and errors
#
# Linear flux solve against THIS (EWS quick-look) file at the seeded
# geometry; Mroz+26's calibrated f_S1 = 398, f_B = 230 (q_source = 0.634)
# are for their re-reduced photometry (README).  err_scale: their k_I.
# --------------------------------------------------------------------
mulensinstrument.OGLE.q_source:
    initval: 0.6272
mulensinstrument.OGLE.log_f_total:
    initval: -6.0295
mulensinstrument.OGLE.err_scale:
    initval: 1.98
