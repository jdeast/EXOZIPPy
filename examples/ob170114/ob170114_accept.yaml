# OGLE-2017-BLG-0114: a planetary binary lens WITH SOURCE ORBITAL MOTION
# (xallarap) -- the shipped worked example of `source_orbital_motion:
# keplerian` (conventions.md C25; review 8.6.9).
#
# references:
#   * Mroz, M. J., et al. 2026 (arXiv:2606.20555) -- the comprehensive
#     analysis this example reproduces: 2L1S/2L2S + parallax + xallarap,
#     with both the "standard" (xi_*) and "astrophysical source" (ET)
#     parameterizations.  Seeds below are their Table B.1 "Std: 2L1S"
#     column (the BIC-preferred model), mapped through C25's verified
#     xi_* -> EXOZIPPy transformation.
#   * Poleski et al. 2021 (arXiv:2104.02079) -- the discovery analysis
#     (OGLE-2017-BLG-0114Lb as a wide-orbit planet candidate; Mroz+26
#     supersedes it with the full source-system treatment).
#
# system architecture:
#   star.0   = L1      lens host      ~0.50 Msun at ~3.4 kpc
#   star.1   = Source  luminous source, a bulge red giant at ~8.5 kpc
#   star.2   = SComp   the source's DARK companion (nothing else models
#                      it: no flux, no lensing -- it exists to move the
#                      source, and its mass is what the xallarap
#                      amplitude measures)
#   planet.0 = b       lens planet, q = 0.0219 -> ~11.5 M_J
#
# The Std 2L1S solution's xallarap amplitude (xi_a = 0.200 of theta_E
# with P = 221.5 d) implies a MASSIVE dark companion: at an assumed
# 1 Msun source, a_1 = 1.47 au requires M_SComp ~ 10 Msun (K_RV,S1 ~ 44
# km/s -- Mroz+26 Table B.2).  Interrogating whether that is physical is
# exactly why their paper samples the source's physical parameters -- and
# EXOZIPPy's component graph does the same thing natively: the sampled
# coordinates ARE the orbit's physical elements and the bodies' masses.

star:
  - name: "L1"
  - name: "Source"
  - name: "SComp"

planet:
  - name: "b"

# The SOURCE binary's orbit.  The lens block's source_orbital_motion
# consumes it: the luminous source's barycentric track, in Einstein units
# a_1/(D_S * theta_E), enters the trajectory at the parallax slot (C25).
orbit:
  - name: "S"
    primary:   ["Source"]
    companion: ["SComp"]

lens:
  - name: "OB170114"
    lenses:  ["star.0", "planet.0"]
    sources: ["star.1"]
    finite_source: True          # rho = 0.0109; the secondary peak
                                 # resolves the source
    # Mroz+26's reference epoch for BOTH the parallax and the xallarap
    # anchor (their t_0,par = t_0,xi; our 5d one-anchor rule is the same
    # convention).
    t0_par: 2457933.5
    source_orbital_motion: keplerian
    source_orbit: "S"
    mmexofast: false             # every start value is seeded from the
                                 # published solution below

galacticmodel:
  - name: "OB170114"
    anchor_idx: 1                # anchor on the source, by convention

band:
  - name: "I"
    filter: "Generic/Cousins.I"
    ld_law: "linear"             # u_I = 0.57 (Mroz+26 Eq. 21)

# OGLE-IV EWS I-band photometry (BLG615.24, star 109070), as downloaded:
# HJD_UTC full JD, magnitudes.  Columns past the error (seeing, sky) are
# named away from the detrend default, exactly as examples/ob09020 does.
# Mroz+26 additionally used occasional OGLE V-band points; those are not
# in the EWS download and are not yet public -- the V-band block below is
# a placeholder to uncomment when they are.
mulensinstrument:
  - name: "OGLE"
    file: "phot.dat"
    filter: "I"
    band: "I"
    columns: {time: 0, mag: 1, err: 2}
    time_scale: "utc"
    time_frame: "hjd"
#  - name: "OGLE_V"
#    file: "photV.dat"
#    filter: "V"
#    band: "V"
#    columns: {time: 0, mag: 1, err: 2}
#    time_scale: "utc"
#    time_frame: "hjd"

parameter_file: "ob170114.params.yaml"

# Added here, absent from the shipped ob170114.yaml (filed as review 2.14.7):
# without them run.py falls back to prefix "fitresults/planet", so a
# microlensing event's outputs land under the name "planet".
run:
  name: "OGLE-2017-BLG-0114"

prefix: "fitresults_accept24/OGLE-2017-BLG-0114"

sampler:
  # `method:`, NOT `name:`.  The shipped file says `name: "ptde_async"`, which
  # is not a known sampler key -- run.py warns and then AUTO-SELECTS, so the
  # example never actually used the sampler its own comment calls for
  # (review 2.14.7).  Binary lens + finite source = the VBM Op path, which is
  # gradient-free, so PTDE is required rather than preferred.
  #
  # SYNC ptde rather than ptde_async: review 7.4.4 leg (c) measured async at
  # 6-11x worse ESS per reserved core-second, and 2.4.9 measured its ladder
  # making 0-1 temperature round trips where sync makes 24-40 at identical
  # Lambda.  Same reasoning as the ob09020 acceptance config.
  method: ptde
  # n_temps 24, not the default 8.  The first attempt (job 15379270) ran the
  # default ladder and it FROZE: per-pair swap acceptance
  # [0.00, 0.00, 0.01, 0.04, 0.07, 0.04, 0.06] and accept(T=1) = 0.002, with
  # 6.49% of draws (48,650/750,000) rejected as raw-z invalid, after which
  # the mode report RAISED rather than reporting.  8 rungs cannot span
  # T_max = 200 for a 34-parameter model.  24 is the number validated on
  # ob140939, where 17 rungs froze at 5-7% acceptance and 24 gave 50-65%
  # with round trips flowing.  Lambda has NOT been measured for this model,
  # so 24 is a precedent rather than a derivation -- if it still freezes,
  # measure Lambda and use n_temps > 2*Lambda + 1.
  n_temps: 24
  T_max: 200
  # A CAP, not a target -- sync ptde stops on Rhat <= 1.01 + ESS >= 1000.
  # The shipped 2000 is likely short for a 2L1S + parallax + xallarap fit
  # whose dark-companion mass is the quantity of interest.
  draws: 30000
  tune: 0
  # Seed both u_0 branches?  NOT here: the published Std 2L1S solution is a
  # single basin and this run's job is to reproduce it.  Mode structure is a
  # separate question, and 1.11.3 says the weights would not be quotable
  # anyway.
  recompute_trace: True
