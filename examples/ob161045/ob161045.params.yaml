# OGLE-2016-BLG-1045 starting values -- Shin et al. 2018, ApJ 863, 23,
# Table 2, the (-, +) "Actual" column (their best-fit case), with the
# limb-darkening coefficients and error re-scaling factors from their
# Table 1.
#
# Only initvals are used for the trajectory: published uncertainties are
# not mapped to sigma.  Conventions, the limb-darkening conversion and the
# flux seeds are explained in README.md.

star.Lens.ra:
    initval: 264.213291           # 17:36:51.19 (OGLE EWS; Shin+18 Sec 2.1.1)
    sigma: 0
star.Lens.dec:
    initval: -34.544361           # -34:32:39.7
    sigma: 0
star.Source.ra:
    initval: 264.213291
    sigma: 0
star.Source.dec:
    initval: -34.544361
    sigma: 0

# --------------------------------------------------------------------
# Trajectory -- Shin+18 Table 2, (-, +) Actual
# --------------------------------------------------------------------
source.Source.t_0:
    initval: 2457559.201          # HJD' 7559.201 +/- 0.001

# Negative, as published; the sign is not measurable here (README).
source.Source.u_0:
    initval: -0.01308             # -1.308e-2 +0.033/-0.042 (10^-2 units)

# --------------------------------------------------------------------
# t_E and rho are derived from the physical chain below, not seeded
# (README).  Targets (Shin+18 Eq. 7, Sec 2.3.1, Eq. A1): theta_E = 0.244
# mas, theta_* = 7.80 uas, M_L = 0.08 M_sun, D_L = 5.02 kpc,
# mu_rel = 0.244 mas / 11.981 d = 7.44 mas/yr.
# --------------------------------------------------------------------
star.Lens.mass:
    initval: 0.08
star.Lens.distance:
    initval: 5020.0
star.Source.distance:
    initval: 8000.0

# theta_* = 7.80 uas at D_S = 8 kpc: R_S = 13.42 R_sun.  Free (README).
star.Source.radius:
    initval: 13.42

# |mu_rel| = 7.44 mas/yr; its direction is unconstrained here, so it is
# split along RA with a bulge source at rest.
star.Source.pm_ra:
    initval: 0.0
star.Source.pm_dec:
    initval: 0.0
star.Lens.pm_ra:
    initval: 7.44
star.Lens.pm_dec:
    initval: 0.0

# --------------------------------------------------------------------
# Limb darkening -- Shin+18 Table 1, CONVERTED
# --------------------------------------------------------------------
# Shin+18 quote Gamma; band.u1 is the linear u = 3 Gamma/(2 + Gamma):
#     Gamma_I = 0.5103 -> 0.60985,  Gamma_R = 0.6583 -> 0.74292
# Pinned, as in the published fit.  Gamma_R is Shin+18's Auckland
# (Wratten 12) value, (Gamma_R + Gamma_V)/2.
band.I.u1:
    initval: 0.60985
    sigma: 0
band.Auckland_R.u1:
    initval: 0.74292
    sigma: 0

# --------------------------------------------------------------------
# Baseline flux
# --------------------------------------------------------------------
# Weighted linear-flux solution at the published trajectory, limb
# darkening and error rescaling (README, "Blending").
mulensinstrument.OGLE.log_f_total:
    initval: -7.0734
mulensinstrument.OGLE.q_source:
    initval: 1.030
mulensinstrument.KMTC.log_f_total:
    initval: -7.0731
mulensinstrument.KMTC.q_source:
    initval: 1.022
mulensinstrument.KMTS.log_f_total:
    initval: -7.0743
mulensinstrument.KMTS.q_source:
    initval: 1.030
mulensinstrument.KMTA.log_f_total:
    initval: -7.0728
mulensinstrument.KMTA.q_source:
    initval: 1.029

# Auckland never reaches baseline, so its blending is a seed at no
# blending, not a measurement (README).
mulensinstrument.Auckland.log_f_total:
    initval: -6.4203          # log10(3.7998e-07)
mulensinstrument.Auckland.q_source:
    initval: 1.0

# --------------------------------------------------------------------
# Error re-scaling -- Shin+18, as distributed with the data
# --------------------------------------------------------------------
# error_new = coeff_A * sqrt(error_old**2 + coeff_B**2) with coeff_B = 0,
# so coeff_A maps one-to-one onto err_scale (initvals, not pins).
mulensinstrument.OGLE.err_scale:
    initval: 0.913
mulensinstrument.KMTC.err_scale:
    initval: 1.116
mulensinstrument.KMTS.err_scale:
    initval: 1.501
mulensinstrument.KMTA.err_scale:
    initval: 1.446
mulensinstrument.Auckland.err_scale:
    initval: 2.370
