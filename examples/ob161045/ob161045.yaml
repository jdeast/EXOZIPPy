run:
  name: "OB161045"

prefix: "fitresults/ob161045"

# OGLE-2016-BLG-1045: a FINITE-SOURCE POINT LENS (FSPL, 1L1S).
#
# This is the example that exercises finite-source effects on a SINGLE lens.
# The other shipped finite-source cases do something different: ob161003
# fits a source radius on a BINARY lens, and DC2018_128 only toggles
# finite_source off.  Here the finite source IS the measurement -- the
# source transits the lens (u_0 = 1.31e-2 against rho = 3.19e-2, so
# u_0 < rho), which is what makes theta_E, and therefore the lens mass,
# measurable at all.
#
# Published solution: Shin et al. 2018, ApJ 863, 23
# ("OGLE-2016-BLG-1045: A Test of Cheap Space-based Microlens Parallaxes")
# https://ui.adsabs.harvard.edu/abs/2018ApJ...863...23S/abstract
#   t_0 = 7559.201 (HJD'), u_0 = -1.308e-2, t_E = 11.981 d, rho = 3.186e-2
#
# GROUND-BASED ONLY.  The paper's headline result is a Spitzer space-based
# parallax (pi_E = 0.355), but no Spitzer photometry ships with this data
# set, so no parallax is fit here -- matching MMEXOFAST's own
# examples/use_case_03_ob1045.py, which is likewise titled "Analyze the
# ground-based data".  The paper's ground-only chi2 (1343-1345 / 1348) is
# essentially identical across all six of its cases, so the trajectory
# above is the ground-based solution to the precision that matters.
#
# system architecture:
#   star.Lens   = the (isolated) lens
#   star.Source = background source

star:
  - name: "Lens"
  - name: "Source"

lens:
  - body: star.Lens

source:
  - body: star.Source

mulensevent:
  - finite_source: True
    # mag_method defaults to auto_vbbl whenever finite_source is on.
    t0_par: 2457559.201

galacticmodel:
  - name: "OB161045"
    anchor_idx: 1              # anchor on the source (star.Source)

# ld_law MUST be linear on a finite-source fit.  Band's own default is
# quadratic, and on a band that only microlensing reads that is a trap: the
# source profile would be a linear law standing in for a quadratic one AND
# exactly one combination of the sampled Kipping (q1, q2) pair would be
# likelihood-free.  Every shipped finite-source example writes it out by
# hand for this reason (mulensing.md).
#
# The u1 values are pinned in the params file.  Note the conversion done
# there: Shin+18 Table 1 quotes GAMMA, this codebase takes u.
band:
  - name: "KMT_I"
    filter: "Generic/Cousins.I"
    ld_law: "linear"
  - name: "Auckland_R"
    # The Auckland observations used a Wratten 12 filter, flat between
    # 540-700 nm, which Shin+18 treat as the mean of R and V rather than as
    # a standard R.  Cousins R is named here only as the nearest standard
    # bandpass; with no sed: block nothing reads the filter identity, so it
    # affects nothing today.  It WOULD matter if an sed: block were added,
    # and the synthetic R flux would then be wrong at the few-percent level.
    filter: "Generic/Cousins.R"
    ld_law: "linear"

# Three whitespace columns: full Julian Date, difference FLUX, flux error.
# Reduced with pySIS (Albrow et al. 2009) per Shin+18 Section 2.1.1.
#
# These .dat files are GENERATED by convert_data.py from the MMEXOFAST
# originals kept beside them, which cannot be read directly: the KMT files
# store the difference flux NEGATED while Auckland does not, so loading the
# raw KMT files as flux yields a negative source flux in every band.  See
# convert_data.py for how the sign was established rather than assumed.
mulensinstrument:
  - name: "KMTC"
    file: "KMTC.I.OB161045.dat"
    data_format: flux
    band: "KMT_I"

  - name: "KMTS"
    file: "KMTS.I.OB161045.dat"
    data_format: flux
    band: "KMT_I"

  - name: "KMTA"
    file: "KMTA.I.OB161045.dat"
    data_format: flux
    band: "KMT_I"

  - name: "Auckland"
    file: "Auckland.R.OB161045.dat"
    data_format: flux
    band: "Auckland_R"

parameter_file: "ob161045.params.yaml"

sampler:
  method: ptde_async      # Differential Evolution + Parallel Tempering
  n_temps: 8
  T_max: 200
  tune: 2000
  draws: 20000
  nthin: 1
  recompute_trace: True
