run:
  name: "OB161045"

prefix: "fitresults/ob161045"

# OGLE-2016-BLG-1045: a FINITE-SOURCE POINT LENS (FSPL, 1L1S).
#
# This is the example that exercises finite-source effects on a SINGLE lens.
# The other shipped finite-source cases do something different: ob161003
# fits a source radius on a BINARY lens, and DC2018_128 only toggles
# finite_source off.  Here the finite source IS the measurement -- the
# source transits the lens (u_0 = 1.31e-2 against rho = 3.19e-2, so
# u_0 < rho), which is what makes theta_E, and therefore the lens mass,
# measurable at all.
#
# Published solution: Shin et al. 2018, ApJ 863, 23
# ("OGLE-2016-BLG-1045: A Test of Cheap Space-based Microlens Parallaxes")
# https://ui.adsabs.harvard.edu/abs/2018ApJ...863...23S/abstract
#   t_0 = 7559.201 (HJD'), u_0 = -1.308e-2, t_E = 11.981 d, rho = 3.186e-2
#
# DATA: the Shin+18 reductions themselves, provided by J. Yee to JDE, and
# committed here unmodified.  One format for all five files -- three
# whitespace columns, HJD-2450000 / magnitude / magnitude error -- so
# nothing in this directory needs a conversion script, and the example
# reads what the authors actually fitted rather than a re-derived copy.
#
# GROUND-BASED ONLY.  Shin+18's headline result is a Spitzer space-based
# parallax; their I_Spitzer_L.dat exists but is not included here, so no
# parallax is fit.  That matches MMEXOFAST's own
# examples/use_case_03_ob1045.py, likewise titled "Analyze the ground-based
# data".  Adding Spitzer is the natural extension and would need an
# observer_location and its ephemeris.
#
# WHAT EACH DATASET CONTRIBUTES.  They are not interchangeable:
#   OGLE-IV   683 epochs over 6 years -- the only BASELINE.  Without it the
#             source/blend split is unconstrained, since every other data
#             set sits on or near the peak.
#   KMTC/S/A  the survey coverage of the event itself.
#   Auckland  the PEAK.  47 of its 91 epochs fall within 0.2 d of t_0,
#             where all three KMT sites have ZERO; KMT's cadence missed the
#             peak entirely, so Auckland alone resolves the finite source
#             this example is about.
#
# system architecture:
#   star.Lens   = the (isolated) lens
#   star.Source = background source

star:
  - name: "Lens"
  - name: "Source"

lens:
  - body: star.Lens

source:
  - body: star.Source

mulensevent:
  - finite_source: True
    # mag_method defaults to auto_vbbl whenever finite_source is on.
    t0_par: 2457559.201

galacticmodel:
  - name: "OB161045"
    anchor_idx: 1              # anchor on the source (star.Source)

# ld_law MUST be linear on a finite-source fit.  Band's own default is
# quadratic, and on a band that only microlensing reads that is a trap: the
# source profile would be a linear law standing in for a quadratic one AND
# exactly one combination of the sampled Kipping (q1, q2) pair would be
# likelihood-free.  Every shipped finite-source example writes it out by
# hand for this reason (mulensing.md).
#
# ONE I band for OGLE and all three KMT sites: Shin+18 give every one of
# them the same Claret+2000 coefficient (Gamma = 0.5103), and a band
# carries the bandpass, not the site -- zeropoint differences are absorbed
# per instrument by f_source/f_blend.  The u1 values are pinned in the
# params file; note the Gamma -> u conversion done there.
band:
  - name: "I"
    filter: "Generic/Cousins.I"
    ld_law: "linear"
  - name: "Auckland_R"
    # Auckland used a Wratten 12 filter, flat between 540-700 nm, which
    # Shin+18 treat as the mean of R and V rather than as a standard R.
    # Cousins R is named only as the nearest standard bandpass; with no
    # sed: block nothing reads the filter identity, so it affects nothing
    # today.  It WOULD matter if an sed: block were added.
    filter: "Generic/Cousins.R"
    ld_law: "linear"

# Every file is HJD-2450000 / magnitude / magnitude error, so the default
# data_format (magnitude) applies and only the time offset is declared.
# The fit itself is always in flux: magnitudes are converted at load,
# exactly for the value, with the error propagated to first order at the
# OBSERVED flux (components/mulensing/mulensinstrument.py).
mulensinstrument:
  - name: "OGLE"
    file: "I_OGLE_I.nom"
    time_offset: 2450000.0
    band: "I"

  - name: "KMTC"
    file: "I_KMTC_I.pys"
    time_offset: 2450000.0
    band: "I"

  - name: "KMTS"
    file: "I_KMTS_I.pys"
    time_offset: 2450000.0
    band: "I"

  - name: "KMTA"
    file: "I_KMTA_I.pys"
    time_offset: 2450000.0
    band: "I"

  - name: "Auckland"
    file: "I_Auckland_R.pys"
    time_offset: 2450000.0
    band: "Auckland_R"

parameter_file: "ob161045.params.yaml"

sampler:
  method: ptde_async      # Differential Evolution + Parallel Tempering
  n_temps: 8
  T_max: 200
  tune: 2000
  draws: 20000
  nthin: 1
  recompute_trace: True
