star.Source.av:
  # The COLOUR anchor through our own integrated BC grid, not the
  # simulation's monochromatic A_V of 9.88.  At 9.01 both truth bands
  # come out -0.58 mag -- the SAME offset -- and a common-mode grey
  # offset is degenerate with distance and radius, which the SED
  # already fits.  Anchoring A_W149 instead (11.75) misses the colour
  # by +0.81 mag, and only teffsed can absorb that.  sigma is a model
  # uncertainty: std 0.10 across 36 (feh, Teff, logg) cells, depending
  # on Teff alone at 0.28/1000 K.  See conventions.md C29.
  mu: 9.01
  sigma: 0.3

