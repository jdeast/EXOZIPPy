# OGLE-2009-BLG-020 -- LINEAR orbital motion (the ds_dt / dalpha_dt path).
#
# Light curve: Skowron et al. 2011, ApJ 738, 87 (S11), Table 1, the
#   "parallax + full orbit (with priors)" column -- the SAME column as the
#   keplerian sibling, and every S11 value below is from it (JDE
#   2026-10-15: do not mix Table-1 columns).  IOP version of record, except
#   where a line says arXiv v1.  S11's own linear fit is the "parallax + 2
#   par. motion" column; this file deliberately does not use it, and
#   linearizes the full-orbit solution instead: the column's gamma_par and
#   gamma_perp are the Keplerian orbit's instantaneous rates at t0_par,
#   which is exactly what a linear-motion model holds fixed.
#
# Skowron+2011 Appendix A is EXOZIPPy's convention (conventions.md C17),
# so the trajectory parameters transfer unchanged.  The two ORBITAL-MOTION
# parameters do not transfer verbatim and are converted below; the
# arithmetic is written out so it can be checked.
#
# The physical block (L1 mass, distances, Gaia proper motion) is the
# sibling's, Yee et al. 2016 Table 7: it is the same lens system.  The
# mass ratio is S11's light-curve q = 0.273 (the sibling uses Yee's joint
# 0.275).

# Sky position (OGLE EWS).  Required: the OGLE file is HJD_UTC and the
# HJD -> BJD_TDB conversion refuses placeholder coordinates.
star.ra:
    initval: 271.0874583
    sigma: 0
star.dec:
    initval: -29.5190556
    sigma: 0

# --- Light curve (S11 Table 1, "parallax + full orbit (with priors)") ----
# t_0 = HJD' 4917.252 +0.016/-0.009, written as the full HJD; the data are
# converted to BJD_TDB at load, and the ~65 s UTC->TDB plus the < 4 s
# HJD->BJD difference (0.0008 d) is a tenth of the printed uncertainty.
source.Source.t_0:
    initval: 2454917.252

source.Source.u_0:
    initval: 0.0613           # positive, as printed; see the A16 note below

# rho = t_*/t_E, both printed: 0.11595 d / 76.9 d (as in the sibling).
source.Source.rho:
    initval: 0.0015078

# log q = -0.5637 +/- 0.0062 -> q = 0.273
lens.L2.q:
    initval: 0.273

# s and alpha ARE inputs here, unlike the keplerian sibling where they are
# derived from orbit L: the column's derived s_0 and alpha_0.
lens.L2.s:
    initval: 0.4294
lens.L2.alpha:
    initval: 189.08           # deg

# --- Orbital motion: Skowron's gammas, CONVERTED --------------------------
# Skowron+2011 parameterize the sky-projected motion as
#
#     s(t)     = s_0 (1 + gamma_par  (t - t0_par))
#     alpha(t) = alpha_0 - gamma_perp (t - t0_par)
#
# and their Table 1 "parallax + full orbit (with priors)" column gives
# gamma_par = 0.10 +/- 0.06 /yr and gamma_perp = 2.3 +0.5/-0.3 /yr.  THESE
# TWO RATES ARE FROM THE arXiv v1 EDITION, because the IOP edition's rates
# were unavailable (JDE 2026-10-16); every other S11 value in this file is
# the IOP edition's.
# EXOZIPPy's two parameters are NOT those:
#
#   ds_dt is a RATE, not a fractional one -- Einstein radii of the TOTAL
#   mass per Julian year (C13/C24, defaults.yaml) -- so it carries the s_0
#   factor that gamma_par divides out:
#
#       ds_dt = gamma_par * s_0 = 0.10 * 0.4294 = 0.04294 r_E/yr
#
#   dalpha_dt is the NEGATIVE of gamma_perp (conventions.md C24, Skowron
#   Appendix A.4 verbatim), and its USER unit is deg/yr while gamma_perp is
#   quoted in rad/yr:
#
#       dalpha_dt = -gamma_perp = -2.3 rad/yr
#                 = -2.3 * 180/pi = -131.78 deg/yr
#
# Both conversions were checked by measurement (README).
#
# The A16 mirror flips (u_0, alpha, pi_E_perp, dalpha_dt) TOGETHER, so
# dalpha_dt's sign is tied to u_0 being positive above -- one choice, not
# two.  Table 1's note says every column is the positive-u_0 solution.
orbit.L.ds_dt:
    initval: 0.04294            # r_E/yr
orbit.L.dalpha_dt:
    initval: -131.78          # deg/yr

# --- Lens and source physical parameters ----------------------------------
# Yee+2016 number the bodies opposite to Skowron: their M1 = 0.244 and
# M2 = 0.888 are EXOZIPPy's L2 and L1.
star.L1.mass:
    initval: 0.888
star.L1.distance:
    initval: 747.0            # pc

# S11 Sec. 3.2's assumed source distance (pi_s = 0.125 mas); see the
# keplerian sibling.
star.Source.distance:
    initval: 8000.0           # pc

# --- Proper motions (the leaves t_E and pi_E derive from) -----------------
# Derived as in the keplerian sibling (README), at S11's t_E = 76.9 d and
# this file's q = 0.273:
#   M = 0.888 (1 + 0.273) = 1.130424 Msun, pi_rel = 1.213688 mas
#   theta_E = 3.342637 mas, |pi_E| = 0.363093
#   pi_E = (-0.331113, +0.149) (S11's pi_E,E; pi_E,N negative), phi_pi =
#   155.7723 deg
#   mu_geo = theta_E / t_E = 15.876438 mas/yr -> (E, N) = (6.515106,
#   -14.478076); mu_helio = mu_geo + pi_rel v_perp = (7.100161, -13.665575)
# The lens primary's pm is Gaia DR3 4050356367410860160 (the 0.5" blend
# the lens dominates; its RUWE of 3.4 is what the 276 d binary's moving
# photocenter gives); the source's is the lens's minus mu_helio.
star.L1.pm_ra:
    initval: 4.389036         # mas/yr, Gaia DR3 pmra
star.L1.pm_dec:
    initval: -11.233021       # mas/yr, Gaia DR3 pmdec
star.Source.pm_ra:
    initval: -2.711125        # = 4.389036 - 7.100161
star.Source.pm_dec:
    initval: 2.432554         # = -11.233021 + 13.665575

# --- Per-instrument blending and error scaling ----------------------------
# f_source and f_blend fit linearly against the model above, per
# instrument; err_scale is the sqrt(chi2/N) that fit leaves.  The muFUN
# files are raw instrumental magnitudes with an arbitrary per-site
# zeropoint, so log_f_total cannot be defaulted.

# A stricter ceiling on every instrument's err_scale than the default 100
# (JDE, 2026-09-25).  Measured 2026-09-25: from these seeds the DE seed
# polish bought +383 nats by inflating err_scale to 36 (OGLE) and 92
# (Bronberg) while dropping the lens companion to ~1e-7 Msun -- a
# point-lens basin the wide ceiling made cheaper than fixing the wings.
# Ten leaves room for the real underestimates here (the OGLE out-of-event
# baseline needs 3.6; the seed-start wing mismatch needs ~7) and takes the
# collapsed basin off the table.  Broadcast to all nine instruments; the
# per-instrument entries below refine the start only.
mulensinstrument.err_scale:
    upper: 10.0
mulensinstrument.OGLE.q_source:
    initval: 0.3510
mulensinstrument.OGLE.log_f_total:
    initval: -6.02866
mulensinstrument.OGLE.err_scale:
    initval: 3.6              # the out-of-event baseline value

mulensinstrument.Bronberg.q_source:
    initval: 0.3738
mulensinstrument.Bronberg.log_f_total:
    initval: -7.35861
mulensinstrument.Bronberg.err_scale:
    initval: 1.03

mulensinstrument.CAO.q_source:
    initval: 0.3566
mulensinstrument.CAO.log_f_total:
    initval: -7.01053
mulensinstrument.CAO.err_scale:
    initval: 1.97

mulensinstrument.CT13_I.q_source:
    initval: 0.3311
mulensinstrument.CT13_I.log_f_total:
    initval: -6.40299
mulensinstrument.CT13_I.err_scale:
    initval: 3.26

mulensinstrument.CT13_V.q_source:
    initval: 0.2250
mulensinstrument.CT13_V.log_f_total:
    initval: -6.03292
mulensinstrument.CT13_V.err_scale:
    initval: 1.0              # only 5 points; the fitted 0.20 is noise

mulensinstrument.FarmCove.q_source:
    initval: 0.2701
mulensinstrument.FarmCove.log_f_total:
    initval: -6.70539
mulensinstrument.FarmCove.err_scale:
    initval: 2.45

mulensinstrument.Kumeu.q_source:
    initval: 0.3162
mulensinstrument.Kumeu.log_f_total:
    initval: -6.76844
mulensinstrument.Kumeu.err_scale:
    initval: 1.39

mulensinstrument.Possum.q_source:
    initval: 0.1709
mulensinstrument.Possum.log_f_total:
    initval: -6.56991
mulensinstrument.Possum.err_scale:
    initval: 3.10

mulensinstrument.VintageLane.q_source:
    initval: 0.1872
mulensinstrument.VintageLane.log_f_total:
    initval: -6.75675
mulensinstrument.VintageLane.err_scale:
    initval: 1.31

# star.Source.radius is left free: with finite_source on, rho is read but
# the radius is not separately identifiable.  Skowron measure theta_* =
# 4.45 +/- 0.40 uas, an ANGLE; imposing it as a radius would feed the
# assumed source distance back in as if it were measured.
