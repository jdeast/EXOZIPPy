# OGLE-2009-BLG-020 / OGLE-2009-BLG-020L starting values.
#
# Every seed below is a printed value or is derived from printed values,
# with the conversion written out beside it:
#   Skowron et al. 2011, ApJ 738, 87 (S11): Table 1, "parallax + full
#     orbit (with priors)" column -- the IOP version of record; the arXiv
#     v1 posting prints different values (README) -- and Sec. 3.2's
#     assumed source distance.
#   Yee et al. 2016, ApJ 821, 121 (Y16): Table 7, the joint microlensing
#     + RV fit (masses, D_L, q and the orbit).  Y16 print no light-curve
#     parameters for that fit.
#   Gaia DR3 4050356367410860160 (0.5" from the event): the lens proper
#     motion.
#
# S11 Appendix A is EXOZIPPy's convention (conventions.md C17), so its
# trajectory parameters transfer unchanged.  S11's printed t_E, theta_E
# and pi_E are NOT seeded: in this model they are derived from the masses,
# distances and proper motions (README, "Which values are seeded").

# Sky position (OGLE EWS).  Required: the OGLE file is HJD_UTC and the
# HJD -> BJD_TDB conversion refuses placeholder coordinates.
star.ra:
    initval: 271.0874583
    sigma: 0
star.dec:
    initval: -29.5190556
    sigma: 0

# --- Light curve (S11 Table 1, with priors) -------------------------------
source.Source.t_0:
    initval: 2454917.252

source.Source.u_0:
    initval: 0.0613           # positive, as printed

# rho = t_*/t_E, both printed: 0.11595 d / 76.9 d.  (The ob09020_linear
# sibling uses the same value.)
source.Source.rho:
    initval: 0.0015078

# s and alpha are derived from orbit L (the lens companion's `orbit: L`,
# keplerian), so the published s_0 = 0.4294 and alpha_0 = 189.08 are the
# acceptance check, not inputs.

# --- Lens and source physical parameters (Y16 Table 7; S11 Sec. 3.2) ------
# Y16 number the bodies opposite to S11: their m1 = 0.244 and m2 = 0.888
# are EXOZIPPy's L2 and L1, and their q = 0.275 = m1/m2 is lens.L2.q.
# (S11's light-curve q = 0.273 is the same quantity from the light curve
# alone; Y16's joint value is used so the physical block is one paper's.)
star.L1.mass:
    initval: 0.888
lens.L2.q:
    initval: 0.275
star.L1.distance:
    initval: 747.0            # pc, Y16 D_L
star.L2.distance:
    initval: 747.0            # pc

# S11 Sec. 3.2: "We assume the source to be in the Galactic Bulge at
# Ds = 8 kpc, and thus the source parallax is pi_s = 0.125 mas" -- the
# pi_S of Y16's Table 4 D_L = AU/(theta_E pi_E + pi_S).  An assumption, but
# the papers' own.
star.Source.distance:
    initval: 8000.0           # pc

# --- Proper motions (the leaves t_E and pi_E derive from) -----------------
# Derived, not printed.  From the block above:
#   M = 0.888 (1 + 0.275) = 1.1322 Msun, pi_rel = 1/0.747 - 1/8 = 1.213688 mas
#   theta_E = sqrt(kappa M pi_rel) = 3.345262 mas  (kappa = 8.143853)
#   |pi_E| = pi_rel / theta_E = 0.362808
# Direction: pi_E,E = +0.149 is S11's printed, well-measured component;
# pi_E,N = -sqrt(|pi_E|^2 - 0.149^2) = -0.330800, NEGATIVE as in S11's most
# probable region (Sec. 4.2.1: pi_E,N ~ -0.2, pi_E,E ~ +0.2).  S11's
# printed pi_E,N = -0.022 is the median of a posterior S11 Sec. 5.1 splits
# into pi_E,N > 0 and < 0 regions, not a point on either (README).
#   phi_pi = atan2(pi_E,E, pi_E,N) = 155.7521 deg E of N
# Magnitude: mu_geo = theta_E / t_E = 3.345262 / 76.9 d = 15.888905 mas/yr
# (S11's printed t_E), so mu_geo (E, N) = (6.525341, -14.487140).  The
# model's heliocentric relative motion adds pi_rel v_earth,perp(t0_par)
# (S11 eq. A9; v_perp = (0.482048, 0.669449) au/yr at this event's t0_par,
# MulensEvent.register_frame_constants): mu_helio = (7.110397, -13.674638).
# The lens primary's pm is Gaia DR3 4050356367410860160 (G = 16.26, the
# blend of lens and source at 0.5" -- the lens dominates; RUWE 3.4, as a
# 276 d binary's photocenter would give), and the source's is the lens's
# minus mu_helio.
star.L1.pm_ra:
    initval: 4.389036         # mas/yr, Gaia DR3 pmra
star.L1.pm_dec:
    initval: -11.233021       # mas/yr, Gaia DR3 pmdec
star.Source.pm_ra:
    initval: -2.721362        # = 4.389036 - 7.110397
star.Source.pm_dec:
    initval: 2.441618         # = -11.233021 + 13.674638

# --- Lens binary orbit (Y16 Table 7) --------------------------------------
orbit.L.period:
    initval: 276.555          # d

orbit.L.tp:
    initval: 2454758.692      # time of periastron

# e = 0.265, omega_* = 331.600 deg.  Y16 print omega_peri = 151.600, the
# other end of the apsidal line; EXOFASTv2's omega_* is that plus 180.
orbit.L.secosw:
    initval: 0.4528268
orbit.L.sesinw:
    initval: -0.2448427

# Y16 quote the orbit in the S11 Appendix B frame, whose third axis points
# toward the observer (EXOZIPPy's +Z points away), so i -> 180 - i.
orbit.L.cosi:
    initval: 0.635054         # i = 180 - 129.424 = 50.576 deg

# Y16's Omega_node = -7.767 is in that same frame, and the mapping into
# EXOZIPPy's sky frame is bigomega = PA(binary axis at t_0,kep) -
# Omega_frame, with PA = phi_pi - alpha_0 (S11's alpha_0 = 189.08):
#   bigomega = 155.7521 - 189.08 + 7.767 = -25.561 = 334.439 deg
# (the earlier 340.755 is the same rule at the phi_pi = 162.07 deg the
# engine used to derive).  The fit is extremely sharp in it -- +/-10 deg
# costs >1e6 nats -- so do not round it.
orbit.L.bigomega:
    initval: 334.4391         # deg E of N

# --- Per-instrument blending and error scaling ----------------------------
# f_source and f_blend fit linearly against the model above, per
# instrument; err_scale is the sqrt(chi2/N) that fit leaves.  The muFUN
# files are raw instrumental magnitudes with an arbitrary per-site
# zeropoint, so log_f_total cannot be defaulted.

# A stricter ceiling on every instrument's err_scale than the default 100
# (JDE, 2026-09-25).  Measured 2026-09-25: from these seeds the DE seed
# polish bought +383 nats by inflating err_scale to 36 (OGLE) and 92
# (Bronberg) while dropping the lens companion to ~1e-7 Msun -- a
# point-lens basin the wide ceiling made cheaper than fixing the wings.
# Ten leaves room for the real underestimates here (the OGLE out-of-event
# baseline needs 3.6; the seed-start wing mismatch needs ~7) and takes the
# collapsed basin off the table.  Broadcast to all nine instruments; the
# per-instrument entries below refine the start only.
mulensinstrument.err_scale:
    upper: 10.0
mulensinstrument.OGLE.q_source:
    initval: 0.3510
mulensinstrument.OGLE.log_f_total:
    initval: -6.02866
mulensinstrument.OGLE.err_scale:
    initval: 3.6              # the out-of-event baseline value

mulensinstrument.Bronberg.q_source:
    initval: 0.3738
mulensinstrument.Bronberg.log_f_total:
    initval: -7.35861
mulensinstrument.Bronberg.err_scale:
    initval: 1.03

mulensinstrument.CAO.q_source:
    initval: 0.3566
mulensinstrument.CAO.log_f_total:
    initval: -7.01053
mulensinstrument.CAO.err_scale:
    initval: 1.97

mulensinstrument.CT13_I.q_source:
    initval: 0.3311
mulensinstrument.CT13_I.log_f_total:
    initval: -6.40299
mulensinstrument.CT13_I.err_scale:
    initval: 3.26

mulensinstrument.CT13_V.q_source:
    initval: 0.2250
mulensinstrument.CT13_V.log_f_total:
    initval: -6.03292
mulensinstrument.CT13_V.err_scale:
    initval: 1.0              # only 5 points; the fitted 0.20 is noise

mulensinstrument.FarmCove.q_source:
    initval: 0.2701
mulensinstrument.FarmCove.log_f_total:
    initval: -6.70539
mulensinstrument.FarmCove.err_scale:
    initval: 2.45

mulensinstrument.Kumeu.q_source:
    initval: 0.3162
mulensinstrument.Kumeu.log_f_total:
    initval: -6.76844
mulensinstrument.Kumeu.err_scale:
    initval: 1.39

mulensinstrument.Possum.q_source:
    initval: 0.1709
mulensinstrument.Possum.log_f_total:
    initval: -6.56991
mulensinstrument.Possum.err_scale:
    initval: 3.10

mulensinstrument.VintageLane.q_source:
    initval: 0.1872
mulensinstrument.VintageLane.log_f_total:
    initval: -6.75675
mulensinstrument.VintageLane.err_scale:
    initval: 1.31

# star.Source.radius is left free: with finite_source on, rho is read but
# the radius is not separately identifiable.  Skowron measure theta_* =
# 4.45 +/- 0.40 uas, an ANGLE; imposing it as a radius would feed the
# assumed source distance back in as if it were measured.
