# OGLE-2009-BLG-020 / OGLE-2009-BLG-020L starting values.
#
# Light curve: Skowron et al. 2011, ApJ 738, 87, Table 1, "parallax + full
#   orbit (with priors)" column.  Use the IOP version of record -- the
#   arXiv v1 posting prints different values (see README.md).
# Orbit: Yee et al. 2016, ApJ 821, 121, Table 7 (joint microlensing + RV).
#
# Skowron+2011 Appendix A is EXOZIPPy's convention (conventions.md C17),
# so its parameters transfer unchanged.  Where a value below is NOT as
# printed, the line says which published number it came from and how.
#
# Which paper each value is from is stated beside it.  The two papers'
# values are not one self-consistent set (marginal medians, and the
# physical block is Yee's while the light curve is Skowron's), so the
# light-curve quantities the physical block DETERMINES -- t_E, theta_E,
# pi_E -- are not seeded; see "Light curve" below.  D_S = 8 kpc is from
# neither paper: it is an assumption.

# Sky position (OGLE EWS).  Required: the OGLE file is HJD_UTC and the
# HJD -> BJD_TDB conversion refuses placeholder coordinates.
star.ra:
    initval: 271.0874583
    sigma: 0
star.dec:
    initval: -29.5190556
    sigma: 0

# --- Light curve (Skowron+2011 Table 1) -----------------------------------
source.Source.t_0:
    initval: 2454917.252

source.Source.u_0:
    initval: 0.0613           # positive, as printed

# t_E, theta_E and pi_E (Skowron: 76.9 d, 2.95 mas, (-0.022, +0.149)) are
# NOT pinned (JDE 2026-10-14).  Here they are DERIVED from the masses,
# distances and proper motions, and Yee's physical block -- M = 0.888 +
# 0.244 Msun, D_L = 747 pc -- with the assumed D_S = 8 kpc gives
# theta_E = 3.34 mas and |pi_E| = pi_rel/theta_E = 0.363, where Skowron's
# light-curve column prints 2.95 and 0.151 (which together imply M_total =
# 2.4 Msun and pi_rel = 0.444 mas, i.e. the source at 1.1 kpc for this
# D_L).  The two papers' values cannot all hold at once; pinned together,
# the relaxation engine kept t_E and pi_E_N, dropped theta_E and pi_E_E,
# and settled the pi_E direction on its mirror branch (start logp
# -892,087).  A pure-Skowron set is worse still (README).  So the physical
# block is kept and the light-curve values it determines are not seeded;
# the proper motions below supply the one thing Yee's block does not.

# rho = theta_*/theta_E, with Skowron's measured angular source radius
# theta_* = 4.45 uas and the theta_E = 3.3426 mas Yee's block derives.
# Skowron's printed rho = t_*/t_E = 0.11595/76.9 = 0.0015078 rests on their
# t_E, which is not seeded here; measured at this start: +36,530 with this
# rho, +35,937 with 0.0015078.
source.Source.rho:
    initval: 0.0013313

lens.L2.q:
    initval: 0.273

# s and alpha are derived from orbit L (the lens companion's `orbit: L`, keplerian), so the
# published s_0 = 0.4294 and alpha_0 = 189.08 are the acceptance check,
# not inputs.

# --- Lens and source physical parameters ----------------------------------
# Yee+2016 number the bodies opposite to Skowron: their M1 = 0.244 and
# M2 = 0.888 are EXOZIPPy's L2 and L1.
star.L1.mass:
    initval: 0.888
star.L1.distance:
    initval: 747.0            # pc
star.L2.distance:
    initval: 747.0            # pc

star.Source.distance:
    initval: 8000.0           # pc -- an ASSUMPTION, from neither paper

# --- Proper motions (the leaves t_E and pi_E derive from) -----------------
# NOT published: neither paper prints a proper motion.  t_E and pi_E are
# DERIVED here, from the masses, the distances and the relative proper
# motion, and Yee's block fixes everything except that last vector -- so it
# has to be seeded, and these are the values that put the trajectory where
# every ob09020 measurement since 2026-09-11 was taken (start logp +36,397,
# and the frame orbit.L.bigomega below was converted against): t_E = 83.73
# d and pi_E = (-0.345, +0.112), phi_pi = 162.07 deg, with the source at
# its default -3 mas/yr.  They are what the relaxation engine solved from
# Skowron's printed t_E and pi_E pins before those pins were removed (see
# "Light curve" above).  The source pm is the default, written out so the
# relative motion is stated, not implied.
star.L1.pm_ra:
    initval: 2.0744280203949508    # mas/yr
star.L1.pm_dec:
    initval: -16.060377498515283   # mas/yr
star.Source.pm_ra:
    initval: -3.0
star.Source.pm_dec:
    initval: -3.0

# --- Lens binary orbit (Yee+2016 Table 7) ---------------------------------
orbit.L.period:
    initval: 276.555          # d

orbit.L.tp:
    initval: 2454758.692      # time of periastron

# e = 0.265, omega_* = 331.600 deg.  Yee print omega_peri = 151.600, the
# other end of the apsidal line; EXOFASTv2's omega_* is that plus 180.
orbit.L.secosw:
    initval: 0.4528268
orbit.L.sesinw:
    initval: -0.2448427

# Yee quote the orbit in the Skowron Appendix B frame, whose third axis
# points toward the observer (EXOZIPPy's +Z points away), so i -> 180 - i.
orbit.L.cosi:
    initval: 0.635054         # i = 180 - 129.424 = 50.576 deg

# Yee's Omega_node = -7.767 is in that same frame, and the mapping into
# EXOZIPPy's sky frame is bigomega = PA(binary axis at t_0,kep) -
# Omega_frame.  PA is not published: it is phi_pi - alpha_0, and phi_pi is
# a model output, so this seed is frame-converted against the built model
# rather than read off the table.  The fit is extremely sharp in it --
# +/-10 deg costs >1e6 nats -- so do not round it.
orbit.L.bigomega:
    initval: 340.755          # deg E of N

# --- Per-instrument blending and error scaling ----------------------------
# f_source and f_blend fit linearly against the model above, per
# instrument; err_scale is the sqrt(chi2/N) that fit leaves.  The muFUN
# files are raw instrumental magnitudes with an arbitrary per-site
# zeropoint, so log_f_total cannot be defaulted.

# A stricter ceiling on every instrument's err_scale than the default 100
# (JDE, 2026-09-25).  Measured 2026-09-25: from these seeds the DE seed
# polish bought +383 nats by inflating err_scale to 36 (OGLE) and 92
# (Bronberg) while dropping the lens companion to ~1e-7 Msun -- a
# point-lens basin the wide ceiling made cheaper than fixing the wings.
# Ten leaves room for the real underestimates here (the OGLE out-of-event
# baseline needs 3.6; the seed-start wing mismatch needs ~7) and takes the
# collapsed basin off the table.  Broadcast to all nine instruments; the
# per-instrument entries below refine the start only.
mulensinstrument.err_scale:
    upper: 10.0
mulensinstrument.OGLE.q_source:
    initval: 0.3510
mulensinstrument.OGLE.log_f_total:
    initval: -6.02866
mulensinstrument.OGLE.err_scale:
    initval: 3.6              # the out-of-event baseline value

mulensinstrument.Bronberg.q_source:
    initval: 0.3738
mulensinstrument.Bronberg.log_f_total:
    initval: -7.35861
mulensinstrument.Bronberg.err_scale:
    initval: 1.03

mulensinstrument.CAO.q_source:
    initval: 0.3566
mulensinstrument.CAO.log_f_total:
    initval: -7.01053
mulensinstrument.CAO.err_scale:
    initval: 1.97

mulensinstrument.CT13_I.q_source:
    initval: 0.3311
mulensinstrument.CT13_I.log_f_total:
    initval: -6.40299
mulensinstrument.CT13_I.err_scale:
    initval: 3.26

mulensinstrument.CT13_V.q_source:
    initval: 0.2250
mulensinstrument.CT13_V.log_f_total:
    initval: -6.03292
mulensinstrument.CT13_V.err_scale:
    initval: 1.0              # only 5 points; the fitted 0.20 is noise

mulensinstrument.FarmCove.q_source:
    initval: 0.2701
mulensinstrument.FarmCove.log_f_total:
    initval: -6.70539
mulensinstrument.FarmCove.err_scale:
    initval: 2.45

mulensinstrument.Kumeu.q_source:
    initval: 0.3162
mulensinstrument.Kumeu.log_f_total:
    initval: -6.76844
mulensinstrument.Kumeu.err_scale:
    initval: 1.39

mulensinstrument.Possum.q_source:
    initval: 0.1709
mulensinstrument.Possum.log_f_total:
    initval: -6.56991
mulensinstrument.Possum.err_scale:
    initval: 3.10

mulensinstrument.VintageLane.q_source:
    initval: 0.1872
mulensinstrument.VintageLane.log_f_total:
    initval: -6.75675
mulensinstrument.VintageLane.err_scale:
    initval: 1.31

# star.Source.radius is left free: with finite_source on, rho is read but
# the radius is not separately identifiable.  Skowron measure theta_* =
# 4.45 +/- 0.40 uas, an ANGLE; imposing it as a radius would feed the
# assumed source distance back in as if it were measured.
