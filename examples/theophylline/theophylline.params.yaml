# Parameter overrides for the Theophylline example.
#
# Deliberately empty: the pharmacokinetics defaults.yaml is wide enough to
# start this fit, and a params file carries published values, not numbers
# read off an earlier run of the same fit.  What you WOULD put here, and
# which entries reach the sampler, is in README.md ("The parameter file"):
#
#   subject.S1.log_cl: {initval: 0.45}          # a start value
#   subject.S1.cl:     {mu: 2.8, sigma: 0.5}    # a prior, in L/hr
#   subject.log_ka:    {lower: -1.0}            # tighten a bound (all subjects)
