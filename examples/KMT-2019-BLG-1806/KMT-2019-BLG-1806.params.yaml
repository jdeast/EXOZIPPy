# KMT-2019-BLG-1806 / OGLE-2019-BLG-1250, Zang et al. 2023, AJ 165, 103
# (arXiv:2210.12344).
#
# The event starts are Zang+2023 Table 4, the "Outer" u_0 > 0 solution
# (chi2 3132.2/3132): t_0, u_0, t_E, s, log q, alpha and pi_E, as printed
# except alpha (converted below).  rho is an upper limit there (< 1.9e-3)
# and is not seeded.  The coordinates, zeropoints and source extinction
# are from the same paper and cited where they appear below.
#
# Only initvals are used: published uncertainties are not mapped to sigma
# (a Gaussian prior would double-count the data), and whitening scales are
# measured from the data by EXOZIPPy at startup.

source.Source.t_0:
    initval: 2458715.453      # HJD' 8715.453

source.Source.u_0:
    initval: 0.0257

# t_E and pi_E are derived from the masses, distances and proper motions;
# these seeds are delivered through them.
mulensevent.t_E:
    initval: 134.1            # d
mulensevent.pi_E_N:
    initval: -0.060
mulensevent.pi_E_E:
    initval: -0.057

lens.Companion.s:
    initval: 1.0339

# alpha: Zang+2023's alpha = ours - 180 deg, u_0 kept: their Outer
# 2.151 rad = 123.243 deg -> 303.243 = -56.757 deg here.
lens.Companion.alpha:
    initval: -56.757

# rho (an upper limit in Zang+2023) is not seeded: it derives from the
# source radius, which the source-flux seed supplies.

# q = M_companion / M_primary.
lens.Companion.q:
    initval: 1.9187e-05       # = 10**-4.717

# Zang et al. 2023, AJ 165, 103 (arXiv:2210.12344), Table 1:
# RA, Dec (J2000) = 18:02:09.01, -29:24:53.60; (l, b) = (+1.41, -3.35).
star.Lens.ra:
    initval: 270.53754
    sigma: 0
star.Lens.dec:
    initval: -29.41489
    sigma: 0
star.Source.ra:
    initval: 270.53754
    sigma: 0
star.Source.dec:
    initval: -29.41489
    sigma: 0

# No spectrum: hold the source metallicity at its default.
star.Source.feh:
    sigma: 0.0
planet.Companion.radius:
    sigma: 0

# Zang et al. 2023, AJ 165, 103 (arXiv:2210.12344), Sec. 3 and Table 10:
# KMT I magnitudes calibrated to standard I with the OGLE-III catalog
# (Szymanski et al. 2011), so flux = 10**(-0.4 I) (zeropoint 0);
# I_S = 21.35 +/- 0.07.
mulensinstrument.KMTC04.zeropoint: {mu: 0.0, sigma: 0.07}
mulensinstrument.KMTS04.zeropoint: {mu: 0.0, sigma: 0.07}
mulensinstrument.KMTA04.zeropoint: {mu: 0.0, sigma: 0.07}

# Zang et al. 2023, Table 10: A_I = I_cl - I_cl,0 = 15.79 - 14.39 = 1.40,
# which is A_V = 2.25 through this fit's own Cousins-I BC grid. The source
# teff/radius/mass start is seeded from its measured flux at this extinction
# (I_S = 21.35, (V-I)_S,0 = 0.76, theta_* = 0.345 uas in the same table).
star.Source.av:
    initval: 2.25
