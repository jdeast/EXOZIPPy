# Seeded from MMEXOFAST solution 0 (0-indexed)
# Source: examples/DC2018_128/mmexofast.json
# n_solutions in file: 2
#
# Only initvals are used: MMEXOFAST uncertainties are not mapped to
# sigma (a Gaussian prior would double-count the data), and whitening
# scales are measured from the data by EXOZIPPy at startup.

source.Source.t_0:
    initval: 2458715.481879152 

source.Source.u_0:
    initval: 0.029253113064634916

# t_E is derived in EXOZIPPy from stellar masses/distances/proper motions.
# Provided here as an initval hint to seed the relaxation engine.
mulensevent.t_E:
    initval: 118.21545915658051

lens.Companion.s:
    initval: 1.046765512297066

# alpha: relaxation engine propagates the initval to xalpha/yalpha.
lens.Companion.alpha:
    initval: 57.02894037839297

# rho is not seeded: it is derived from the source radius below, which is
# what this file pins.

# q = M_companion / M_primary.  EXOZIPPy's relaxation engine propagates
# this through the symbolic relation  q * M_primary = M_companion
# to set the companion's mass initval automatically.
lens.Companion.q:
    initval: 2.5493624633395966e-05

star.Lens.ra:
    initval: 266.62325
    sigma: 0
star.Lens.dec:
    initval: -24.27227
    sigma: 0
star.Source.ra:
    initval: 266.62325
    sigma: 0
star.Source.dec:
    initval: -24.27227
    sigma: 0

# these shouldn't be fit for such models (on the to do list)
# but as a temporary hack, we're just going to fix them at their arbitrary starting values
star.Lens.radius:
    sigma: 0.0
star.Lens.teff:
    sigma: 0.0
star.Lens.feh:
    sigma: 0.0
star.Source.feh:
    sigma: 0.0
planet.Companion.radius:
    sigma: 0

# The Source's radius and teff are free.  No zeropoint prior is stated
# here, so the sed: block does NOT tie the source to the light curves'
# baseline flux (review 2.2.21: the tie is the user's to state, as
# mulensinstrument.<name>.zeropoint: {mu, sigma}); the absolute flux scale
# would come from that prior, not the data.  Seeded near a bulge turnoff
# star, which is what I_source ~ 18.9 at ~8 kpc implies.
star.Source.radius:
    initval: 1.2
star.Source.teff:
    initval: 5800
