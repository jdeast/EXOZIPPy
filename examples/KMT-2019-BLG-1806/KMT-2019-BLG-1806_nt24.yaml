run:
  name: "KMT-2019-BLG-1806"

prefix: "fitresults/KMT-2019-BLG-1806_nt24"

# Binary lens + finite source (2L1S).
# MMEXOFAST solution: t_E~118d, s~1.05, q~2.5e-5, alpha~57 deg
#
# system architecture:
#   star.Lens        = primary lens host    (lens body 0)
#   planet.Companion = secondary lens body  (lens body 1)
#   star.Source      = background source

star:
  - name: "Lens"
  - name: "Source"

planet:
  - name: "Companion"

mulensevent:
  - finite_source: True
    #mag_method: "auto_vbbl"  # default for binary+finite_source
    t0_par: 2458715.481879152         # approximate t_0 from MMEXOFAST
    # As in KMT-2019-BLG-1806.yaml: the shared params file supplies the
    # whole published solution, so MMEXOFAST is not needed.
    mmexofast: false

lens:
  - body: star.Lens
  - body: planet.Companion

source:
  - body: star.Source

galacticmodel:
  - name: "KMT-2019-BLG-1806"
    anchor_idx: 1              # anchor on the source (star.Source)

band:
  - name: "I"
    filter: "Generic/Cousins.I"
    ld_law: "linear"

# SED block: even with no catalog photometry (see the .sed file), this
# activates the source flux constraint -- each light curve's calibrated
# baseline f_source is tied to the SED-predicted source I mag through a
# per-lightcurve zeropoint (default prior 0 +/- 0.2 mag).
sed:
  file: "KMT-2019-BLG-1806.sed.yaml"

mulensinstrument:
  - name: "KMTC04" #telescope name
    file: "n20260624.I.KMTC04.pys"
    band: "I"

  - name: "KMTS04" #telescope name
    file: "n20260624.I.KMTS04.pys"
    band: "I"

  - name: "KMTA04" #telescope name
    file: "n20260624.I.KMTA04.pys"
    band: "I"

parameter_file: "KMT-2019-BLG-1806.params.yaml"

sampler:
  method: ptde_async      # Differential Evolution + Parallel Tempering (async worker pool)
  n_temps: 24          # was 8; ladder-vs-length test (2026-08-11)
  T_max: 200           # hottest temperature (EXOFASTv2 parity)
  # n_chains: defaults to 2 × n_params
  # cores: defaults to 75% of physical cores
  tune: 350
  draws: 50000         # was 650; match ob140939 for a like-for-like N_eff
  nthin: 1
  recompute_trace: True
