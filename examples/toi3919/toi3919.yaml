# TOI-3919: a 7.43-day eccentric giant planet (TESS + ground-based transits,
# TRES radial velocities) whose RVs also carry a LINEAR TREND -- the first
# shipped example of a Taylor orbit.  The trend is orbit 'trend' below,
# `type: linear`, with the star as its primary and no companion named: the
# reflex of a body too long-period to resolve, fitted as orbit.trend.gammadot
# (m/s/day) about the midpoint of the RVs.  See README.md.
#
# Generated by exozippy-exofast2exozippy from fittoi3919.pro
# (`--priorfile toi3919.priors.final`; see README.md), then the R band's
# filter was written out and the prefix set.
#
# Conversion warnings (features of the EXOFASTv2 fit that did not translate):
#   - the EXOFASTv2 fit used Claret limb-darkening priors; the LD table prior
#     is not implemented yet, so the limb darkening is constrained by the
#     transit data alone
#   - prior 'dilute' dropped: explicit dilution priors are not implemented
#     (EXOZIPPy dilutes transits automatically from the SED flux fractions)
#   - 'fitdilute' not translated: explicit dilution fitting is not implemented
#     (EXOZIPPy dilutes transits automatically from the SED when several stars
#     are modeled)

run:
  name: "toi3919"

prefix: "fitresults/toi3919"
logger_level: INFO   # DEBUG, INFO, or WARNING

star:
  - name: "A"
    mist: True

# MIST tracks interpolated at (logmass, initfeh, eep); each
# constrained quantity gets a Gaussian potential toward the
# track value with EXOFASTv2's systematic floor as sigma.
evolutionarymodel:
  - star: "A"
    constrain: [feh, radius, teff, age]

sed:
  file: "toi3919.sed.yaml"

planet:
  - name: "b"

orbit:
  - name: "b"
    primary: ["A"]
    companion: ["b"]
  # EXOFASTv2's /fitslope: the reflex of a companion too long-period
  # to resolve, as a Taylor orbit: orbit.trend.gammadot is the RV slope
  - name: "trend"
    type: linear
    primary: ["A"]

transit:
  - name: "TESS_UT20190912"
    file: "n20190912.TESS.TESS.TOI-3919SlimFlat.S16.1800sunbinned.dat"
    band: "TESS"
    exptime: 30 # minutes
    ninterp: 10
  - name: "TESS_UT20200319"
    file: "n20200319.TESS.TESS.TOI-3919SlimFlat.S23.1800sunbinned.dat"
    band: "TESS"
    exptime: 30 # minutes
    ninterp: 10
  - name: "CALOU-0m4_UT20220114"
    file: "n20220114.R.CALOU-0m4.TOI-3919.dat"
    band: "R"
    exptime: 1 # minutes
    ninterp: 1
  - name: "TESS_UT20220226"
    file: "n20220226.TESS.TESS.TOI-3919SlimFlat.S49.120sunbinned.dat"
    band: "TESS"
    exptime: 2 # minutes
    ninterp: 1
  - name: "TESS_UT20220326"
    file: "n20220326.TESS.TESS.TOI-3919SlimFlat.S50.120sunbinned.dat"
    band: "TESS"
    exptime: 2 # minutes
    ninterp: 1
  - name: "KeplerCam_UT20220428"
    file: "n20220428.Sloani.KeplerCam.TOI-3919.dat"
    band: "Sloani"
    exptime: 1 # minutes
    ninterp: 1
  - name: "WCO_UT20220428"
    file: "n20220428.Sloanr.WCO.TOI-3919.dat"
    band: "Sloanr"
    exptime: 1 # minutes
    ninterp: 1
  - name: "LCO-McD-1m0_UT20230306"
    file: "n20230306.Sloani.LCO-McD-1m0.TOI-3919.dat"
    band: "Sloani"
    exptime: 1 # minutes
    ninterp: 1

band:
  - name: "R"
    filter: "Generic/Cousins.R"   # EXOFASTv2's R; a bare 'R' is ambiguous
  - name: "Sloani"
    filter: "Sloani"
  - name: "Sloanr"
    filter: "Sloanr"
  - name: "TESS"
    filter: "TESS"

rvinstrument:
  - name: "TRES"
    file: "toi3919.TRES.rv"

parameter_file: "toi3919.params.yaml"

# Sampling controls are deliberately NOT translated from EXOFASTv2
# (maxsteps/nthin/ntemps are DE-MCMC knobs); this block follows EXOZIPPy's
# HMC best practices instead.
sampler:
  method: numpyro      # nuts, numpyro, blackjax, nutpie, ptde, ptde_async
  tune: 2000
  draws: 4000
  target_accept: 0.95
  recompute_trace: True   # if False and a prefix.nc file exists, load it instead of re-sampling
