run:
  name: "KMT-2021-BLG-1122L"

prefix: "fitresults/KMT-2021-BLG-1122L"

# KMT-2021-BLG-1122L: the first microlensing TRIPLE STELLAR system
# (Han et al. 2023, A&A 672, A8; arXiv:2302.05613).  3L1S: a 0.47 Msun
# primary with two M-dwarf companions near its Einstein ring, finite
# source.  This is the triple-lens validation vehicle (review 7.6.4).  q is
# DERIVED from the per-body masses at runtime; the engine has one relation
# set per companion (mulensing.md, "Three or more lens bodies").
#
# system architecture:
#   star.Lens    = M1, the primary lens         (lens body 0)
#   star.LensB   = M2, companion at (s2, alpha)  (lens body 1)
#   star.LensC   = M3, companion at (s3, psi)    (lens body 2)
#   star.Source  = the background source (a K subgiant, Sect. 4)

star:
  - name: "Lens"
  - name: "LensB"
  - name: "LensC"
  - name: "Source"

mulensevent:
  - finite_source: True
    t0_par: 2459370.226          # Table 2 t_0 (HJD' 9370.226 + 2450000)
    # The params file supplies the whole published solution, so the peak
    # finder has nothing to seed and does not run.

lens:
  - body: star.Lens
  - body: star.LensB
  - body: star.LensC

source:
  - body: star.Source

# The companions are bound to the primary and do not move (no orbital
# motion is fit): a `type: static` orbit per companion, primary <-> that
# companion, as every lens companion's orbit is.  The pairing ties each
# companion's distance, proper motion, rv and av to the primary's
# (components/orbit/orbit.md, "type: static"), so the system has one
# position and one space velocity and the companions add no kinematic
# term.  The lens entries name no orbit: a companion that does not move
# carries no `orbit:`.
orbit:
  - name: "LB"
    type: static
    primary: [Lens]
    companion: [LensB]
  - name: "LC"
    type: static
    primary: [Lens]
    companion: [LensC]

galacticmodel:
  - name: "KMT-2021-BLG-1122L"
    anchor_idx: 3              # anchor on the source (star.Source)

band:
  - name: "I"
    filter: "Generic/Cousins.I"
    ld_law: "linear"
  - name: "V"
    filter: "Generic/Bessell.V"
    ld_law: "linear"

# No catalog photometry: the empty-filter SED block ties each light curve's
# source flux to the SED-predicted source magnitude in its band through the
# per-lightcurve zeropoint prior in the params file.  With I AND V curves the
# tie measures the source's colour, which with the A_V prior (params file)
# fixes theta_*, and with it theta_E = theta_*/rho.  I alone left theta_*
# free and the first acceptance fit's distances drifted to ~100 pc.
sed:
  file: "KMT-2021-BLG-1122L.sed.yaml"

# KMTNet pySIS light curves (field BLG14), read as NATIVE DIFFERENCE FLUX
# (prepare_data.py).  pySIS's mag column is referenced to a fixed 20.0 mag
# (flux 1584.9 at zp 28) at every site, not to this star's baseline, so a
# magnitude file has a fictitious total flux and the q_source <= 2 bound is
# applied against it.  Here each instrument instead gets an explicit
# reference_mag well above any epoch's flux (I 16.0, V 19.0 at zp 28): the
# reference only shifts f_blend, which nothing reads (sed_constrains_blend
# is off), while f_source -- the brightening's amplitude, which the SED tie
# reads -- does not depend on it.  Han+2023 fit the three I curves; the V
# curves (26/114/50 points) add the source colour.
mulensinstrument:
  - name: "KMTC14"
    file: "n20210603.I.KMTC14.dia"
    data_format: dia
    reference_mag: 16.0
    band: "I"
    magsys: Vega   # pySIS instrumental, zp 28 (see the zeropoint prior)

  - name: "KMTS14"
    file: "n20210603.I.KMTS14.dia"
    data_format: dia
    reference_mag: 16.0
    band: "I"
    magsys: Vega

  - name: "KMTA14"
    file: "n20210603.I.KMTA14.dia"
    data_format: dia
    reference_mag: 16.0
    band: "I"
    magsys: Vega

  - name: "KMTC14V"
    file: "n20210603.V.KMTC14.dia"
    data_format: dia
    reference_mag: 19.0
    band: "V"
    magsys: Vega

  - name: "KMTS14V"
    file: "n20210603.V.KMTS14.dia"
    data_format: dia
    reference_mag: 19.0
    band: "V"
    magsys: Vega

  - name: "KMTA14V"
    file: "n20210603.V.KMTA14.dia"
    data_format: dia
    reference_mag: 19.0
    band: "V"
    magsys: Vega

parameter_file: "KMT-2021-BLG-1122L.params.yaml"

sampler:
  method: ptde          # synchronous PTDE (#376); the triple-lens VBM Op has no gradient.  Not ptde_async.
  n_temps: auto
  T_max: 200
  tune: 5000
  draws: 20000
  nthin: 1
  recompute_trace: True
  # 60 s, not 10: with VBMicrolensing 5.6.1 a few three-body calls at
  # s < 0.2 or > 3 still take minutes (fixed by valboz/VBMicrolensing#75,
  # unreleased; run under a venv carrying it, see the README).
  eval_timeout: 60
  store_hot_chains: True
  # The DE seed polish has NO eval_timeout (run.md), so one slow kernel
  # call stalls it (review 2.6.35): off.
  seed_polish: false
  # Every rung starts at the T=1 dispersion: the start population is scored
  # serially with no timeout (review 2.6.36), and the auto 3*sqrt(T) took an
  # hour per hot rung.  The hot rungs disperse during tuning anyway.
  start_dispersion: 3.0
