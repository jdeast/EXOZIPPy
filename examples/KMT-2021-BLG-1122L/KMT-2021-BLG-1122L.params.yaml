# KMT-2021-BLG-1122L, Han et al. 2023, A&A 672, A8 (arXiv:2302.05613),
# Table 2 of arXiv v1, the best-fit 3L1S solution (README, "Table of
# record").  Only initvals are used for the trajectory.
#
# Mapping onto EXOZIPPy (README): alpha = -alpha_Han, alpha_3 = alpha_2 -
# psi, u_0 as published; s, q, t_E and rho as published.  t_0 and u_0 are
# translated from Han's M1-M2 effective-position origin to the center of
# mass of all three bodies (conventions.md C13): +4.37 d and +0.012.
source.Source.t_0:
    initval: 2459374.592

source.Source.u_0:
    initval: 0.138

# t_E is derived: the leaves are seeded so theta_E = 0.50 mas and |mu_rel|
# = 12.39 mas/yr give t_E = 14.74 d (README).  No parallax, so the lens pm
# is placed 12.39 mas/yr east of a bulge-typical source pm.
star.Source.pm_ra:
    initval: -3.0
star.Source.pm_dec:
    initval: -5.4
star.Lens.pm_ra:
    initval: 9.39
star.Lens.pm_dec:
    initval: -5.4
# The companions are the primary's system: the config's static orbits (LB,
# LC) tie their distance, pm, rv and av to the primary's (orbit.md).

# rho derives from the source radius: theta_* = 1.26 uas at 8.68 kpc.
star.Source.radius:
    initval: 2.35

# ---- the lens geometry: two companions of the primary ---------------------
# alpha_2 = -131.32 deg = 228.68 deg (Han 2.292 rad); alpha_3 = alpha_2 -
# psi = 149.44 deg.  Separations bounded to s in [0.4, 2.3]: VBM's
# three-body kernel aborts or hangs outside it (README, "Fit").
lens.LensB.s:
    initval: 1.386
    lower: 0.4
    upper: 2.3
lens.LensB.alpha:
    initval: 228.68
# Every companion has its own s and alpha relations (mulensing.md, "Three
# or more lens bodies"; alpha convention conventions.md C15).
lens.LensC.s:
    initval: 1.601
    lower: 0.4
    upper: 2.3
lens.LensC.alpha:
    initval: 149.44

# ---- body masses ------------------------------------------------------------
# M_1 = 0.47 (Bayesian median, Eq. 10), M_2 = 0.526 M_1, M_3 = 0.241 M_1, so
# the derived q's reproduce Table 2.
star.Lens.mass:
    initval: 0.47
star.LensB.mass:
    initval: 0.24722
star.LensC.mass:
    initval: 0.11327

# ---- distances (Sect. 5): D_L = 6.57 kpc (Eq. 13); D_S = 8.68 kpc, inside
# the Fig. 7 posterior, so theta_E = 0.50 mas as published.
star.Lens.distance:
    initval: 6570
star.Source.distance:
    initval: 8680

# Coordinates (J2000) from the KMTNet event page: 17:35:51.10 -28:26:47.22
# ((l, b) = (-0.720, 2.076), Sect. 2).  Pinned on every star.
star.Lens.ra:    {initval: 263.96292, sigma: 0}
star.Lens.dec:   {initval: -28.44645, sigma: 0}
star.LensB.ra:   {initval: 263.96292, sigma: 0}
star.LensB.dec:  {initval: -28.44645, sigma: 0}
star.LensC.ra:   {initval: 263.96292, sigma: 0}
star.LensC.dec:  {initval: -28.44645, sigma: 0}
star.Source.ra:  {initval: 263.96292, sigma: 0}
star.Source.dec: {initval: -28.44645, sigma: 0}

# No spectrum: hold the source metallicity.
star.Source.feh:
    sigma: 0.0

# ---- photometric zeropoints -------------------------------------------
# Not calibrated: pySIS difference flux at the pipeline's fixed zp 28.0, so
# each zeropoint is wide (0.5 mag) and centered on the file's
# reference_mag (I 16.0, V 19.0), not 0 -- a workaround for the SED tie not
# subtracting a dia file's reference offset (README).
mulensinstrument.KMTC14.zeropoint: {mu: 16.0, sigma: 0.5}
mulensinstrument.KMTS14.zeropoint: {mu: 16.0, sigma: 0.5}
mulensinstrument.KMTA14.zeropoint: {mu: 16.0, sigma: 0.5}
mulensinstrument.KMTC14V.zeropoint: {mu: 19.0, sigma: 0.5}
mulensinstrument.KMTS14V.zeropoint: {mu: 19.0, sigma: 0.5}
mulensinstrument.KMTA14V.zeropoint: {mu: 19.0, sigma: 0.5}

# q_source and err_scale STARTS from the convention scan's optimum
# (README).  The flux bootstrap cannot run on a 3-body lens.
mulensinstrument.KMTC14.q_source: {initval: 0.0104}
mulensinstrument.KMTS14.q_source: {initval: 0.0122}
mulensinstrument.KMTA14.q_source: {initval: 0.0109}
mulensinstrument.KMTC14V.q_source: {initval: 0.0111}
mulensinstrument.KMTS14V.q_source: {initval: 0.0109}
mulensinstrument.KMTA14V.q_source: {initval: 0.0098}
mulensinstrument.KMTC14.err_scale: {initval: 1.49}
mulensinstrument.KMTS14.err_scale: {initval: 1.82}
mulensinstrument.KMTA14.err_scale: {initval: 2.31}
mulensinstrument.KMTC14V.err_scale: {initval: 1.36}
mulensinstrument.KMTS14V.err_scale: {initval: 1.88}
mulensinstrument.KMTA14V.err_scale: {initval: 2.05}

# Han+2023 Sect. 4: A_I = 3.3 -> A_V ~ 5.3 through this fit's Cousins-I BC
# grid.  A prior: a color alone cannot break the reddening degeneracy
# (README).
star.Source.av:
    initval: 5.3
    mu: 5.3
    sigma: 0.3
