# Seeded from MMEXOFAST solution(s) [0, 1] (0-indexed)
# Source: examples/DC2018_128/mmexofast.json
# n_solutions in file: 2
#
# Only initvals are used: MMEXOFAST uncertainties are not mapped to
# sigma (a Gaussian prior would double-count the data), and whitening
# scales are measured from the data by EXOZIPPy at startup.
#
# initval is list-valued: one mutually-consistent start point per
# solution above (P4 multi-seed sampling -- see config.py's
# finalize_user_params). Bounds are NOT per-seed and
# always come from the first (seed 0) solution.

lens.Lens.t_0:
    initval: [2458554.89424795, 2458554.87715006]

lens.Lens.u_0:
    initval: [0.14297468, 0.13554066]

# t_E is derived in EXOZIPPy from stellar masses/distances/proper motions.
# Provided here as an initval hint to seed the relaxation engine.
lens.Lens.t_E:
    initval: [18.17037538, 18.70647736]

lens.Lens.s:
    initval: [0.97875222, 0.85373431]

# alpha: relaxation engine propagates the initval to xalpha/yalpha.
lens.Lens.alpha:
    initval: [-52.15111098, -51.34370652]

lens.Lens.rho:
    initval: [5.38363705e-03, 1.83885815e-07]

# q = M_companion / M_primary.  EXOZIPPy's relaxation engine propagates
# this through the symbolic relation  q * M_primary = M_companion
# to set the companion's mass initval automatically.
lens.Lens.q:
    initval: [1.10576828e-03, 1.06999723e-03]

star.Lens.ra:
    initval: 267.595
    sigma: 0
star.Lens.dec:
    initval: -28.982
    sigma: 0
star.Source.ra:
    initval: 267.595
    sigma: 0
star.Source.dec:
    initval: -28.982
    sigma: 0

# these shouldn't be fit for such models (on the to do list)
# but as a temporary hack, we're just going to fix them at their arbitrary starting values
star.Lens.radius:
    sigma: 0.0
star.Lens.teff:
    sigma: 0.0
star.Lens.feh:
    sigma: 0.0
star.Source.teff:
    sigma: 0.0
star.Source.feh:
    sigma: 0.0
planet.Companion.radius:
