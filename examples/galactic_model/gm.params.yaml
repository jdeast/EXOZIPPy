# A single bulge star under the galactic-model prior alone.

# Sky position: RA 17:47:29.42, Dec -34:43:35.6 (the PSPL example's).
star.BulgeTarget.ra:
  initval: 266.87258
  sigma: 0.0
star.BulgeTarget.dec:
  initval: -34.72656
  sigma: 0.0

# Free, so the prior finds its own equilibrium.
star.BulgeTarget.mass:
  initval: 0.5
star.BulgeTarget.distance:
  initval: 8000.0
  lower: 1
  upper: 20000
# Distance and proper motion share a strong curved degeneracy; bounds
# tighter than the very wide defaults are not necessary but help efficiency.
star.BulgeTarget.pm_ra:
  initval: -3.0
  lower: -100
  upper: 100
star.BulgeTarget.pm_dec:
  initval: -3.0
  lower: -100
  upper: 100
star.BulgeTarget.rv:
  initval: -20000.0

# Nothing reads these with only a galactic model in the topology, so they
# are not parameters of this configuration; the values are starts only.
star.BulgeTarget.radius:
  initval: 1.0
star.BulgeTarget.teff:
  initval: 5778
star.BulgeTarget.feh:
  initval: 0
