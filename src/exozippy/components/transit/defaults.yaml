transit:
  baseline:
    lower: -1000000.0
    upper: 1000000.0
    # Unity relative flux: the out-of-transit level of a normalized light
    # curve.  This is the RANK_DEFAULT (20) floor of the provenance stack --
    # Transit._hint_baseline pushes each file's median flux over it at
    # RANK_DERIVED_DATA (60), and a user's own `transit.<name>.baseline`
    # outranks both at RANK_USER (100).  It is what a fit resolves to when
    # there is no data to measure a median from (the same 1.0 load_data seeds
    # baseline_init with), and it is also what makes the "pinned with no
    # value" check in Parameter.build_pymc an invariant rather than a rule
    # with exceptions.  `baseline` appears in no RELATION, so it cannot
    # change any other parameter's provenance either.
    initval: 1.0
    init_scale: 0.01
    unit: ""
    internal_unit: ""
    latex: "F_0"
    description: "Relative flux baseline"
  jitter_variance:
    lower: -1000.0
    upper: 100000.0
    initval: 0.0
    init_scale: 0.000001
    unit: ""
    internal_unit: ""
    # Signed: it may go negative down to Instrument._jitter_floor, so neither
    # the label nor the description may promise a square. See calc_jitter.
    latex: "J|J|"
    description: "Photometric jitter variance"
  jitter:
    unit: ""
    internal_unit: ""
    # Not \sigma_J: this is signed, and a sigma promises positivity.
    latex: "J"
    description: "Photometric jitter"
    expressions:
      default:
        func_name: "calc_jitter"
        deps: [ "jitter_variance" ]
  # Limb darkening lives on the Band component (band: reference per
  # instrument); see components/band/defaults.yaml.
  # Optional GP amplitudes, in relative flux (the light curve is normalized to
  # ~1, so an amplitude above 1 is not physical).  The rest of the GP
  # blueprint is in components/defaults.yaml.
  gp_rot_sigma:
    lower: 0.0
    upper: 1.0
    initval: 0.001
    init_scale: 0.001
    unit: ""
    internal_unit: ""
  gp_sho_sigma:
    lower: 0.0
    upper: 1.0
    initval: 0.001
    init_scale: 0.001
    unit: ""
    internal_unit: ""
  # Optional hogg-mixture outlier scatter, in relative flux (the rest of the
  # robust-likelihood blueprint lives in components/defaults.yaml).
  out_scale:
    lower: 0.0
    upper: 1.0
    initval: 0.01
    init_scale: 0.005
    unit: ""
    internal_unit: ""
  detrend_coeffs:
    # THE RULE (review 3.14.10): the design matrix is WHITENED at ingestion
    # (Instrument._build_block_detrend), so it is dimensionless, and the
    # coefficient therefore carries the units of WHATEVER THE DOT PRODUCT
    # FEEDS -- per unit of the raw column, which no unit system can name.
    # Here `lc_model += pt.dot(detrend, detrend_coeffs)` and lc_model is
    # NORMALIZED FLUX, so "" is correct rather than merely unfilled: this
    # coefficient really is dimensionless.  Audited and left alone in
    # 2026-08; rvinstrument's identical-looking ""/"" was NOT correct (its
    # model is in the internal solRad/d and it now reports m/s), and
    # mulensinstrument's is in MAGNITUDES because its coefficient sits
    # inside 10**(-0.4*...) even though that component models flux.
    initval: 0.0
    init_scale: 1.0
    lower: -1.0e6
    upper: 1.0e6
    unit: ""
    internal_unit: ""
    latex: "c"
    description: "Detrending Coefficients"