transit:
  baseline:
    lower: -1000000.0
    upper: 1000000.0
    # Unity relative flux: the out-of-transit level of a normalized light
    # curve.  Inert in any real fit -- Transit.register_parameters puts the
    # per-file median flux in the manifest as a plain option, which
    # add_parameter layers OVER the resolved config (`{**cfg, **options}`),
    # and its own fallback for a file it never read is this same 1.0.  It is
    # here so that every sampled parameter carries an initval from somewhere,
    # which is what makes the "pinned with no value" check in
    # Parameter.build_pymc an invariant rather than a rule with exceptions.
    # `baseline` appears in no RELATION, so this cannot change any other
    # parameter's provenance either.
    initval: 1.0
    init_scale: 0.01
    unit: ""
    internal_unit: ""
    latex: "F_0"
    description: "Relative flux baseline"
  jitter_variance:
    lower: -1000.0
    upper: 100000.0
    initval: 0.0
    init_scale: 0.000001
    unit: ""
    internal_unit: ""
    # Signed: it may go negative down to Instrument._jitter_floor, so neither
    # the label nor the description may promise a square. See calc_jitter.
    latex: "J|J|"
    description: "Photometric jitter variance (signed), added to the quoted squared errors"
  jitter:
    unit: ""
    internal_unit: ""
    # Not \sigma_J: this is signed, and a sigma promises positivity.
    latex: "J"
    description: "Photometric jitter (signed): its magnitude adds in quadrature to the quoted errors, and a negative value means they are overestimated"
    expressions:
      default:
        func_name: "calc_jitter"
        deps: [ "jitter_variance" ]
  # Limb darkening lives on the Band component (band: reference per
  # instrument); see components/band/defaults.yaml.
  # Optional GP amplitudes, in relative flux (the light curve is normalized to
  # ~1, so an amplitude above 1 is not physical).  The rest of the GP
  # blueprint is in components/defaults.yaml.
  gp_rot_sigma:
    lower: 0.0
    upper: 1.0
    initval: 0.001
    init_scale: 0.001
    unit: ""
    internal_unit: ""
  gp_sho_sigma:
    lower: 0.0
    upper: 1.0
    initval: 0.001
    init_scale: 0.001
    unit: ""
    internal_unit: ""
  # Optional hogg-mixture outlier scatter, in relative flux (the rest of the
  # robust-likelihood blueprint lives in components/defaults.yaml).
  out_scale:
    lower: 0.0
    upper: 1.0
    initval: 0.01
    init_scale: 0.005
    unit: ""
    internal_unit: ""
  detrend_coeffs:
    initval: 0.0
    init_scale: 1.0
    lower: -1.0e6
    upper: 1.0e6
    unit: ""
    internal_unit: ""
    latex: "c"
    description: "Detrending Coefficients"