# Root-level defaults shared by every instrument component.
#
# ConfigManager.resolve() layers `base_defaults[<param>]` (this file) under
# `base_defaults[<component>][<param>]`, so these are the generic blueprints
# for the optional celerite2 Gaussian-process noise terms (see components/gp.py
# and the `gp:` key on any instrument data file) and for the optional robust
# observation likelihoods (see components/likelihood.py and the `likelihood:`
# key).  Each instrument overrides only what is genuinely instrument-specific
# in its own defaults.yaml -- in practice just the scale-carrying parameters'
# unit and bounds, since "GP amplitude" or "outlier scatter" means m/s for
# RVs, relative flux for a light curve, and magnitudes for a microlensing
# curve.
#
# Only files with the corresponding key register these at all; a fit with
# neither has zero extra parameters.  Elements of an instrument that did not
# opt in are pinned fixed (sigma: 0) by Instrument._register_gp /
# _register_robust and never sampled.

# --- RotationTerm: two SHO modes at P and P/2 (stellar rotation) -------------

gp_rot_sigma:
  # Amplitude (standard deviation) of the rotation kernel.  Overridden per
  # component with the data's own unit; the initval and init_scale here are
  # superseded by a data-driven hint (scatter of the observations) whenever
  # the component supplies one.
  lower: 0.0
  upper: 1.0e6
  initval: 1.0
  init_scale: 0.5
  unit: ""
  internal_unit: ""
  latex: "\\sigma_{\\rm GP,rot}"
  description: "GP rotation-term amplitude"

gp_rot_period:
  # The rotation period itself.  Sampled linearly, in days, so a literature
  # prior can be written as-is: {mu: 22.56, sigma: 0.29}.
  lower: 0.05
  upper: 10000.0
  initval: 10.0
  init_scale: 0.5
  unit: "d"
  internal_unit: "d"
  latex: "P_{\\rm GP,rot}"
  description: "GP rotation-term period"

gp_rot_log_q0:
  # log10 of the quality factor of the secondary (P/2) oscillation.  Sampled
  # in the log because Q spans decades; the linear Q0 is reported as a
  # Deterministic by Instrument.  Range 0.1 -- 1e4.
  lower: -1.0
  upper: 4.0
  initval: 0.3
  init_scale: 0.2
  unit: ""
  internal_unit: ""
  latex: "\\log{Q_{0,\\rm GP}}"
  description: "log10 GP rotation-term secondary quality factor"

gp_rot_log_dq:
  # log10 of the difference between the primary and secondary quality factors.
  lower: -1.0
  upper: 4.0
  initval: 0.0
  init_scale: 0.2
  unit: ""
  internal_unit: ""
  latex: "\\log{\\Delta Q_{\\rm GP}}"
  description: "log10 GP rotation-term quality-factor difference"

gp_rot_f:
  # Fractional amplitude of the secondary (P/2) mode relative to the primary.
  lower: 0.01
  upper: 1.0
  initval: 0.5
  init_scale: 0.1
  unit: ""
  internal_unit: ""
  latex: "f_{\\rm GP}"
  description: "GP rotation-term secondary-mode amplitude fraction"

# --- SHOTerm: one damped oscillator (granulation, generic red noise) ---------

gp_sho_sigma:
  lower: 0.0
  upper: 1.0e6
  initval: 1.0
  init_scale: 0.5
  unit: ""
  internal_unit: ""
  latex: "\\sigma_{\\rm GP,SHO}"
  description: "GP SHO-term amplitude"

gp_sho_rho:
  # Undamped period of the oscillator, in days.
  lower: 0.05
  upper: 10000.0
  initval: 10.0
  init_scale: 0.5
  unit: "d"
  internal_unit: "d"
  latex: "\\rho_{\\rm GP}"
  description: "GP SHO-term undamped period"

gp_sho_log_q:
  # log10 of the oscillator quality factor.  The default start is Q = 1/3
  # (log10 = -0.4771), the standard overdamped granulation choice.  Note the
  # kernel switches formula at Q = 0.5; see components/gp.py.
  lower: -1.0
  upper: 4.0
  initval: -0.4771
  init_scale: 0.2
  unit: ""
  internal_unit: ""
  latex: "\\log{Q_{\\rm GP}}"
  description: "log10 GP SHO-term quality factor"

# --- Robust observation likelihoods (`likelihood:` on any data file) ---------

out_frac:
  # Outlier fraction of the hogg mixture (Hogg, Bovy & Lang 2010): each point
  # is background with this probability.  Capped at 0.5 -- above one half the
  # "outlier" population is the majority and the components swap roles.
  lower: 0.0
  upper: 0.5
  initval: 0.01
  init_scale: 0.05
  unit: ""
  internal_unit: ""
  latex: "P_{\\rm out}"
  description: "Outlier fraction of the mixture likelihood"

out_scale:
  # Extra scatter of the background component, added in quadrature to the
  # inlier sigma.  Overridden per component with the data's own unit; the
  # initval and init_scale here are superseded by a data-driven hint
  # (10 x the median error bar) whenever the component supplies one.
  lower: 0.0
  upper: 1.0e6
  initval: 1.0
  init_scale: 0.5
  unit: ""
  internal_unit: ""
  latex: "\\sigma_{\\rm out}"
  description: "Outlier extra scatter of the mixture likelihood"

t_log_nu:
  # log10 of the Student-t degrees of freedom.  Sampled in the log because nu
  # spans decades and only its order of magnitude matters; the linear t_nu is
  # reported as a Deterministic by Instrument.  Range 1 -- 1000 (nu ~ 2 is
  # very heavy-tailed; nu >~ 50 is Gaussian for practical purposes), starting
  # at nu = 4.
  lower: 0.0
  upper: 3.0
  initval: 0.602
  init_scale: 0.2
  unit: ""
  internal_unit: ""
  latex: "\\log{\\nu}"
  description: "log10 Student-t likelihood degrees of freedom"
