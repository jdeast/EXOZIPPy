dopptom:
  # Multiplicative error scaling of the per-pixel rms estimated from the DT
  # image (EXOFASTv2 dtscale, sampled per dataset).  The bounds are
  # EXOFASTv2's: exofast_chi2v2.pro rejects dtscale <= 0.01 or > 100
  # (mkss.pro itself only sets the step scale, 100).
  dtscale:
    lower: 0.01
    upper: 100.0
    initval: 1.0
    init_scale: 0.1
    unit: ""
    internal_unit: ""
    latex: "\\sigma_{\\rm DT}"
    description: "Doppler Tomography Error Scaling"
