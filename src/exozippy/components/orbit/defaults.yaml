orbit:
  # --- Always Sampled ---
  logP:
    lower: -2.0
    upper: 13.7
    initval: 1.0
    init_scale: 0.00001
    unit: "dex(d)"
    internal_unit: "dex(d)"
    latex: "\\log{P}"
    description: "log10(Period/day)"
  period:
    unit: "d"
    internal_unit: "d"
    latex: "P"
    description: "Orbital Period"
    debug_print: true
    expressions:
      default:
        func_name: "calc_period"
        deps: [ "logP" ]
  n:
    unit: "1/d"
    internal_unit: "1/d"
    latex: "n"
    description: "Mean Motion"
    expressions:
      default:
        func_name: "calc_n"
        deps: [ "period" ]
  tc:
    lower: 2000000.0
    upper: 3000000.0
    initval: 2460000.0
    init_scale: 0.001
    unit: "d"
    internal_unit: "d"
    latex: "T_C"
    description: "Time of Conjunction"

  # --- Physical scale from the member bodies' masses ---
  m_primary:
    unit: "solMass"
    internal_unit: "solMass"
    latex: "M_{\\rm pri}"
    description: "Primary Group Mass"
    expressions:
      default:
        func_name: "calc_group_mass"
        # deps are overridden per system in Orbit.register_parameters to
        # name only the component types the groups actually reference
        deps: ["star.mass", "planet.mass"]
  m_companion:
    unit: "solMass"
    internal_unit: "solMass"
    latex: "M_{\\rm comp}"
    description: "Companion Group Mass"
    expressions:
      default:
        func_name: "calc_group_mass"
        deps: ["star.mass", "planet.mass"]
  m_total:
    unit: "solMass"
    internal_unit: "solMass"
    latex: "M_{\\rm tot}"
    description: "Total Orbit Mass"
    expressions:
      default:
        func_name: "calc_m_total"
        deps: ["m_primary", "m_companion"]
  a:
    unit: "AU"
    internal_unit: "solRad"
    latex: "a"
    description: "Semi-major Axis"
    expressions:
      default:
        func_name: "calc_arsun"
        deps: ["m_total", "period"]
  K:
    unit: "m/s"
    internal_unit: "solRad/d"
    latex: "K"
    description: "RV Semi-amplitude"
    expressions:
      default:
        func_name: "calc_K"
        deps: ["m_companion", "m_total", "ecc", "a", "sini", "period"]

  # --- Conditionally Sampled or Derived (Geometry Swap) ---
  secosw:
    lower: -1.0
    upper: 1.0
    initval: 0.01
    init_scale: 0.15
    unit: ""
    internal_unit: ""
    latex: "e^{1/2}\\cos{\\omega_*}"
  sesinw:
    lower: -1.0
    upper: 1.0
    initval: 0.01
    init_scale: 0.15
    unit: ""
    internal_unit: ""
    latex: "e^{1/2}\\sin{\\omega_*}"
  # WIP (review 5.11): no orbit manifest declares vcve, so this block is
  # inert.  It is selected by `fitvcve: true`, which raises
  # NotImplementedError in Orbit._reject_wip_parameterizations -- as does a
  # params-file entry naming orbit.<name>.vcve.  See the from_vcve
  # expressions below.
  vcve:
    lower: -10.0  # Adjust based on expected Vc/Ve scaling
    upper: 10.0
    initval: 0.0
    init_scale: 0.1
    unit: ""
    internal_unit: ""
    latex: "V_C/V_E"

  # --- Derived/Switchboard Targets ---
  ecc:
    unit: ""
    internal_unit: ""
    latex: "e"
    description: "Eccentricity"
    expressions:
      default:
        func_name: "calc_ecc"
        deps: ["secosw", "sesinw"]
      # WIP (review 5.11): calc_ecc_from_vcve is UNDEFINED -- nothing
      # registers it, so selecting this expr_key cannot build a node.
      from_vcve:
        func_name: "calc_ecc_from_vcve"
        deps: ["vcve", "omega"]
  omega:
    unit: "deg"
    internal_unit: "rad"
    latex: "\\omega_*"
    description: "Argument of Periastron"
    expressions:
      default:
        func_name: "calc_omega"
        deps: ["secosw", "sesinw"]
      # WIP (review 5.11): calc_omega_from_vcve is UNDEFINED -- nothing
      # registers it, so selecting this expr_key cannot build a node.
      from_vcve:
        func_name: "calc_omega_from_vcve"
        deps: ["cosw", "sinw"]
  xbigomega:
    lower: -100.0
    upper: 100.0
    initval: 1.0
    init_scale: 0.01
    mu: 0.0
    sigma: 1.0
    unit: ""
    internal_unit: ""
    latex: "\\Omega_x"
    description: "x-component of ascending node direction"
  ybigomega:
    lower: -100.0
    upper: 100.0
    initval: 0.0
    init_scale: 0.01
    mu: 0.0
    sigma: 1.0
    unit: ""
    internal_unit: ""
    latex: "\\Omega_y"
    description: "y-component of ascending node direction"
  bigomega:
    unit: "deg"
    internal_unit: "rad"
    latex: "\\Omega"
    description: "Longitude of Ascending Node"
    expressions:
      default:
        func_name: "calc_bigomega"
        deps: [ "xbigomega", "ybigomega" ]
  cosi:
    lower: -1.0
    upper: 1.0
    initval: 0.0000001
    init_scale: 0.01
    unit: ""
    internal_unit: ""
    latex: "\\cos{i}"
    description: "Cosine of Inclination"
    expressions:
      # WIP (review 5.11): calc_cosi_from_b is UNDEFINED, and the deps name
      # an "ar" the orbit does not have (its semi-major axis is "a", in AU;
      # the scaled a/R* is planet.ar).  No manifest selects this expr_key.
      from_b:
        func_name: "calc_cosi_from_b"
        deps: ["b", "ar", "ecc", "omega"]
  # WIP (review 5.11): a dead duplicate of the LIVE planet.b -- the deps
  # name a nonexistent "orbit.ar" (see cosi.from_b above), and no orbit
  # manifest declares b, so this block is inert.  A params-file entry naming
  # orbit.<name>.b raises NotImplementedError in
  # Orbit._reject_wip_parameterizations rather than being dropped; use
  # planet.<name>.b.
  b:
    initval: 0.5
    init_scale: 0.1
    unit: ""
    internal_unit: ""
    latex: "b"
    description: "Impact Parameter"
    expressions:
      default:
        func_name: "calc_b"
        deps: ["cosi", "ar", "ecc", "esinw"]
  inc:
    unit: "deg"
    internal_unit: "rad"
    latex: "i"
    description: "Inclination"
    expressions:
      default:
        func_name: "calc_inc"
        deps: [ "cosi" ]
  sini:
    unit: ""
    internal_unit: ""
    latex: "\\sin{i}"
    expressions:
      default:
        func_name: "calc_sini"
        deps: [ "inc" ]
  sinw:
    unit: ""
    internal_unit: ""
    latex: "\\sin{\\omega_*}"
    expressions:
      default:
        func_name: "calc_sinw"
        deps: [ "omega" ]
  cosw:
    unit: ""
    internal_unit: ""
    latex: "\\cos{\\omega_*}"
    expressions:
      default:
        func_name: "calc_cosw"
        deps: [ "omega" ]
  esinw:
    unit: ""
    internal_unit: ""
    latex: "e\\sin{\\omega_*}"
    expressions:
      default:
        func_name: "calc_esinw"
        deps: [ "ecc", "sesinw" ]
  ecosw:
    unit: ""
    internal_unit: ""
    latex: "e\\cos{\\omega_*}"
    expressions:
      default:
        func_name: "calc_ecosw"
        deps: [ "ecc", "secosw" ]
  tp:
    unit: "d"
    internal_unit: "d"
    latex: "T_P"
    description: "Time of Periastron"
    expressions:
      default:
        func_name: "calc_tp"
        deps: [ "ecc", "sesinw", "secosw", "tc", "n" ]
  # ---- Rossiter-McLaughlin (spin-orbit) parameters ----------------------
  # Declared only when an rvinstrument enables `rm:` (see components/rm.py).
  # Mirrors EXOFASTv2/allesfast and this component's own secosw/sesinw ->
  # ecc/omega idiom: sample the decorrelated pair
  #   svcoslam = sqrt(vsini) cos(lambda),  svsinlam = sqrt(vsini) sin(lambda)
  # (no vsini>0 wall, no lambda wrap), and DERIVE vsini and lam from them.
  svcoslam:
    lower: -500.0
    upper: 500.0
    initval: 70.7
    init_scale: 10.0
    unit: ""
    internal_unit: ""
    latex: "\\sqrt{v\\sin{i_*}}\\cos\\lambda"
    description: "sqrt(vsini) cos(lambda)"
  svsinlam:
    lower: -500.0
    upper: 500.0
    initval: 0.0
    init_scale: 10.0
    unit: ""
    internal_unit: ""
    latex: "\\sqrt{v\\sin{i_*}}\\sin\\lambda"
    description: "sqrt(vsini) sin(lambda)"
  vsini:
    lower: 0.0
    upper: 500000.0
    initval: 5000.0
    init_scale: 1000.0
    unit: "m/s"
    internal_unit: "m/s"
    latex: "v\\sin{i_*}"
    description: "Projected Rotational Velocity"
    expressions:
      from_sv:
        func_name: "calc_vsini_from_sv"
        deps: ["svcoslam", "svsinlam"]
  # Named `lam` because `lambda` is a Python keyword.
  lam:
    # bounds/init_scale are in the DISPLAY unit (deg); ConfigManager converts
    # deg->rad. Keep these in degrees (-180..180): writing radians (-pi..pi)
    # here is read as degrees and collapses the range to +-3.14 deg.
    lower: -180.0
    upper: 180.0
    initval: 0.0
    init_scale: 20.0
    unit: "deg"
    internal_unit: "rad"
    latex: "\\lambda"
    description: "Projected Spin-Orbit Angle"
    expressions:
      from_sv:
        func_name: "calc_lam_from_sv"
        deps: ["svcoslam", "svsinlam"]
