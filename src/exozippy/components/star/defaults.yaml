star:
  logmass:
    # -9.0 dex is 1e-9 solMass, about two Ceres masses.  Absurd for a star --
    # that is the point, and it is NOT a sloppy wide default.  Do not raise it.
    # A planetary-mass microlensing lens must be declared in a 'star' block: a
    # planet PRIMARY is rejected (see Lens._validate_bodies) because a planet
    # body has no distance or proper motion of its own, and
    # galacticmodel.build_likelihood reads system.star only, so a free-floating
    # planet declared as a 'planet' would get neither the galactic density
    # prior nor the kinematic one.  As a star it inherits both correctly; they
    # are mass-independent.  The DEFAULT has to be this low because user bounds
    # may only ever be TIGHTENED -- raise it here and FFP lenses become
    # unmodelable with no user-side recourse.  What makes such a body plausible
    # is the mass PRIOR, not the bound: give that star 'mass_function: ffp'
    # (galacticmodel.ffp_logmass_logp).  Note the deliberate asymmetry --
    # IMF: Salpeter raises this floor to the hydrogen-burning limit because a
    # STELLAR IMF has no claim below it, while the FFP mass function leaves it
    # alone because sub-stellar masses are exactly its domain.
    lower: -9.0
    upper: 2.5
    initval: 0.0
    init_scale: 0.1
    unit: "dex(solMass)"
    internal_unit: "dex(solMass)"
    latex: "\\log{M}"
    description: "Log of Mass"
  mass:
    unit: "solMass"
    internal_unit: "solMass"
    # No lower/upper here on purpose.  mass is DERIVED (mass = 10**logmass),
    # so logmass's [-9.0, 2.5] IS the support and the logit transform of the
    # sampled coordinate enforces it exactly.  Bounds on mass could only act
    # as soft barrier potentials layered on top of that hard bound, and the
    # two disagreed by eight orders of magnitude (0.1-250 vs 1e-9-316
    # solMass), so they added numerical machinery without adding a
    # constraint.  To change the allowed mass range, change logmass.
    init_scale: 0.02
    latex: "M_*"
    description: "Stellar Mass"
    debug_print: true
    expressions:
      default:
        func_name: "calc_mass"
        deps: [ "logmass" ]
  logg:
    unit: "dex(cm/s2)"
    internal_unit: "dex(cm/s2)"
    latex: "\\log{g_*}"
    description: "Surface Gravity"
    expressions:
      default:
        func_name: "calc_logg_from_logmass"
        deps: ["logmass", "radius"]

  distance:
    lower: 0.001
    upper: 100000.0
    initval: 10.0
    init_scale: 0.1
    unit: "pc"
    internal_unit: "pc"
    latex: "D"
    description: "Distance"
  # --- Sampled Parameters ---
  radius:
    lower: 0.1
    upper: 2000.0
    initval: 1.0
    init_scale: 0.02
    unit: "solRad"
    internal_unit: "solRad"
    latex: "R_*"
    description: "Stellar Radius"
  radiussed:
    lower: 0.1
    upper: 2000.0
    initval: 1.0
    init_scale: 0.02
    unit: "solRad"
    internal_unit: "solRad"
    latex: "R_*"
    description: "Stellar Radius"
    table_note: "This value ignores the systematic error and is for reference only"
  teff:
    lower: 1.0
    upper: 500000.0
    initval: 5778.0
    init_scale: 80.0
    unit: "K"
    internal_unit: "K"
    latex: "T_{\\rm eff}"
    description: "Effective Temperature"
  teffsed:
    lower: 1.0
    upper: 500000.0
    initval: 5778.0
    init_scale: 80.0
    unit: "K"
    internal_unit: "K"
    latex: "T_{\\rm eff}"
    description: "Effective Temperature"
    table_note: "This value ignores the systematic error and is for reference only"
  feh:
    lower: -5.0
    upper: 5.0
    initval: 0.0
    init_scale: 0.08
    unit: "dex"
    internal_unit: "dex"
    latex: "[{\\rm Fe/H}]"
    description: "Metallicity"
  age:
    lower: 0.0
    upper: 13.77
    initval: 4.603
    init_scale: 3.0
    unit: "Gyr"
    internal_unit: "Gyr"
    latex: "{\\rm Age}"
    description: "Stellar Age"

  # --- Derived Parameters ---
  density:
    unit: "g/cm3"
    internal_unit: "solMass/solRad3"
    latex: "\\rho_*"
    description: "Stellar Density"
    expressions:
      default:
        func_name: "calc_density"
        deps: ["mass", "radius"]
  # --- Specific Physics ---
  fbol:
    unit: "erg s-1 cm-2"
    internal_unit: "erg s-1 cm-2"
    latex: "F_{Bol}"
    description: "Bolometric Flux"
    expressions:
      default:
        func_name: "calc_fbol"
        deps: ["luminosity", "distance"]
  luminosity:
    unit: "solLum"
    internal_unit: "solLum"
    latex: "L_*"
    description: "Stellar Luminosity"
    expressions:
      default:
        func_name: "calc_luminosity"
        deps: ["radius", "teff"]
  luminositysed:
    unit: "solLum"
    internal_unit: "solLum"
    latex: "L_*"
    description: "Stellar Luminosity"
    expressions:
      default:
        func_name: "calc_luminosity"
        deps: ["radiussed", "teffsed"]
  fbolsed:
    unit: "erg s-1 cm-2"
    internal_unit: "erg s-1 cm-2"
    latex: "F_{Bol}"
    description: "Bolometric Flux"
    expressions:
      default:
        func_name: "calc_fbol"
        deps: ["luminositysed", "distance"]
  av:
    unit: "mag"
    internal_unit: "mag"
    latex: "A_V"
    description: "V-band extinction"
    lower: 0.
    upper: 100.
    init_scale: 0.1
    initval: 0.01
  pm_ra:
    initval: -3.0
    init_scale: 0.05
    lower: -1e5
    upper: 1e5
    rank: 10
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_{\\alpha*}"
    description: "Proper Motion (RA)"
  pm_dec:
    initval: -3.0
    init_scale: 0.05
    lower: -1e5
    upper: 1e5
    rank: 10
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_\\delta"
    description: "Proper Motion (Dec)"
  ra:
    initval: 180.0
    init_scale: 20e-6
    lower: 0.0
    upper: 360.0
    unit: "deg"
    internal_unit: "rad"
    latex: "\\alpha_{ICRS}"
    description: "Right Ascension"
  dec:
    initval: 0.0
    init_scale: 20e-6
    lower: -90
    upper: 90.0
    unit: "deg"
    internal_unit: "rad"
    latex: "\\delta_{ICRS}"
    description: "Declination"
  rv:
    initval: 0.0
    init_scale: 100
    lower: -3e8
    upper: 3e8
    unit: "m/s"
    internal_unit: "m/s"
    latex: "\\gamma_{\\rm abs}"
    description: "Absolute Radial Velocity"
  parallax:
    unit: "mas"
    internal_unit: "mas"
    latex: "\\varpi"
    description: "Parallax"
    expressions:
      default:
        func_name: "calc_parallax"
        deps: [ "distance" ]
  # Rossiter-McLaughlin broadening parameters (m/s), shared across planets.
  # Declared only when an rvinstrument enables `rm:`. vmacro=zeta, vbeta=full
  # Gaussian broadening (Hirano+2011 Eq. 20), vmicro=xi -> Lorentzian gamma.
  # (vsini and the projected obliquity lambda are coupled by the
  # sqrt(vsini)cos/sin(lambda) reparameterization, so they live on `orbit`.)
  vmacro:
    lower: 0.0
    upper: 50000.0
    initval: 4000.0
    init_scale: 1000.0
    unit: "m/s"
    internal_unit: "m/s"
    latex: "\\zeta"
    description: "Macroturbulent Velocity"
  vbeta:
    lower: 0.0
    upper: 50000.0
    initval: 4000.0
    init_scale: 1000.0
    unit: "m/s"
    internal_unit: "m/s"
    latex: "\\beta"
    description: "Gaussian Line Broadening (Hirano+2011 Eq. 20)"
  vmicro:
    lower: 0.0
    upper: 50000.0
    initval: 1000.0
    init_scale: 500.0
    unit: "m/s"
    internal_unit: "m/s"
    latex: "\\xi"
    description: "Microturbulent (Lorentzian) Velocity"
# The apparent/absolute Ks the Mann relations key on live on the mann
# component (mann.appks / mann.absks), which derives them from its own
# non-centered Ks latent rather than sampling them here.
