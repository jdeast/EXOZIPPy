astrometryinstrument:
  jitter_variance:
    lower: -10.0
    upper: 1.0e8
    initval: 0.0
    init_scale: 0.01
    unit: "mas2"
    internal_unit: "mas2"
    # Signed: it may go negative down to Instrument._jitter_floor, so neither
    # the label nor the description may promise a square. See calc_jitter.
    latex: "J|J|"
    description: "Astrometric jitter variance (signed), added to the quoted squared errors"
  jitter:
    unit: "mas"
    internal_unit: "mas"
    # Not \sigma_A: this is signed, and a sigma promises positivity.
    latex: "J"
    description: "Astrometric jitter (signed): its magnitude adds in quadrature to the quoted errors, and a negative value means they are overestimated"
    expressions:
      default:
        func_name: "calc_jitter"
        deps: [ "jitter_variance" ]
  fluxfrac:
    # Fractional flux of the companion(s) in this instrument's band,
    # beta = F_2 / (F_1 + F_2).  The photocenter semimajor axis is
    # a_phot = a_rel * (M_2/M_tot - beta); beta = 0 (default, fixed)
    # corresponds to a dark companion (photocenter = primary).
    lower: 0.0
    upper: 1.0
    initval: 0.0
    init_scale: 0.01
    sigma: 0.0
    unit: ""
    internal_unit: ""
    latex: "\\beta"
    description: "Companion Flux Fraction"
