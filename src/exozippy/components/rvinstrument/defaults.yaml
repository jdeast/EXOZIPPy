rvinstrument:
  gamma:
    lower: -300000000.0
    upper: 300000000.0
    initval: 0.0
    init_scale: 3.0
    unit: "m/s"
    internal_unit: "solRad/d"
    latex: "\\gamma"
    description: "Relative RV Offset"
  jitter_variance:
    lower: -1000.0
    upper: 100000.0
    initval: 0.0
    init_scale: 1.0
    unit: "m2/s2"
    internal_unit: "solRad2/d2"
    # Signed: it may go negative down to Instrument._jitter_floor, so neither
    # the label nor the description may promise a square. See calc_jitter.
    latex: "J|J|"
    description: "RV jitter variance"
  jitter:
    unit: "m/s"
    internal_unit: "solRad/d"
    # Not \sigma_J: this is signed, and a sigma promises positivity.
    latex: "J"
    description: "RV jitter"
    expressions:
      default:
        func_name: "calc_jitter"
        deps: [ "jitter_variance" ]
  # Optional GP amplitudes (components/defaults.yaml holds the rest of the GP
  # blueprint; only the amplitude is instrument-specific, because "GP
  # amplitude" is an RV here).  Upper bound matches gamma's own dynamic range.
  gp_rot_sigma:
    lower: 0.0
    upper: 100000.0
    initval: 5.0
    init_scale: 2.0
    unit: "m/s"
    internal_unit: "solRad/d"
  gp_sho_sigma:
    lower: 0.0
    upper: 100000.0
    initval: 5.0
    init_scale: 2.0
    unit: "m/s"
    internal_unit: "solRad/d"
  # Optional hogg-mixture outlier scatter (components/defaults.yaml holds the
  # rest of the robust-likelihood blueprint; only the scale is
  # instrument-specific, because "outlier scatter" is an RV here).
  out_scale:
    lower: 0.0
    upper: 100000.0
    initval: 100.0
    init_scale: 30.0
    unit: "m/s"
    internal_unit: "solRad/d"
  detrend_coeffs:
    # THE RULE (review 3.14.10): the design matrix is WHITENED at ingestion
    # (Instrument._build_block_detrend), so it is dimensionless, and the
    # coefficient therefore carries the units of WHATEVER THE DOT PRODUCT
    # FEEDS -- per unit of the raw column, which no unit system can name.
    # Here `rv_model += pt.dot(detrend, detrend_coeffs)` and rv_model is in
    # the internal solRad/d, so this is solRad/d internally and m/s to the
    # reader.  It said ""/"" until 2026-08 and so reported an RV
    # coefficient in solRad/d: a true 300 m/s per raw unit printed as
    # 0.0373.  Applying the same rule elsewhere: transit's is genuinely
    # dimensionless (normalized flux) and mulensinstrument's is in
    # MAGNITUDES, because its coefficient sits inside 10**(-0.4*...) even
    # though that component models flux.  Do not "fix" that one to flux.
    initval: 0.0
    init_scale: 0.1
    lower: -1.0e6
    upper: 1.0e6
    unit: "m/s"
    internal_unit: "solRad/d"
    latex: "c"
    description: "Detrending Coefficients"