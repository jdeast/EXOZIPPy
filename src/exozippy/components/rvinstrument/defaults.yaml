rvinstrument:
  gamma:
    lower: -300000000.0
    upper: 300000000.0
    initval: 0.0
    init_scale: 3.0
    unit: "m/s"
    internal_unit: "solRad/d"
    latex: "\\gamma"
    description: "Relative RV Offset"
  jitter_variance:
    lower: -1000.0
    upper: 100000.0
    initval: 0.0
    init_scale: 1.0
    unit: "m2/s2"
    internal_unit: "solRad2/d2"
    latex: "\\sigma_J^2"
    description: "Jitter Variance"
  jitter:
    unit: "m/s"
    internal_unit: "solRad/d"
    latex: "\\sigma_J"
    description: "Jitter"
    expressions:
      default:
        func_name: "calc_jitter"
        deps: [ "jitter_variance" ]
  # Optional GP amplitudes (components/defaults.yaml holds the rest of the GP
  # blueprint; only the amplitude is instrument-specific, because "GP
  # amplitude" is an RV here).  Upper bound matches gamma's own dynamic range.
  gp_rot_sigma:
    lower: 0.0
    upper: 100000.0
    initval: 5.0
    init_scale: 2.0
    unit: "m/s"
    internal_unit: "solRad/d"
  gp_sho_sigma:
    lower: 0.0
    upper: 100000.0
    initval: 5.0
    init_scale: 2.0
    unit: "m/s"
    internal_unit: "solRad/d"
  # Optional hogg-mixture outlier scatter (components/defaults.yaml holds the
  # rest of the robust-likelihood blueprint; only the scale is
  # instrument-specific, because "outlier scatter" is an RV here).
  out_scale:
    lower: 0.0
    upper: 100000.0
    initval: 100.0
    init_scale: 30.0
    unit: "m/s"
    internal_unit: "solRad/d"
  detrend_coeffs:
    initval: 0.0
    init_scale: 0.1
    lower: -1.0e6
    upper: 1.0e6
    unit: ""
    internal_unit: ""
    latex: "c"
    description: "Detrending Coefficients"