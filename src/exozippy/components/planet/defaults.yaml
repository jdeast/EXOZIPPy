planet:
  # log10 of the planet/host mass ratio is the SAMPLED coordinate whenever the
  # mass cannot be negative (mass is then derived as 10**log_q * star.mass).
  # See Planet._resolve_mass_parameterization for when that applies.  log_q
  # rather than log(mass) because the microlensing constraint measures q, not
  # the masses, and star.logmass is already the sampled stellar coordinate --
  # so the constraint becomes a shear of the sampled pair.  Measured on
  # examples/DC2018_128: planet.mass ESS 337 -> 3230, star.logmass 363 ->
  # 2865 (see "Planet mass parametrization" in
  # src/exozippy/components/star/star.md).
  # Base: log10.
  log_q:
    # q = 1e-9 is an order below lens.q's 1e-8 floor (itself 10x below the
    # most optimistic Roman detection floor); q = 10 keeps the "planet"-typed
    # body free to be more massive than its host, as lens.q's upper bound does.
    lower: -9.0
    upper: 1.0
    initval: -3.0  # ~Jupiter/Sun
    # d(log10 q) = dq / (q * ln 10); mass init_scale 0.1 Mjup at 1 Mjup around
    # a solar-mass host gives 0.1 / ln(10) ~ 0.043.
    init_scale: 0.043
    unit: ""
    internal_unit: ""
    latex: "\\log{q}"
    description: "$\\log_{10}{M_P/M_\\star}$"
    # rank 5 (below mass's 10) is load-bearing: the relaxation engine's
    # Condition B rewrites the LOWEST-rank symbol of a violated relation, so
    # log_q always absorbs Eq(mass, 10**log_q * star_mass).  That both gives
    # the right back-solve in log_q mode and makes the relation inert in
    # linear mode, where log_q is never materialized.
    rank: 5
  mass:
    initval: 1.0
    init_scale: 0.1
    lower: -1000.0
    upper: 260000.0
    unit: "jupiterMass"
    internal_unit: "solMass"
    latex: "M_P"
    description: "planet mass"
    rank: 10 # rank < 20 makes this the first to be overwritten if we have a constraint from somewhere else (e.g., K estimate)
    # Used only in log_q mode (manifest entry "mass": {"expr_key": "default"});
    # in linear mode the manifest declares mass free and this block is unused.
    # The lower/upper above are hard logit bounds when sampled and soft
    # barriers when derived -- in log_q mode the hard range comes from log_q.
    expressions:
      default:
        func_name: "calc_mass_from_log_q"
        deps: ["log_q", "star.mass"]
  # The mass ratio in LINEAR form, for every planet (EXOFASTv2's q).  log_q
  # above is the sampled coordinate of a log_q-mode planet only; a linear-mode
  # planet (RV or astrometry measures its orbit) has no log_q, so this is the
  # only place its mass ratio is reported.
  q:
    unit: ""
    internal_unit: ""
    latex: "q"
    description: "Mass Ratio ($M_P/M_\\star$)"
    expressions:
      default:
        func_name: "calc_planet_mass_ratio"
        deps: ["mass", "star.mass"]
  # Minimum mass (EXOFASTv2's msini); signed like mass in linear mode.
  msini:
    unit: "jupiterMass"
    internal_unit: "solMass"
    latex: "M_P\\sin{i}"
    description: "Minimum Mass"
    expressions:
      default:
        func_name: "calc_msini"
        deps: ["mass", "orbit.sini"]
  density:
    unit: "g/cm3"
    internal_unit: "solMass/solRad3"
    latex: "\\rho_P"
    description: "Density"
    expressions:
      default:
        func_name: "calc_density"
        deps: ["mass", "radius"]

  logg:
    unit: "dex(cm/s2)"
    internal_unit: "dex(cm/s2)"
    latex: "\\log{g_P}"
    description: "Surface Gravity"
    expressions:
      default:
        func_name: "calc_logg_from_mass"
        deps: ["mass", "radius"]

  radius:
    unit: "jupiterRad"
    lower: 0.000001
    upper: 100.0
    initval: 1.0
    init_scale: 0.1
    rank: 10
    internal_unit: "solRad"
    latex: "R_P"
    description: "planet radius"
  p:
    unit: ""
    internal_unit: ""
    latex: "R_P/R_*"
    description: "Radius Ratio"
    expressions:
      default:
        func_name: "calc_p"
        deps: ["radius", "star.radius"]

  K:
    unit: "m/s"
    internal_unit: "solRad/d"
    latex: "K"
    description: "Velocity Semi-amplitude"
    expressions:
      default:
        func_name: "calc_K"
        deps: ["mass", "m_total", "orbit.ecc", "a", "orbit.sini", "orbit.period"]
  a:
    unit: "AU"
    internal_unit: "solRad"
    latex: "a"
    description: "Semi-major Axis"
    # rank 5: the engine's Condition B rewrites the lowest-ranked
    # symbol of a violated relation, and this one is DERIVED -- its
    # runtime value is its expression -- so it must always be the
    # side that absorbs, never the mass/radius/period it comes from.
    rank: 5
    expressions:
      default:
        func_name: "calc_arsun"
        deps: ["m_total", "orbit.period"]
  ar:
    unit: ""
    internal_unit: ""
    latex: "a/R_*"
    description: "Semi-major Axis in $R_*$"
    # rank 5: the engine's Condition B rewrites the lowest-ranked
    # symbol of a violated relation, and this one is DERIVED -- its
    # runtime value is its expression -- so it must always be the
    # side that absorbs, never the mass/radius/period it comes from.
    rank: 5
    expressions:
      default:
        func_name: "calc_arstar"
        deps: ["a", "star.radius"]
  b:
    unit: ""
    internal_unit: ""
    latex: "b"
    description: "Transit Impact Parameter"
    expressions:
      default:
        func_name: "calc_b"
        deps: ["ar", "orbit.cosi", "orbit.ecc", "orbit.esinw"]
  # --- Transit and occultation geometry (review 8.8.7) --------------------
  # Winn 2010 eqs 14-16 (see planet/physics.py for the algebra and for why
  # EXOFASTv2's `tt` is deliberately absent).  These were bare Deterministics
  # built inside transit.py; as Parameters they get a table row, a LaTeX
  # macro, a unit -- and a user-settable Gaussian, which is the point:
  # a published duration and eclipse time CONSTRAIN e and omega, since
  # T_S/T_14 measures e sin omega and the eclipse phase measures e cos omega.
  # Declared whenever an orbit exists, transit data or not: an RV-only fit
  # has a perfectly well-defined transit duration, and refusing to state it
  # is what made the constraint unreachable.
  bs:
    unit: ""
    internal_unit: ""
    latex: "b_S"
    description: "Eclipse Impact Param."
    expressions:
      default:
        func_name: "calc_impact_secondary"
        deps: [ "ar", "orbit.cosi", "orbit.ecc", "orbit.esinw" ]
  t14:
    unit: "d"
    internal_unit: "d"
    latex: "T_{14}"
    description: "Transit Duration"
    expressions:
      default:
        func_name: "calc_t14"
        deps: [ "ar", "p", "orbit.cosi", "orbit.sini", "orbit.ecc", "orbit.esinw", "orbit.period" ]
  tfwhm:
    unit: "d"
    internal_unit: "d"
    latex: "T_{\\rm FWHM}"
    description: "FWHM Transit Duration"
    expressions:
      default:
        func_name: "calc_tfwhm"
        deps: [ "ar", "p", "orbit.cosi", "orbit.sini", "orbit.ecc", "orbit.esinw", "orbit.period" ]
  tau:
    unit: "d"
    internal_unit: "d"
    latex: "\\tau"
    description: "Ingress/Egress Duration"
    expressions:
      default:
        func_name: "calc_tau"
        deps: [ "ar", "p", "orbit.cosi", "orbit.sini", "orbit.ecc", "orbit.esinw", "orbit.period" ]
  t14s:
    unit: "d"
    internal_unit: "d"
    latex: "T_{S,14}"
    description: "Eclipse Duration"
    expressions:
      default:
        func_name: "calc_t14s"
        deps: [ "ar", "p", "orbit.cosi", "orbit.sini", "orbit.ecc", "orbit.esinw", "orbit.period" ]
  tfwhms:
    unit: "d"
    internal_unit: "d"
    latex: "T_{S,\\rm FWHM}"
    description: "FWHM Eclipse Duration"
    expressions:
      default:
        func_name: "calc_tfwhms"
        deps: [ "ar", "p", "orbit.cosi", "orbit.sini", "orbit.ecc", "orbit.esinw", "orbit.period" ]
  taus:
    unit: "d"
    internal_unit: "d"
    latex: "\\tau_S"
    description: "Eclipse Ingress Duration"
    expressions:
      default:
        func_name: "calc_taus"
        deps: [ "ar", "p", "orbit.cosi", "orbit.sini", "orbit.ecc", "orbit.esinw", "orbit.period" ]

  m_total:
    internal_unit: "solMass"
    unit: "solMass"
    latex: "M_{\\rm tot}"
    description: "Total System Mass"
    # rank 5: the engine's Condition B rewrites the lowest-ranked
    # symbol of a violated relation, and this one is DERIVED -- its
    # runtime value is its expression -- so it must always be the
    # side that absorbs, never the mass/radius/period it comes from.
    rank: 5
    expressions:
      default:
        func_name: "calc_m_total"
        deps: ["mass", "star.mass"]
  max_ecc:
    unit: ""
    internal_unit: ""
    latex: "e_{\\rm max}"
    description: "Collision Eccentricity Limit"
    expressions:
      default:
        func_name: "calc_max_ecc"
        deps: ["ar", "p"]

  # Geometric depth (R_P/R_*)^2; EXOFASTv2's delta.  Its limb-darkened
  # `depth` is per band and not ported (see planet/physics.py).
  delta:
    unit: ""
    internal_unit: ""
    latex: "\\delta"
    description: "Geometric Transit Depth, $(R_P/R_*)^2$"
    expressions:
      default:
        func_name: "calc_delta"
        deps: ["p"]
  # Adams & Laughlin 2006 eq 2 with Q_P = 1e6, as EXOFASTv2; the physics
  # returns Gyr, so both units are Gyr (see planet/physics.py).
  tcirc:
    unit: "Gyr"
    internal_unit: "Gyr"
    latex: "\\tau_{\\rm circ}"
    description: "Tidal Circularization Timescale"
    expressions:
      default:
        func_name: "calc_tcirc"
        deps: ["a", "ar", "p", "mass", "star.mass", "orbit.ecc"]
  # GR apsidal precession.  Internal rad/d; reported in EXOFASTv2's
  # deg/century -- `century` is EXOZIPPy's own registered astropy unit
  # (exozippy/units.py), so a user may still override to arcsec/yr etc.
  omegagr:
    unit: "deg/century"
    internal_unit: "rad/d"
    latex: "\\dot{\\omega}_{\\rm GR}"
    description: "GR Apsidal Precession Rate"
    expressions:
      default:
        func_name: "calc_omegagr"
        deps: ["a", "star.mass", "orbit.period", "orbit.ecc"]

  # --- A priori transit / eclipse probabilities (Winn 2010 eq 9) ----------
  # EXOFASTv2's pt/ptg/ps/psg; see planet/physics.py.  "G" = grazing
  # geometries included; without it, full (non-grazing) events only.
  ptg:
    unit: ""
    internal_unit: ""
    latex: "P_{T,G}"
    description: "A priori Transit Prob."
    expressions:
      default:
        func_name: "calc_ptg"
        deps: ["ar", "p", "orbit.ecc", "orbit.esinw"]
  pt:
    unit: ""
    internal_unit: ""
    latex: "P_T"
    description: "A priori Non-grazing Transit Prob."
    expressions:
      default:
        func_name: "calc_pt"
        deps: ["ar", "p", "orbit.ecc", "orbit.esinw"]
  psg:
    unit: ""
    internal_unit: ""
    latex: "P_{S,G}"
    description: "A priori Eclipse Prob."
    expressions:
      default:
        func_name: "calc_psg"
        deps: ["ar", "p", "orbit.ecc", "orbit.esinw"]
  ps:
    unit: ""
    internal_unit: ""
    latex: "P_S"
    description: "A priori Non-grazing Eclipse Prob."
    expressions:
      default:
        func_name: "calc_ps"
        deps: ["ar", "p", "orbit.ecc", "orbit.esinw"]

  # --- Irradiation (EXOFASTv2 derivepars.pro's teq and fave) --------------
  # See planet/physics.py for the two formulas and their assumptions.
  teq:
    unit: "K"
    internal_unit: "K"
    latex: "T_{\\rm eq}"
    description: "Equilibrium Temperature"
    expressions:
      default:
        func_name: "calc_teq"
        deps: ["star.teff", "ar"]
  # Reported in units of Earth's insolation (1361 W m-2, IAU 2015 nominal
  # solar irradiance), not EXOFASTv2's 10^9 erg s-1 cm-2 -- the physics
  # function applies that scale, since it is not an astropy unit.
  fave:
    unit: ""
    internal_unit: ""
    latex: "\\langle F \\rangle"
    description: "Time-averaged Incident Flux ($S_\\oplus$)"
    table_note: "In units of Earth's insolation, $S_\\oplus = 1361$ W m$^{-2}$"
    expressions:
      default:
        func_name: "calc_fave"
        deps: ["star.teff", "ar", "orbit.ecc"]

  # PR 1.b (BEER): Doppler beaming amplitude, in ppm (EXOFASTv2's
  # ss.planet[i].beam). Off by default (pinned to 0 unless fitbeam or
  # beam_constrains_mass is set; see Planet.register_parameters), like
  # thermal/reflect/ellipsoidal on Band. Unlike those three, beam is an odd
  # (sine) function of orbital phase -- it tracks the star's directional
  # line-of-sight velocity, not a magnitude -- so unlike their lower: 0.0,
  # beam is allowed either sign; only beam_constrains_mass's K-derived
  # expression (always >= 0, since K itself is a non-negative amplitude)
  # picks a definite sign in practice.
  beam:
    lower: -1.0e6
    upper: 1.0e6
    initval: 0.0
    init_scale: 100.0
    unit: ""
    internal_unit: ""
    latex: "A_B"
    description: "Doppler beaming amplitude (ppm)"
    expressions:
      default:
        func_name: "calc_beam_from_K"
        deps: ["K"]
