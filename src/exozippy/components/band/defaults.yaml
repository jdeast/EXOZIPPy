band:
  # Kipping (2013) q1/q2 parameterization for quadratic LD.
  # Both parameters are bounded [0,1], which guarantees physical u1/u2.
  q1:
    lower: 0.0
    upper: 1.0
    initval: 0.2
    init_scale: 0.05
    unit: ""
    internal_unit: ""
    latex: "q_1"
    description: "Kipping limb-darkening parameter"
  q2:
    lower: 0.0
    upper: 1.0
    initval: 0.3
    init_scale: 0.05
    unit: ""
    internal_unit: ""
    latex: "q_2"
    description: "Kipping limb-darkening parameter"
  # u1 is the linear LD coefficient for both laws:
  #   linear law  — sampled directly (no expression used)
  #   quadratic   — derived via Kipping: 2 * sqrt(q1) * q2
  u1:
    lower: 0.0
    upper: 2.0
    initval: 0.3
    init_scale: 0.05
    unit: ""
    internal_unit: ""
    latex: "u_1"
    description: "Linear limb-darkening coefficient"
    expressions:
      default:
        func_name: "calc_u1_from_kipping"
        deps: ["q1", "q2"]
  u2:
    lower: -1.0
    upper: 1.0
    unit: ""
    internal_unit: ""
    latex: "u_2"
    description: "Quadratic limb-darkening coefficient"
    expressions:
      default:
        func_name: "calc_u2_from_kipping"
        deps: ["q1", "q2"]
  # The Claret limb-darkening tie (star_constrains_ld, opt-in per band):
  # the offset of each coefficient from the Claret table interpolated at the
  # band's star's (teff, logg, feh).  DERIVED on the tied bands (du2 on the
  # tied QUADRATIC ones) and inactive elsewhere; u1_claret/u2_claret are
  # context nodes Band.add_parameter injects (the mulensinstrument.zeropoint
  # pattern).  The Gaussian below IS the tie, once per band.
  #
  # Unlike zeropoint -- which deliberately has NO default mu/sigma, because
  # its centre and width are facts about the user's own calibration (review
  # 2.2.21) -- this one has a default, and that is not an inconsistency to
  # "fix": the centre is computed from the tables, and 0.05 is EXOFASTv2's
  # width for the tables' own accuracy (exofast_chi2v2.pro), the same kind of
  # statement as the Torres scatter.  A params entry changes it per band
  # (band.TESS.du1: {sigma: 0.1}) or for all (band.du1: {sigma: 0.1}).
  # No bounds: a derived element with bounds gets a barrier, and the
  # physical region is already enforced on the sampled q1/q2 (or u1).
  du1:
    mu: 0.0
    sigma: 0.05
    unit: ""
    internal_unit: ""
    latex: "u_1 - u_{1,\\rm C}"
    description: "Linear LD coefficient minus its Claret table value"
    expressions:
      default:
        func_name: "calc_ld_offset"
        deps: ["u1", "u1_claret"]
  du2:
    mu: 0.0
    sigma: 0.05
    unit: ""
    internal_unit: ""
    latex: "u_2 - u_{2,\\rm C}"
    description: "Quadratic LD coefficient minus its Claret table value"
    expressions:
      default:
        func_name: "calc_ld_offset"
        deps: ["u2", "u2_claret"]
  # Constant secondary-eclipse thermal emission, in ppm (EXOFASTv2's
  # ss.band[i].thermal). Off by default (pinned to 0 in Band.register_parameters
  # unless the band sets fitthermal: true) so the transit model is unchanged
  # when the feature isn't used. Values are plain ppm, not an astropy-unit
  # conversion (matches exofast_tran.pro's 1d-6*thermal literal) since "ppm"
  # isn't a valid astropy unit string.
  # PR 1.a: constant emission + secondary eclipse only. Phase-curve variation
  # (BEER: reflection, ellipsoidal, beaming) is deferred to PR 1.b.
  thermal:
    lower: 0.0
    upper: 1.0e6
    initval: 0.0
    init_scale: 100.0
    unit: ""
    internal_unit: ""
    latex: "A_T"
    description: "Planet thermal emission"
  # PR 1.b (BEER): phase-dependent reflection and ellipsoidal variation.
  # Same opt-in/omitted-unless-flagged pattern as thermal (see fitreflect/
  # fitellip in Band.register_parameters). Beaming (the "B" in BEER) lives
  # on the Planet component instead -- see planet/defaults.yaml -- since
  # EXOFASTv2 declares it per-planet (ss.planet[i].beam), not per-band.
  reflect:
    lower: 0.0
    upper: 1.0e6
    initval: 0.0
    init_scale: 100.0
    unit: ""
    internal_unit: ""
    latex: "A_R"
    description: "Planet reflected light"
  ellipsoidal:
    lower: 0.0
    upper: 1.0e6
    initval: 0.0
    init_scale: 100.0
    unit: ""
    internal_unit: ""
    latex: "A_E"
    description: "Ellipsoidal variation"
