lens:
  # t_0 and u_0 are DATA-DERIVED: their real start comes from the NNLS/grid
  # bootstrap or from MMEXOFAST seeds, both of which enter at
  # RANK_DERIVED_DATA (60) and so beat these RANK_DEFAULT (20) values in
  # every topology that supplies one.  The static numbers are a backstop for
  # the case where nothing does -- every sampled parameter must carry an
  # initval from somewhere, or `sigma: 0` on it would pin it at 0.0 (see the
  # "pinned with no value" check in Parameter.build_pymc).  Neither symbol
  # appears in any RELATION, so a defaults seed here cannot propagate into
  # another parameter's provenance and cannot change what
  # mmexofast_support.user_hints_sufficient concludes.
  t_0:
    unit: "d"
    lower: 2400000
    upper: 3000000
    initval: 2460000  # a BJD_TDB inside the bounds; the data always override
    init_scale: 0.01
    internal_unit: "d"
    latex: "t_0"
    description: "Time of peak magnification"
  u_0:
    unit: ""
    lower: -18 # ~20 ppm peak magnification
    upper: 18 # ~20 ppm peak magnification
    initval: 0.5  # a mid-range, unambiguously magnified trajectory
    init_scale: 0.01
    internal_unit: ""
    latex: "u_0"
    description: "impact parameter"
  # t_E and the pi_E direction live in the light curve's GEOCENTRIC frame
  # (Skowron+2011 t0_par anchor), so they derive from mu_rel_geo, not from
  # the heliocentric pm difference.
  t_E:
    lower: 0.0
    unit: "d"
    internal_unit: "d"
    latex: "t_E"
    description: "Einstein crossing time"
    debug_print: true
    expressions:
      default:
        func_name: "calc_t_E"
        deps: [ "theta_E", "mu_rel_geo_mag" ]
  pi_E_N:
    initval: 0.0
    unit: ""
    internal_unit: ""
    latex: "\\pi_{\\rm E,N}"
    description: "Parallax vector (North)"
    debug_print: true
    expressions:
      default:
        func_name: "calc_pi_E_N"
        deps: [ "pi_rel", "theta_E", "mu_dec_rel_geo", "mu_rel_geo_mag" ]
  pi_E_E:
    initval: 0.0
    unit: ""
    internal_unit: ""
    latex: "\\pi_{\\rm E,E}"
    description: "Parallax vector (East)"
    debug_print: true
    expressions:
      default:
        func_name: "calc_pi_E_E"
        deps: [ "pi_rel", "theta_E", "mu_ra_rel_geo", "mu_rel_geo_mag" ]
  # NOTE on lens_map: it names the primary lens body by INDEX only, and it
  # serves two different roles -- the lensing MASS (star.mass[lens_map],
  # theta_E below) and the KINEMATIC HOST (star.distance/pm_ra/pm_dec
  # [lens_map], pi_rel and mu_rel).  Those coincide only because the primary
  # lens body is always a star, which Lens._validate_bodies enforces; see
  # the longer note in Lens.build_maps.  Do not add a non-star primary
  # without splitting the two.
  pi_rel:
    lower: 0.0
    upper: 10000
    unit: "mas"
    internal_unit: "mas"
    latex: "\\pi_{rel}"
    description: "lens-source parallax"
    expressions:
      default:
        func_name: "calc_pi_rel"
        deps: [ "star.distance[lens_map]", "star.distance[source_map]"]
      # Selected by `fitpirel: true` (swap 2 of the surgical coordinate
      # plan): pi_rel becomes the sampled coordinate (as log_pi_rel) and
      # the LENS star's distance is derived instead (see star.py).
      from_log_pi_rel:
        func_name: "calc_pi_rel_from_log"
        deps: [ "log_pi_rel" ]
  log_pi_rel:
    # Sampled ONLY when the lens sets `fitpirel: true`; otherwise absent.
    # Log coordinate: pi_rel spans decades.  NO initval here (the
    # engine's default-armor registers every defaults initval for every
    # config -- the mu_rel lesson, commit 4745cd7e); the relaxation
    # engine back-solves the start from the distances through the
    # pi_rel <-> log_pi_rel relation.
    #
    # Upper = 10 mas (lens beyond ~100 pc): in physical coordinates the
    # galactic d^2 volume prior made nearer lenses vanishingly rare, but
    # a flat-in-log measure up to the old arcsecond ceiling handed the
    # hot tempering chains ~40% of the coordinate range with pi_E ~ 10
    # -- wildly looping parallax trajectories in VBM's most expensive
    # regime.  The first fitpirel A/B arm (job 15363587) drowned in
    # eval_timeouts within minutes, the same operational signature as
    # log_rho's cap (1e162a1a).  A genuinely nearby lens is exotica the
    # user can override per event.
    lower: -4.0
    upper: 1.0
    unit: ""
    internal_unit: ""
    latex: "\\log\\pi_{rel}"
    description: "log10 rel. parallax"
  theta_E:
    lower: 0.0
    upper: 1000.0
    unit: "mas"
    internal_unit: "mas"
    latex: "\\theta_E"
    description: "Einstein angular radius"
    expressions:
      default:
        func_name: "calc_theta_E"
        deps: [ "star.mass[lens_map]", "pi_rel" ]
      # Selected by `fitthetae: true` (swap 3): theta_E becomes the
      # sampled coordinate (as log_theta_E) and the HOST star's logmass
      # is derived instead (see star.py).  In log coordinates the map is
      # LINEAR (logM = 2 log theta_E - log kappa pi_rel - log(1+q)), so
      # unlike fitpirel there is no Jacobian potential: |J| = 2, constant.
      from_log_theta_E:
        func_name: "calc_theta_E_from_log"
        deps: [ "log_theta_E" ]
  log_theta_E:
    # Sampled ONLY when the lens sets `fitthetae: true`; otherwise absent.
    # Log coordinate: theta_E spans ~1e-2 mas (FFP) to ~10 mas (nearby
    # stellar lens).  NO initval (the mu_rel lesson, 4745cd7e): the
    # engine back-solves the start through theta_E <-> log_theta_E.
    lower: -4.0
    upper: 2.0
    unit: ""
    internal_unit: ""
    latex: "\\log\\theta_E"
    description: "log10 Einstein radius"
  # mu_ra_rel / mu_dec_rel / mu_rel_mag are HELIOCENTRIC: differences of the
  # stars' barycentric proper motions (the frame the galactic kinematic
  # prior and Gaia priors constrain).  The *_geo trio below converts to the
  # geocentric frame at t0_par for the light-curve chain.
  mu_ra_rel:
    # Sampled (fitmurel: true) or derived (default).  fitmurel makes the
    # LC-measured relative pm the coordinate and derives the lens star's
    # pm = pm_source + mu_rel instead (|J| = 1).  NO initval here: a
    # defaults.yaml initval is registered by the relaxation engine's
    # default-armor for EVERY config, and a mu_rel = 0 seed broke the
    # t_E = theta_E/mu_rel derivation chain everywhere (six-test suite
    # regression, ezsuite 15362719).  The fitmurel start arrives through
    # the lens manifest's overrides channel instead, which only exists
    # when the mode is selected.
    lower: -10000.0
    upper: 10000.0
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_{\\alpha,rel,helio}"
    description: "heliocentric lens-source pm RA"
    expressions:
      default:
        func_name: "calc_mu_ra_rel"
        deps: [ "star.pm_ra[lens_map]", "star.pm_ra[source_map]" ]
  mu_dec_rel:
    # Sampled (fitmurel: true) or derived (default).  fitmurel makes the
    # LC-measured relative pm the coordinate and derives the lens star's
    # pm = pm_source + mu_rel instead (|J| = 1).  NO initval here: a
    # defaults.yaml initval is registered by the relaxation engine's
    # default-armor for EVERY config, and a mu_rel = 0 seed broke the
    # t_E = theta_E/mu_rel derivation chain everywhere (six-test suite
    # regression, ezsuite 15362719).  The fitmurel start arrives through
    # the lens manifest's overrides channel instead, which only exists
    # when the mode is selected.
    lower: -10000.0
    upper: 10000.0
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_{\\delta,rel,helio}"
    description: "heliocentric lens-source pm Dec"
    expressions:
      default:
        func_name: "calc_mu_dec_rel"
        deps: [ "star.pm_dec[lens_map]", "star.pm_dec[source_map]" ]
  mu_rel_mag:
    lower: 0.0
    upper: 10000
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_{rel,helio}"
    description: "heliocentric lens-source pm"
    expressions:
      default:
        func_name: "calc_mu_rel_mag"
        deps: ["mu_ra_rel", "mu_dec_rel"]
  # Geocentric (t0_par frame, Gould 2004): mu_geo = mu_helio -
  # pi_rel * v_earth_perp(t0_par)/AU.  earth_vperp_e/n are context
  # constants injected by Lens.add_parameter (Earth's velocity at t0_par
  # projected on East/North, AU/yr), declared in Lens.context_dep_names.
  mu_ra_rel_geo:
    lower: -10000.0
    upper: 10000.0
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_{\\alpha,rel,geo}"
    description: "geocentric lens-source pm RA"
    expressions:
      default:
        func_name: "calc_mu_ra_rel_geo"
        deps: [ "mu_ra_rel", "pi_rel", "earth_vperp_e" ]
  mu_dec_rel_geo:
    lower: -10000.0
    upper: 10000.0
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_{\\delta,rel,geo}"
    description: "geocentric lens-source pm Dec"
    expressions:
      default:
        func_name: "calc_mu_dec_rel_geo"
        deps: [ "mu_dec_rel", "pi_rel", "earth_vperp_n" ]
  mu_rel_geo_mag:
    lower: 0.0
    upper: 10000
    unit: "mas/yr"
    internal_unit: "mas/yr"
    latex: "\\mu_{rel,geo}"
    description: "geocentric lens-source pm"
    expressions:
      default:
        func_name: "calc_mu_rel_mag"
        deps: ["mu_ra_rel_geo", "mu_dec_rel_geo"]
  rho:
    # Soft upper barrier only: real events have rho <~ 0.5, and rho >~ a few
    # both erases the microlensing signal (A -> 1) and drives VBM's
    # finite-source machinery into its most expensive regime (see the
    # eval_timeout analysis in the DC2018_128 example).  No lower bound:
    # rho > 0 by construction, and a barrier at 0 would bias small-rho fits.
    upper: 10.0
    unit: ""
    internal_unit: ""
    latex: "\\rho"
    description: "source radius"
    expressions:
      default:
        func_name: "calc_rho"
        deps: [ "star.radius[source_map]", "star.distance[source_map]", "theta_E" ]
      # Selected by `star_constrains_rho: false` on the lens: rho becomes the light
      # curve's own parameter (via the sampled log_rho) and the stellar
      # chain's prediction moves to rho_pred, so the two never silently
      # trade against each other (see rho_pred's note).
      from_log_rho:
        func_name: "calc_rho_from_log"
        deps: [ "log_rho" ]
  log_rho:
    # Sampled ONLY when the lens sets `star_constrains_rho: false`; otherwise absent
    # from the manifest entirely.  Log coordinate because candidate rho
    # spans decades (mirrors log_s/s and planet log_q).  Upper = rho 0.5:
    # rho's own comment already says real events live below ~0.5 and that
    # larger rho both erases the signal (A -> 1) and drives VBM's
    # finite-source machinery into its most expensive regime -- and the
    # first severed 128 run proved it operationally: hot tempering chains
    # pushed the free log_rho toward the old rho<=10 bound and drowned the
    # run in 10s eval_timeout rejections and worker-pool recycling.  The
    # derived rho keeps its soft 10 cap; only the SAMPLED coordinate is
    # confined to the physical regime.  The lower bound sits far below any
    # detectable finite-source effect, where the likelihood is flat in
    # log_rho and the fit degrades gracefully to point-source.
    lower: -6.0
    upper: -0.301
    initval: -2.0
    init_scale: 0.1
    unit: ""
    internal_unit: ""
    latex: "\\log\\rho"
    description: "log10 source radius"
  rho_pred:
    # The stellar chain's prediction theta_star/theta_E, reported ONLY when
    # `star_constrains_rho: false` severs rho = theta_star/theta_E (with
    # the identity intact this would duplicate rho's row).  Publishing both
    # makes the pull between the light curve's rho and the chain's rho a
    # visible number: on DC2018 event 128 the identity + the event-rate
    # prior + the Hogg mixture silently resolved a 601-nat disagreement in
    # the prior's favor (rho low by ~8x); a reported rho vs rho_pred pull
    # is the diagnostic that failure mode cannot hide from.
    # The severed pair also composes with the user link machinery into a
    # SOFT tie (star_constrains_rho: false + params
    # lens.Lens.rho: {initval: <n>, mu: lens.Lens.rho_pred, sigma: 0.002};
    # mu link = Gaussian potential on the difference; keep a NUMERIC
    # initval -- an initval link replaces the seed and can trip the
    # MMEXOFAST sufficiency probe).  It builds and is pinned by test
    # (tests/test_star_constrains_rho.py), but it is NOT a recommended
    # third mode: rho = theta_star/theta_E is exact physics, so any
    # nonzero sigma inserts arbitrary slop between quantities that have
    # none, and a tight-but-nonzero tie is a narrow curved ridge in the
    # joint space -- hard to traverse for exactly the gradient-free
    # samplers this component requires.  The two honest positions are the
    # exact identity (default; it already blends the light curve's and
    # the chain's information optimally when both are sound) and fully
    # severed with the rho vs rho_pred pull reported (when one of them
    # may not be).
    upper: 10.0
    unit: ""
    internal_unit: ""
    latex: "\\rho_{\\rm pred}"
    description: "chain-predicted rho"
    expressions:
      default:
        func_name: "calc_rho"
        deps: [ "star.radius[source_map]", "star.distance[source_map]", "theta_E" ]
  mlens_total:
    lower: 0.0
    upper: 500.0
    unit: "solMass"
    internal_unit: "solMass"
    latex: "M_{\\rm L,tot}"
    description: "total lens mass"
    debug_print: true
    expressions:
      default:
        func_name: "calc_mlens_total"
        deps: [ "star.mass[lens_map]" ]  # overridden per-config with all lens bodies
  # Binary lens parameters (N_lenses - 1 per event)
  q:
    # Lower bound sits 10x below the most optimistic Roman detection floor
    # (~Moon mass, q ~ 1e-7 at 0.3 Msun); below it the companion is pure
    # nuisance volume with a likelihood flat in (s, alpha, q).  See
    # vbm_fix.txt section 6.
    lower: 1e-8
    upper: 100.0  # q > 1 is legal (companion more massive than the "primary"); MulensModel supports it
    unit: ""
    internal_unit: ""
    latex: "q"
    description: "mass ratio ($M_2/M_1$)"
    debug_print: true
    expressions:
      default:
        func_name: "calc_q"
        # overridden per-config: one scalar map per companion, primary last
        deps: ["planet.mass[companion0_mass_map]", "star.mass[primary_lens_map]"]
  alpha:
    unit: "deg"
    internal_unit: "rad"
    latex: "\\alpha"
    description: "Source trajectory angle"
    debug_print: true
    expressions:
      default:
        func_name: "calc_alpha"
        deps: [ "xalpha", "yalpha" ]
  # log10 of the projected separation is the SAMPLED coordinate (s below is
  # derived as 10**log_s).  Sampling in log_s makes the close/wide degeneracy
  # an exact reflection log_s -> -log_s with |J| = 1, which the mode-jump
  # proposals / folded likelihood (notes/multimode_implementation.txt) rely on,
  # and matches MMEXOFAST's base-10 log_s sigma convention.  Base: log10.
  log_s:
    # log10 of the s bounds below: [0.1, 10] -> [-1, 1].  Symmetric about 0 so
    # the close/wide reflection maps the domain onto itself.
    lower: -1.0
    upper: 1.0
    initval: 0.0
    # d(log10 s) = ds / (s * ln 10); the old s init_scale 0.05 at s = 1 gives
    # 0.05 / ln(10) ~ 0.0217.
    init_scale: 0.0217
    unit: ""
    internal_unit: ""
    latex: "\\log{s}"
    description: "$\\log_{10}$ binary separation"
  # might want to parameterize this like Yee's that increases sampling at s=1
  s:
    # Derived from log_s (s = 10**log_s).  The bounds here mirror log_s's
    # [-1, 1] domain ([0.1, 10]) and leave >~2x margin beyond every published
    # solution (smallest known ~0.3, widest ~5.3) while keeping tempering
    # chains out of VBM's expensive corners (see vbm_fix.txt section 6; the
    # s=20 wall hosted the extreme-magnification eval_timeout excursions in
    # DC2018_128).  Events genuinely needing s > 10 should override log_s (or
    # lens.s, auto-translated) in their params file.
    lower: 0.1
    upper: 10.0
    init_scale: 0.05
    unit: ""
    internal_unit: ""
    latex: "s"
    description: "binary separation"
    expressions:
      default:
        func_name: "calc_s"
        deps: [ "log_s" ]
  xalpha:
    lower: -100.0
    upper: 100.0
    initval: 0.0
    init_scale: 0.01
    mu: 0.0
    sigma: 1.0
    unit: ""
    internal_unit: ""
    latex: "x_{\\alpha}"
    description: "x-component of $\\alpha$"
  yalpha:
    lower: -100.0
    upper: 100.0
    initval: 0.0
    init_scale: 0.01
    mu: 0.0
    sigma: 1.0
    unit: ""
    internal_unit: ""
    latex: "y_{\\alpha}"
    description: "y-component of $\\alpha$"
mulensinstrument:
  # Optional detrending coefficients, one per extra data column per
  # instrument (see rvinstrument/transit for the same block-diagonal scheme).
  # These stay MAGNITUDE-space coefficients -- a throughput/extinction trend
  # is multiplicative in flux -- so the flux model is scaled by
  # 10**(-0.4 * X.c).  Unchanged by the move to a flux likelihood.
  detrend_coeffs:
    initval: 0.0
    init_scale: 0.01
    lower: -1.0e6
    upper: 1.0e6
    unit: "mag"
    internal_unit: "mag"
    latex: "c"
    description: "Detrending Coefficients"
  # UNIT CHANGE: these three amplitudes used to be in MAGNITUDES and are now
  # in FLUX -- the observable this component models and fits (see
  # MulensInstrument's class docstring).  A prior written against the old
  # magnitude units means something different now; rewrite it.
  #
  # A light curve's flux zeropoint is arbitrary (10**(-0.4 m) ~ 1e-8 for a
  # magnitude file, O(1) or O(1e4) counts for difference imaging), so the
  # bounds and starts below are only ceilings and last-resort fallbacks:
  # MulensInstrument._scale_flux_amplitudes installs the usable per-light-curve
  # upper/initval from that file's bootstrapped baseline flux, through the
  # "overrides" channel, i.e. still under any user override.
  # The rest of the GP blueprint is in components/defaults.yaml.
  gp_rot_sigma:
    lower: 0.0
    upper: 1.0e30
    initval: 0.02
    init_scale: 0.01
    unit: ""
    internal_unit: ""
    description: >-
      GP rotation-term amplitude, in FLUX in the data file's own system
      (was magnitudes before the flux-likelihood change)
  gp_sho_sigma:
    lower: 0.0
    upper: 1.0e30
    initval: 0.02
    init_scale: 0.01
    unit: ""
    internal_unit: ""
    description: >-
      GP SHO-term amplitude, in FLUX in the data file's own system
      (was magnitudes before the flux-likelihood change)
  # Optional hogg-mixture outlier scatter; the rest of the robust-likelihood
  # blueprint lives in components/defaults.yaml.
  out_scale:
    lower: 0.0
    upper: 1.0e30
    initval: 0.2
    init_scale: 0.1
    unit: ""
    internal_unit: ""
    description: >-
      Outlier-component scatter, in FLUX in the data file's own system
      (was magnitudes before the flux-likelihood change)
  log_f_total:
    initval: -6
    init_scale: 3e-4
    lower: -100
    upper: 10.0
    unit: ""
    internal_unit: ""
    latex: "\\log{(f_s + f_b)}"
    description: "log baseline flux ($f_s{+}f_b$)"
  q_source:
    initval: 0.95
    init_scale: 0.05
    lower: 0.0
    upper: 2.0
    unit: ""
    internal_unit: ""
    latex: "q_s"
    description: "source flux fraction ($q_s$)"
  q_flux:
    initval: 1.0
    init_scale: 0.1
    lower: 0.0
    upper: 1000.0
    unit: ""
    internal_unit: ""
    latex: "q_F"
    description: "binary source flux ratio"
  f_source:
    lower: 0.0
    upper: 1000.0
    unit: ""
    internal_unit: ""
    latex: "f_s"
    description: "Source flux"
    expressions:
      default:
        func_name: "calc_f_source"
        deps: [ "log_f_total", "q_source" ]
  f_blend:
    lower: -1000.0
    upper: 1000.0
    unit: ""
    internal_unit: ""
    latex: "f_b"
    description: "Blend flux"
    expressions:
      default:
        func_name: "calc_f_blend"
        deps: [ "log_f_total", "q_source" ]
  # Multiplicative error scale: sigma = err * err_scale.  It is dimensionless
  # in flux for the same reason it was dimensionless in magnitudes -- it
  # multiplies whatever error bar the file reports -- so unlike the three
  # amplitudes above it did not need a unit change.  It now scales the FLUX
  # error; for a magnitude file that is the propagated sigma_F = F*sigma_m/K,
  # so to first order an existing prior still says what it said.
  # mulensinstrument has no jitter_variance (noise_model = "err_scale"), so
  # there is no additive noise term to re-unit either.
  err_scale:
    initval: 1.0
    init_scale: 0.1
    lower: 1e-6
    upper: 1e6
    unit: ""
    internal_unit: ""
    latex: "k"
    description: "error scale"
  # DERIVED, not sampled: zp = m_SED + 2.5*log10(f_source) is determined by
  # f_source and the SED, so it adds no sampled dimension -- exactly the
  # analytic substitution it has always been.  It IS an ordinary Parameter
  # now, though (manifest entry registered by
  # MulensInstrument.register_parameters when a sed: block exists), so the
  # Gaussian below is applied by Parameter.build_pymc's derived-with-sigma
  # branch rather than by a hand-built pm.Potential, and every generic
  # facility -- unit conversion, the LaTeX table, links, bound_scale -- works
  # on it.  Override per light curve in params.yaml; sigma must be nonzero
  # (an exact zeropoint would make f_source deterministic given the SED).
  neighbor_flux:
    # Third light: blend flux NOT supplied by any modeled star, in the data
    # file's own flux system.  Exists because the blend-tie assumption
    # f_blend = (modeled non-source stars) is violated as a RULE at Roman
    # resolution: across the 44 Roman-fidelity DC2018 events the lens star
    # supplies a median 15% of the blend, and unrelated line-of-sight stars
    # dominate it in 80% of events.  With this term the tie becomes the
    # physically correct inequality f_blend >= f_lens (positivity does the
    # work).  Sampled ONLY on light curves with `sed_constrains_blend: true`
    # -- with the tie off, f_blend is already free and a neighbor term is
    # exactly degenerate with it in ANY light curve, finite-source or not
    # (the light curve measures only the sum).  upper/initval are installed
    # per light curve from the bootstrapped baseline flux, like the other
    # flux amplitudes: the file's flux zeropoint is arbitrary.
    lower: 0.0
    upper: 1.0e+30
    initval: 0.0
    init_scale: 0.1
    unit: ""
    internal_unit: ""
    description: "Neighbor blend flux"
    latex: f_{\rm nb}

  zeropoint:
    # No `initval:` key, like every other DERIVED parameter in this file
    # (f_source, f_blend, s, ...): the expression IS the value.  It carried a
    # purely defensive `initval: 0.0` only to satisfy "every sampled
    # parameter carries an initval", and that check (pinned-with-no-value, in
    # Parameter.build_pymc) exempts derived elements outright -- so the
    # reason for it is gone, and a second number duplicating mu is one more
    # thing to keep in sync.  `mu` is the start, through resolve()'s ordinary
    # "user gave mu but no initval" rule, exactly as for every other
    # Gaussian-prior parameter.
    mu: 0.0
    sigma: 0.2
    unit: "mag"
    internal_unit: "mag"
    latex: "ZP"
    description: "photometric zeropoint"
    expressions:
      default:
        # m_source_pred / zp_center / sed_constrained are context nodes
